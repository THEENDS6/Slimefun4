name: SlimeFunX
main: cc.theends6.sfx.SlimeFunXPlugin
version: a1
api-version: '1.21'
folia-supported: true
authors: [THEENDS6]
description: Restored Slimefun-style content and guide runtime for Paper 1.21.8.
load: POSTWORLD
softdepend: [packetevents, PacketEvents, ProtocolLib, ProtocolSupport, ViaVersion, ViaBackwards, ViaRewind, Geyser-Spigot]

commands:
  slimefunx:
    description: SlimeFunX main command
    usage: /slimefunx <guide|cheatguide|book|give|research|backpack|inspect|list|reload [all]>
    aliases: [sfx, sf, x]

permissions:
  sfx.command.guide:
    description: Allows opening the survival guide
    default: true
  sfx.command.book:
    description: Allows receiving the survival guide book
    default: true
  sfx.command.cheatguide:
    description: Allows opening the cheat guide
    default: op
  sfx.command.cheatbook:
    description: Allows receiving the cheat guide book
    default: op
  sfx.command.give:
    description: Allows directly receiving SFX items
    default: op
  sfx.command.research:
    description: Allows managing SFX researches
    default: op
  sfx.command.backpack:
    description: Allows managing SFX backpacks
    default: op
  sfx.command.inspect:
    description: Allows inspecting SFX item markers
    default: op
  sfx.command.list:
    description: Allows viewing the SFX item list
    default: true
  sfx.command.reload:
    description: Allows reloading SFX config and language files
    default: op
