  book:
    received: <green>已领取科技书。</green>
    received-cheat: <green>已领取作弊科技书。</green>
  give:
    usage: '<red>用法: /slimefunx give <id> [amount]</red>'
    unknown: <red>未知的 SFX 物品：</red><gray>{id}</gray>
    not-giveable: <red>这个 SFX 物品不能直接给予。</red>
    no-space: <red>背包空间不足，未能给予任何物品。</red>
    partial: <yellow>背包空间不足，仅给予：</yellow><gray>{item} x{amount}</gray>
    success: <green>已给予：</green><gray>{item} x{amount}</gray>
  inspect:
    no-marker: <gray>手中物品没有 SFX PDC 身份标记。</gray>
    header: <green>SFX 物品标记</green>
    field:
      item-id: '<gray>item_id: </gray><white>{value}</white>'
      item-version: '<gray>item_version: </gray><white>{value}</white>'
      item-schema: '<gray>item_schema: </gray><white>{value}</white>'
      item-variant: '<gray>item_variant: </gray><white>{value}</white>'
      item-kind: '<gray>item_kind: </gray><white>{value}</white>'
      item-flags: '<gray>item_flags: </gray><white>{value}</white>'
      guide-mode: '<gray>guide_mode: </gray><white>{value}</white>'
  list:
    header: <green>SFX 已注册可见物品：</green><gray>{count} 个，页码 {page} / {pages}</gray>
    menu-title: <dark_green>SFX 物品列表</dark_green> <gray>{page} / {pages}</gray>
    registry-name: <green>SFX 已注册物品</green>
    registry-entry: 注册表展示项
    registry-lore:
      0: <gray>当前只展示玩家可见物品。</gray>
      1: <gray>共 {count} 个。</gray>
  reload:
    success: <green>SFX 配置与语言文件已重载。</green>
    success-all: <green>SFX 已完整重载：注册表、配方与菜单已刷新。</green>
    failed-all: <red>SFX 运行时重载失败。插件已被禁用，以避免在不完整服务图下运行。</red>
  template:
    usage: '<red>用法: /sfx template <compile|reload></red>'
    compile-success: '<green>SFX 模板已编译：{sources} 个源文件，{outputs} 个输出文件。使用 /sfx reload runtime 应用运行时变更。</green>'
    reload-success: <green>SFX 模板已编译，运行时内容已重建。</green>
    compile-failed: '<red>SFX 模板编译失败：{message}</red>'
    warning: '<yellow>[template] {warning}</yellow>'
  help:
    header: <green>SFX 命令</green>
    line:
      guide: <gray>/{label} guide</gray> <dark_gray>- 打开普通科技书</dark_gray>
      book: <gray>/{label} book [cheat]</gray> <dark_gray>- 领取科技书</dark_gray>
      cheatguide: <gray>/{label} cheatguide</gray> <dark_gray>- 打开作弊科技书</dark_gray>
      give: <gray>/{label} give <id> [amount]</gray> <dark_gray>- 直接获取 SFX 物品</dark_gray>
      inspect: <gray>/{label} inspect</gray> <dark_gray>- 检查手中物品 PDC 标记</dark_gray>
      list: <gray>/{label} list [page]</gray> <dark_gray>- 打开已注册物品列表</dark_gray>
      reload: <gray>/{label} reload</gray> <dark_gray>- 重载配置</dark_gray>
      reload-all: <gray>/{label} reload all</gray> <dark_gray>- 重建注册表并重载配方</dark_gray>
      template: <gray>/{label} template <compile|reload></gray> <dark_gray>- 编译模板或编译并重建运行时内容</dark_gray>
      research: <gray>/{label} research <player> <all|reset|id></gray> <dark_gray>- 管理研究</dark_gray>
      backpack: <gray>/{label} backpack <list|open|give> ...</gray> <dark_gray>- 管理背包</dark_gray>
  research:
    usage: <red>用法：/slimefunx research <player|uuid> <all|reset|research-id></red>
