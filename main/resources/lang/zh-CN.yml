      name: <yellow>科技书模式</yellow>
      survival:
        name: <green>切换这本书为普通科技书</green>
        lore: <gray>点击切换这本书回普通科技书。</gray>
      cheat:
        name: <red>切换这本书为作弊科技书</red>
        lore: <gray>点击切换这本书为作弊科技书。</gray>
    layout:
      name: <yellow>页面布局</yellow>
      classic: <gray>当前为 SFX 布局，点击切换到经典布局。</gray>
      sfx: <gray>当前为经典布局，点击切换到 SFX 扩展布局。</gray>
