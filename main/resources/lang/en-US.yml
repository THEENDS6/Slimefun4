debug:
  header: <dark_gray>====================</dark_gray> <green>SFX DEBUG TEXT</green> <dark_gray>====================</dark_gray>
  footer: <dark_gray>====================</dark_gray> <green>END</green> <dark_gray>====================</dark_gray>
  missing-testing: TESTING.md was not packaged into the plugin.
  failed-testing: 'Failed to read TESTING.md: {error}'
command:
  errors:
    players-only-guide: Only players can open the SFX guide.
    no-cheat-guide: <red>You do not have permission to open the cheat guide.</red>
    no-guide: <red>You do not have permission to open the guide.</red>
    players-only-book: Only players can receive the SFX guide.
    no-cheat-book: <red>You do not have permission to receive the cheat guide.</red>
    no-book: <red>You do not have permission to receive the guide.</red>
    players-only-give: Only players can receive SFX items.
    no-give: <red>You do not have permission to receive SFX items directly.</red>
    players-only-inspect: Only players can inspect SFX items.
    no-inspect: <red>You do not have permission to inspect SFX item markers.</red>
    no-list: <red>You do not have permission to view the SFX item list.</red>
    no-reload: <red>You do not have permission to reload SFX.</red>
  book:
    received: <green>Guide received.</green>
    received-cheat: <green>Cheat guide received.</green>
  give:
    usage: '<red>Usage: /slimefunx give <id> [amount]</red>'
    unknown: '<red>Unknown SFX item: </red><gray>{id}</gray>'
    not-giveable: <red>This SFX item cannot be given directly.</red>
    no-space: <red>Not enough inventory space to give any items.</red>
    partial: <yellow>Inventory full, only gave:</yellow><gray>{item} x{amount}</gray>
    success: <green>Given:</green><gray>{item} x{amount}</gray>
  inspect:
    no-marker: <gray>The held item does not contain an SFX marker.</gray>
    header: <green>SFX Item Marker</green>
    field:
      item-id: '<gray>item_id: </gray><white>{value}</white>'
      item-version: '<gray>item_version: </gray><white>{value}</white>'
      item-schema: '<gray>item_schema: </gray><white>{value}</white>'
      item-variant: '<gray>item_variant: </gray><white>{value}</white>'
      item-kind: '<gray>item_kind: </gray><white>{value}</white>'
      item-flags: '<gray>item_flags: </gray><white>{value}</white>'
      guide-mode: '<gray>guide_mode: </gray><white>{value}</white>'
  list:
    header: <green>Visible SFX items:</green><gray>{count} total, page {page} / {pages}</gray>
    menu-title: <dark_green>SFX Item List</dark_green> <gray>{page} / {pages}</gray>
    registry-name: <green>Registered SFX Items</green>
    registry-entry: Registry entry
    registry-lore:
      0: <gray>Only player-visible items are shown here.</gray>
      1: '<gray>Total: {count}</gray>'
  reload:
    success: <green>SFX configuration and language files were reloaded.</green>
    success-all: '<green>SFX fully reloaded: registries, recipes, and menus were refreshed.</green>'
  help:
    header: <green>SFX Commands</green>
    line:
      guide: <gray>/{label} guide</gray> <dark_gray>- open the survival guide</dark_gray>
      book: <gray>/{label} book [cheat]</gray> <dark_gray>- receive the guide book</dark_gray>
      cheatguide: <gray>/{label} cheatguide</gray> <dark_gray>- open the cheat guide</dark_gray>
      give: <gray>/{label} give <id> [amount]</gray> <dark_gray>- receive an SFX item directly</dark_gray>
      inspect: <gray>/{label} inspect</gray> <dark_gray>- inspect the held SFX marker</dark_gray>
      list: <gray>/{label} list [page]</gray> <dark_gray>- open the registered item list</dark_gray>
      reload: <gray>/{label} reload</gray> <dark_gray>- reload config and localization</dark_gray>
      reload-all: <gray>/{label} reload all</gray> <dark_gray>- rebuild registries and reload recipes</dark_gray>
