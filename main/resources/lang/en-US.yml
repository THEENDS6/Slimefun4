machines:
  structure-changed: <red>The structure changed. Machine activation was cancelled.</red>
  missing-dispenser: '<red>Structure incomplete: missing the paired dispenser.</red>'
  smeltery-not-lit: <red>This smeltery is not lit. Light fire or soul fire below the dispenser.</red>
  no-recipes: <gray>This machine is recognized, but no executable recipes are registered yet.</gray>
  inventory-empty: <gray>The dispenser does not contain a valid 3x3 input.</gray>
  empty: <gray>The dispenser does not contain a valid input.</gray>
  pattern-not-found: <red>Items were found, but no matching 3x3 recipe exists.</red>
  unknown-material: <red>No processable material was found for this machine.</red>
  output-full: <red>The output inventory does not have enough room.</red>
  no-match: <red>No matching recipe was found.</red>
  cheat-machine-pack: <green>Received machine deploy pack:</green><gray>{item}</gray>
  cheat-machine-kit: <green>Received full machine kit:</green><gray>{item}</gray>
  deploy-no-space: <red>Not enough space to auto-deploy this machine.</red>
  deploy-success: <green>The basic machine was deployed automatically.</green>
  cheat-item: <green>Received:</green><gray>{item} x{amount}</gray>
  deploy-pack:
    name: <gold>Manual Machine Deploy Pack</gold> <gray>- {machine}</gray>
    lore:
    - <gray>Places the full manual machine structure automatically.</gray>
    - <gray>Checks for enough free space before deploying.</gray>
    - <dark_gray>This is an SFX cheat helper item.</dark_gray>
  deploy-pack-unsupported: <yellow>This machine does not support deploy packs yet, a full structure kit was given instead:"</yellow><gray>{item}</gray>"
guide:
  errors:
    no-open: <red>You do not have permission to open this guide.</red>
    no-settings: <red>You do not have permission to open the guide settings.</red>
    missing-category: <red>This category does not exist.</red>
    missing-item: <red>This item does not exist.</red>
    no-cheat-access: <red>You cannot use the cheat guide for this item.</red>
  mode:
    survival:
      title: <dark_green>Slimefun Guide</dark_green>
      name: <dark_green>Slimefun Guide</dark_green>
      lore: <gray>Click items to view recipes.</gray>
    cheat:
      title: <dark_red>Slimefun Cheat Guide</dark_red>
      name: <dark_red>Slimefun Cheat Guide</dark_red>
      lore: <gray>Click items to obtain them directly.</gray>
  main:
    title: Main Menu
  settings:
    title: Guide Settings
    title-item: <green>Guide Settings</green>
    description:
      1: <gray>Configure how this guide behaves for you.</gray>
      2: <gray>The classic layout is the default restored experience.</gray>
    help:
      name: <aqua>Guide Help</aqua>
      lore:
        1: <gray>Shift + Right Click the guide book to open this menu.</gray>
        2: <gray>Layout, history, and close behavior are stored per player.</gray>
    mode:
      name: <yellow>Guide Mode</yellow>
      survival:
        name: <green>Switch This Book to Survival Guide</green>
        lore: <gray>Click to switch this book back to the survival guide.</gray>
      cheat:
        name: <red>Switch This Book to Cheat Guide</red>
        lore: <gray>Click to switch this book to the cheat guide.</gray>
    layout:
      name: <yellow>Guide Layout</yellow>
      classic: '<gray>Current: SFX. Click to switch to the restored classic layout.</gray>'
      sfx: '<gray>Current: classic. Click to switch to the expanded SFX layout.</gray>'
    history:
      name: <yellow>Nested Recipe History</yellow>
      enabled: <green>Enabled</green>
      disabled: <red>Disabled</red>
      lore: <gray>When enabled, opening a recipe from another recipe remembers the previous page.</gray>
    close-behavior:
      name: <yellow>Esc / E Behavior</yellow>
      enabled: <green>Esc / E returns to the previous guide page</green>
      disabled: <red>Esc / E closes the guide immediately</red>
      lore: <gray>This only affects guide menus.</gray>
    fireworks:
      name: <yellow>Research Fireworks</yellow>
      lore: <gray>Show a large firework when you finish researching an item.</gray>
    unlock-animation:
      name: <yellow>Unlock Animation</yellow>
      lore: <gray>Show the pondering progress in chat while researching an item.</gray>
    resume-last:
      name: <yellow>Resume Last Page</yellow>
      lore: <gray>Reopen the guide at the last page you closed.</gray>
    machine-ui:
      name: <yellow>Machine UI Details</yellow>
      lore: <gray>Show SFX recipe, speed, and raw tick progress details on top of the classic progress display.</gray>
    machine-sound:
      name: <yellow>Machine Completion Sound</yellow>
      lore: <gray>While viewing a machine UI, play the completion sound only for you.</gray>
    machine-smooth:
      name: <yellow>Smooth Machine UI</yellow>
      lore: <gray>Enable per-tick machine UI refresh. Disable it for the classic 10-tick display style.</gray>
    current-layout:
      name: <aqua>Current Layout</aqua>
      classic: <gray>Classic layout is active.</gray>
      sfx: <gray>SFX layout is active.</gray>
      mode: '<gray>Guide mode: {mode}</gray>'
    toggle:
      enabled: <green>Enabled</green>
      disabled: <red>Disabled</red>
  cheat:
    machine-pack: '<red>Cheat: click to receive a deploy pack</red>'
    machine-kit: <red>Shift click to receive the full structure kit</red>
    take-one: '<red>Cheat: click to receive 1 item</red>'
    take-stack: <red>Shift click to receive 64 items</red>
  actions:
    open-category: <gray>Click to open category</gray>
    open-recipe: <gray>Click to view recipe</gray>
    open-machine: <gray>Click to open this machine in the guide</gray>
    open-vanilla-recipe: <gray>Click to view vanilla recipes</gray>
    back-guide: Back to Guide
    back-main: Back to Main Menu
    back-category: Back to Category
    close: <dark_gray>Click to close.</dark_gray>
    close-menu: <red>Close</red>
    settings:
      name: <yellow>Guide Settings</yellow>
      lore: <gray>You can also Shift + Right Click the guide book.</gray>
    search:
      name: <yellow>Search</yellow>
      lore: <gray>The search entry is reserved.</gray>
      todo: <gray>The search entry is reserved for a future chat search page.</gray>
