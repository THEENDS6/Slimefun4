    alternative-source-group: <gray>Also available in:</gray>
    vanilla:
      disabled: <dark_gray>Vanilla recipe lookup is disabled.</dark_gray>
      crafting: Crafting Table
      stonecutting: Stonecutter
      smithing: Smithing Table
      furnace: Furnace
      blasting: Blast Furnace
      smoking: Smoker
      campfire: Campfire
    no-recipe:
      name: <red>No Recipe</red>
      lore: <gray>This item currently only exists as a registry or system entry.</gray>
  research:
    locked: <red>Locked</red>
    click-unlock: <green>Click to unlock</green>
    cost: '<gray>Cost: </gray><aqua>{cost} levels</aqua>'
    unlock:
      name: <green>Unlock Research</green>
      lore:
        1: <gray>Spend experience levels to unlock this item.</gray>
  pagination:
    prev:
      active: <yellow>Previous Page</yellow>
      inactive: <dark_gray>Previous Page</dark_gray>
    next:
      active: <yellow>Next Page</yellow>
