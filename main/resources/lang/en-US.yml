    line1: To unlock this category you will
    line2: need to unlock all items from the
    line3: following categories
  recipe:
    title: Recipe Details
    multiblock:
      name: <gold>Multiblock Machine</gold>
      lore:
        1: <gray>This recipe is crafted in a multiblock machine.</gray>
