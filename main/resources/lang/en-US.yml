electric-ui:
  input:
    name: <aqua>Input</aqua>
    lore: <gray>Place items here.</gray>
  output:
    name: <gold>Output</gold>
    lore: <gray>Take finished items here.</gray>
  idle:
    name: <gray>Idle</gray>
    lore: <gray>Waiting for input.</gray>
  no-recipe:
    name: <gray>No Recipe</gray>
    lore: <gray>The current input has no matching recipe.</gray>
  output-full:
    name: <red>Output Full</red>
    lore: <gray>Free an output slot to continue.</gray>
  blocked:
    name: <red>Blocked</red>
    lore: <gray>The output is full. Free a slot to commit the finished item.</gray>
    time-left: <gray>Completed, waiting for output</gray>
  no-power:
    name: <red>No Power</red>
    lore: <gray>Charge this machine to continue.</gray>
  energy-buffer: '<gray>Stored: </gray><yellow>{stored}</yellow><gray>/</gray><yellow>{capacity}</yellow><gray> J</gray>'
  progress:
    name: <yellow>Working</yellow>
    recipe: '<gray>Recipe: </gray><white>{recipe}</white>'
    speed: '<gray>Speed: </gray><aqua>{speed}x</aqua>'
    value: '<gray>Progress: </gray><white>{current}</white><gray>/</gray><white>{total}</white>'
    power-disabled: <dark_gray>Power usage is disabled for now.</dark_gray>
    time-left: <gray>{time}</gray>
    work: '<gray>Progress: </gray><white>{current}</white><gray>/</gray><white>{total}</white><gray> (+{rate}/tick)</gray>'
energy:
  regulator:
    no-network: <red>Not connected to any electric machines</red>
    multi-regulator: <red>Multiple energy regulators in this connection</red>
    shared-node-conflict: <red>Energy network conflict</red>
    net-positive: <green>+{net} J/t</green><newline><green>{supply} J/t</green><gray> | </gray><red>{consumption} J/t</red><newline><gray>{stored}/{capacity} J</gray>
    net-negative: <red>{net} J/t</red><newline><green>{supply} J/t</green><gray> | </gray><red>{consumption} J/t</red><newline><gray>{stored}/{capacity} J</gray>
    classic-positive: <green>+{net} J ⚡</green>
    classic-negative: <red>{net} J ⚡</red>
    sfx-positive: <green>+{net_text} J/t</green><newline>{flow_line}<newline>{storage_line}
    sfx-negative: <red>-{net_text} J/t</red><newline>{flow_line}<newline>{storage_line}
  generator:
    fuel:
      oil: Oil
      fuel: Fuel
    fuel-duration: '<gray>Duration: </gray><aqua>{seconds}s</aqua>'
    active:
      name: <green>Generating</green>
      lore: <gray>Fuel is currently being converted into energy.</gray>
    time-left: <gray>{time}s</gray>
    idle:
      name: <gray>Idle</gray>
      lore: <gray>Insert fuel to start generating power.</gray>
    output-full:
      name: <red>Output Full</red>
      lore: <gray>Clear the output slots to continue.</gray>
    no-network:
      name: <red>Not Connected</red>
      lore: <gray>This generator is not connected to an energy network.</gray>
    conflict:
      name: <red>Network Conflict</red>
      lore: <gray>Resolve regulator or shared-node conflicts first.</gray>
    solar:
      name: <yellow>Solar Generator</yellow>
    buffer: '<gray>Stored: </gray><yellow>{stored}</yellow><gray>/</gray><yellow>{capacity}</yellow><gray> J</gray>'
    production: '<gray>Production: </gray><green>{energy} J/t</green>'
    tier2-fuel-consumption-lore: '&8⇨ &6🔥 &7Fuel consumption: &b1.5x'
  messages:
    capacitor-status: <yellow>Stored {stored}/{capacity} J</yellow>
    regulator-status: <yellow>Energy regulator active.</yellow>
    connector-status: <yellow>Energy connector linked to nearby networks.</yellow>
