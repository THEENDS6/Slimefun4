language: 'zh-CN'

addons:
  basic-expansion:
    
    enabled: true

content:
  compile-templates-on-startup: false
  sync-bundled-languages-on-startup: false
  sync-bundled-templates-before-compile: false
  sync-bundled-items-on-startup: false
  sync-bundled-recipes-on-startup: false
  sync-bundled-researches-on-startup: false
  runtime:
    compiled-only: true
    allow-java-ui-fallback: false
    allow-java-recipe-fallback: false
    allow-legacy-machine-scan: false

storage:
  sqlite-file: 'data/player-data.db'
  block-data:
    sqlite-file: 'data/block-data.db'
    
    autosave-interval-ticks: -1
  gps-data:
    sqlite-file: 'data/gps-data.db'
  android-scripts:
    sqlite-file: 'data/android-scripts.db'

gps:
  
  sfx-extensions:
    transmitter-gui:
      enabled: true

backpacks:
  allow-foreign-open: true

plugin-blocks:
  crucible:
    allow-water-in-nether: false
  enhanced-furnace:
    
    
    
    speed-affects-fuel-consumption: true

messages:
  prefix: '<dark_gray>[<green>SFX</green><dark_gray>] '

diagnostics:
  validation:
    
    
    enabled: false
    teleport: false
    backpack: false
    christmas-present: false
    talisman: false
    infused-hopper: false
    charging-bench: false
    
    machine-yaml: false

guide:
  allow-right-click-open: true
  allow-left-click-open: false
  shift-right-click-settings: true
  layout-mode: 'classic'
  sfx-layout-enabled: true
  allow-layout-switching: true
  show-vanilla-recipes: true
  search:
    enabled: true
    pinyin-enabled: true
    pinyin-initials-enabled: true
    timeout-seconds: 30
    max-query-length: 64
  seasonal-categories:
    enabled: true
    always-show: true
  recipe:
    machine-link-enabled: true
  sounds:
    enabled: true
    open: minecraft:item.book.page_turn
    category: minecraft:item.book.page_turn
    page: minecraft:item.book.page_turn
    volume: 0.7
    pitch: 1.0
  survival-title: '<dark_green>SFX 科技书</dark_green>'
  cheat-title: '<dark_red>SFX 作弊科技书</dark_red>'

options:
  
  
  

  
  
  sfx-vanilla-anvil-enchanting:
    enabled: true

  sfx-netherite-smithing:
    enabled: true
    allowed-items:
      - sf:smelters_pickaxe
      - sf:lumber_axe
      - sf:explosive_pickaxe
      - sf:explosive_shovel
      - sf:pickaxe_of_the_seeker
      - sf:pickaxe_of_vein_mining
      - sf:soulbound_sword
      - sf:soulbound_pickaxe
      - sf:soulbound_axe
      - sf:soulbound_shovel
      - sf:soulbound_hoe
      - sf:soulbound_helmet
      - sf:soulbound_chestplate
      - sf:soulbound_leggings
      - sf:soulbound_boots

  
  
  fire-breaking-chance: 34




machines:
  framework:
    
    
    allow-legacy-candidate-scan: false
  lazy-tick:
    enabled: true
    
    
    interval-ticks: 5
    
    
    viewer-interval-ticks: 1
    
    sleeping-probe-interval-ticks: 100

technical-gadgets:
  cleanup-legacy-attribute-base-values: true
  
  
  rechargeable:
    base-multiplier: 20
  sfx-balance:
    enabled: true
    rechargeable-multiplier: 5
    charging-bench:
      energy-consumption-per-tick: 100
      energy-loss: 0.80
  sfx-extensions:
    jetpacks-and-jetboots:
      enabled: true
  classic:
    
    jetpack-interval-ticks: 3
    jetboots-interval-ticks: 10
    charging-bench:
      energy-consumption-per-tick: 20
      energy-loss: 0.50


cargo:
  sfx-extensions:
    advanced-input-interface:
      enabled: true
  visualizer:
    enabled: false
    particle: dust
    include-manager: false
    view-distance-squared: 1024
    dust:
      red: 255
      green: 0
      blue: 0
      size: 1.0

floating-text:
  
  
  
  
  mode: armor_stand
  resync-interval-ticks: 100
  armor-stand:
    y-offset: -0.25
    line-spacing: 0.25
  text-display:
    y-offset: 0.0

electric-machines:
  
  
  sfx-balance:
    crop-growth-accelerator: true
    tree-growth-accelerator: true
    auto-breeder: true
    animal-growth-accelerator: true
    produce-collector: true
    electric-ore-grinder-3: true
    xp-collector:
      enabled: true
      flask-energy-cost: 4096

  
  sfx-extensions:
    fluid-pump-optimization:
      enabled: true
      water-source-threshold: 4
      lava-source-threshold: 300
      check-interval-ticks: 1000
    auto-brewer:
      enabled: true

  
  
  allow-sfx-item-enchanting: true

  
  
  allow-conflicting-enchantments: true

  
  allow-illegal-enchantments: false

configurable-machines:
  wither-assembler:
    allow-soul-soil: true

energy:
  
  display-update-interval-ticks: 1
  
  update-only-on-change: true
  storage:
    
    
    hidden-buffer-percent: 5
  regulator-display:
    mode: 'sfx'
    
    see-through: false
  bucket-fuels:
    instant-empty-bucket-return: true
  generator-balance:
    use-sfx-balance: true
    
    
    pause-generators-when-grid-full: true
    electrified-crucible-consumption-multiplier: 1.5
    future:
      nether-star-reactor:
        production: 2048
        buffer: 1310720
        duration-seconds: 1800
        coolant-rate-multiplier: 2.0
        coolant-units: 144

tools:
  multimeter:
    
    
    use-sfx-enhanced: true

radiation:
  enabled: true
  sfx-rework:
    enabled: true
  
  scan-interval-ticks: 10
  
  recovery-per-scan: 10
  max-exposure: 3000
  
  respawn-immunity-ticks: 200
  protection:
    
    
    reduction-per-piece: 0.25



legacy:
  infused-hopper:
    radius: 3.5
    
    base-interval-ticks: 10
    
    idle-backoff-after-seconds: 30
    
    max-idle-multiplier: 10
    
    respect-pickup-delay: false
    redstone-disables: false
    silent: false
    particle-count: 12
  hologram-projector:
    view-distance-squared: 2304
  industrial-miner:
    step-delay-ticks: 4
  reinforced-spawner:
    
    
    
    break-drop-mode: reinforced

androids:
  enabled: true
  tick-interval-ticks: 10
  max-active-per-region-per-tick: 64
  max-script-length: 54
  
  
  
  
  sleep:
    enabled: true
    blocked-backoff-ticks: 40
  woodcutter:
    
    
    batch-replant-bottom-layer: true
  scripts:
    allow-upload: true
    allow-private: true
    allow-export: true
    allow-import: true
