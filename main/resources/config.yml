language: 'zh-CN'

content:
  sync-bundled-languages-on-startup: false
  sync-bundled-items-on-startup: false
  sync-bundled-recipes-on-startup: false
  sync-bundled-researches-on-startup: false

storage:
  sqlite-file: 'data/player-data.db'
  block-data:
    sqlite-file: 'data/block-data.db'
    # -1 follows Bukkit/Paper ticks-per.autosave when possible.
    autosave-interval-ticks: -1

backpacks:
  allow-foreign-open: true

plugin-blocks:
  crucible:
    allow-water-in-nether: false
  enhanced-furnace:
    # SFX extension:
    # when enabled, processing speed also increases fuel consumption speed.
    # false = classic behavior
    speed-affects-fuel-consumption: true

messages:
  prefix: '<dark_gray>[<green>SFX</green><dark_gray>] '

guide:
  allow-right-click-open: true
  allow-left-click-open: false
  shift-right-click-settings: true
  layout-mode: 'classic'
  sfx-layout-enabled: true
  allow-layout-switching: true
  show-vanilla-recipes: true
  seasonal-categories:
    enabled: true
    always-show: true
  recipe:
    machine-link-enabled: true
  sounds:
    enabled: true
    open: minecraft:item.book.page_turn
    category: minecraft:item.book.page_turn
    page: minecraft:item.book.page_turn
    volume: 0.7
    pitch: 1.0
  survival-title: '<dark_green>SFX 科技书</dark_green>'
  cheat-title: '<dark_red>SFX 作弊科技书</dark_red>'

# 开发期调试文本。enabled 为 true 时，玩家进服会收到 TESTING.md 内容。
debug-text:
  enabled: false

options:
  # Allows selected SFX diamond equipment to be upgraded in the vanilla Smithing Table
  # with a Netherite Upgrade Smithing Template and a Netherite Ingot.
  # The output keeps the original SFX item id and metadata, only the vanilla material changes.

  # Allows SFX tools to use the vanilla anvil safely for renaming and enchanted-book application.
  # The result is cloned from the original SFX item so PDC, lore, durability and custom metadata are preserved.
  sfx-vanilla-anvil-enchanting:
    enabled: true

  sfx-netherite-smithing:
    enabled: true
    allowed-items:
      - sf:smelters_pickaxe
      - sf:lumber_axe
      - sf:explosive_pickaxe
      - sf:explosive_shovel
      - sf:pickaxe_of_the_seeker
      - sf:pickaxe_of_vein_mining
      - sf:soulbound_sword
      - sf:soulbound_pickaxe
      - sf:soulbound_axe
      - sf:soulbound_shovel
      - sf:soulbound_hoe
      - sf:soulbound_helmet
      - sf:soulbound_chestplate
      - sf:soulbound_leggings
      - sf:soulbound_boots

  # Slimefun classic smeltery behavior: the makeshift smeltery always consumes fire after a successful craft;
  # the normal smeltery consumes fire by chance after a successful craft.
  fire-breaking-chance: 34




machines:
  lazy-tick:
    enabled: true
    # Regular machines are processed lazily by default. elapsedTicks compensates
    # progress, energy use and production so gameplay speed stays unchanged.
    interval-ticks: 5
    # A machine that currently has a player viewer is processed every tick so
    # its UI updates at vanilla responsiveness without a separate interpolation layer.
    viewer-interval-ticks: 1
    # Sleeping machines are probed infrequently unless inventory/player events wake them.
    sleeping-probe-interval-ticks: 100

technical-gadgets:
  cleanup-legacy-attribute-base-values: true
  # Classic Slimefun rechargeable values are defined per second-scale legacy balance.
  # SFX converts them to per-tick energy units with base-multiplier, then optionally applies extra SFX balance.
  rechargeable:
    base-multiplier: 20
  sfx-balance:
    enabled: true
    rechargeable-multiplier: 5
    charging-bench:
      energy-consumption-per-tick: 100
      energy-loss: 0.80
  sfx-extensions:
    jetpacks-and-jetboots:
      enabled: true
  classic:
    # Classic Slimefun-style pulse intervals. SF4 schedules Jetpack every 3 ticks and JetBoots every 2 ticks.
    jetpack-interval-ticks: 3
    jetboots-interval-ticks: 2
    # Backwards-compatible fallback if the specific values above are removed.
    interval-ticks: 10
    charging-bench:
      energy-consumption-per-tick: 20
      energy-loss: 0.50


cargo:
  visualizer:
    enabled: true
    particle: dust
    include-manager: false
    view-distance-squared: 1024
    dust:
      red: 255
      green: 0
      blue: 0
      size: 1.0

floating-text:
  # PacketEvents virtual floating text is resent periodically so players entering range, teleporting,
  # respawning or missing a previous packet can still see regulator status text.
  # armor_stand uses virtual invisible armor stands, one per line, to match classic name-tag rendering.
  # text_display keeps the richer modern text display renderer available.
  mode: armor_stand
  resync-interval-ticks: 20
  armor-stand:
    y-offset: -0.25
    line-spacing: 0.25
  text-display:
    y-offset: 0.0

electric-machines:
  # SFX balance switches for world-interacting electric machines.
  # false = classic behavior for that machine.
  sfx-balance:
    crop-growth-accelerator: true
    tree-growth-accelerator: true
    auto-breeder: true
    animal-growth-accelerator: true
    produce-collector: true
    xp-collector: true

  # SFX extensions for electric machines.
  sfx-extensions:
    fluid-pump-optimization:
      enabled: true
      water-source-threshold: 4
      lava-source-threshold: 300
      check-interval-ticks: 200
    auto-brewer:
      enabled: true

  # Allows SFX tools/items to be processed by special electric machines such as
  # Auto Anvil, Auto Enchanter and Auto Disenchanter. Runtime item metadata is preserved.
  allow-sfx-item-enchanting: true

  # Allows mutually exclusive vanilla enchantments to coexist, e.g. Sharpness + Smite.
  # Book Binder also uses this setting.
  allow-conflicting-enchantments: true

  # Allows enchantments on item types they normally cannot be applied to, e.g. Efficiency on a sword.
  allow-illegal-enchantments: false

configurable-machines:
  wither-assembler:
    allow-soul-soil: true

energy:
  storage:
    # Hidden grid storage buffer. The grid can internally store this percentage above the visible capacity.
    # UI, multimeter and capacitor appearances still display the public capacity only.
    hidden-buffer-percent: 5
  regulator-display:
    mode: 'sfx'
    # TextDisplay see-through can cause visual artifacts behind skulls/water; keep disabled by default.
    see-through: false
    # Check every tick by default; update-only-on-change prevents redundant display entity writes.
    update-interval-ticks: 1
    # Change means the final rendered display content changed, not merely raw energy numbers.
    update-only-on-change: true
  bucket-fuels:
    instant-empty-bucket-return: true
  generator-balance:
    use-sfx-balance: true
    # SFX extension: pause redundant generators when a grid is fully charged.
    # Reactors in production mode are never auto-paused.
    pause-generators-when-grid-full: true
    electrified-crucible-consumption-multiplier: 1.5
    future:
      nether-star-reactor:
        production: 2048
        buffer: 1310720
        duration-seconds: 1800
        coolant-rate-multiplier: 2.0
        coolant-units: 144

tools:
  multimeter:
    # false = classic Slimefun behavior: only display stored/capacity.
    # true = SFX enhanced inspection with grid and machine details.
    use-sfx-enhanced: true

radiation:
  enabled: true
  # Radiation inventory exposure is calculated twice per second.
  scan-interval-ticks: 10
  # If the player carries no radioactive items, exposure decays by this amount per scan.
  recovery-per-scan: 10
  max-exposure: 3000
  # After respawn, players ignore radiation exposure and symptoms for this duration.
  respawn-immunity-ticks: 200
  protection:
    # Each armor piece with the armor-hazmat flag reduces new exposure by 25%.
    # Four pieces prevent new exposure from radioactive inventory items.
    reduction-per-piece: 0.25


