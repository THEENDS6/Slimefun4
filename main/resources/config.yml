language: 'zh-CN'

content:
  sync-bundled-languages-on-startup: true
  sync-bundled-items-on-startup: true
  sync-bundled-recipes-on-startup: true
  sync-bundled-researches-on-startup: true

storage:
  sqlite-file: 'data/player-data.db'
  block-data:
    sqlite-file: 'data/block-data.db'

backpacks:
  allow-foreign-open: true

plugin-blocks:
  crucible:
    allow-water-in-nether: false
  enhanced-furnace:
    
    
    
    speed-affects-fuel-consumption: true

messages:
  prefix: '<dark_gray>[<green>SFX</green><dark_gray>] '

guide:
  allow-right-click-open: true
  allow-left-click-open: false
  shift-right-click-settings: true
  layout-mode: 'classic'
  sfx-layout-enabled: true
  allow-layout-switching: true
  show-vanilla-recipes: true
  seasonal-categories:
    enabled: true
    always-show: true
  recipe:
    machine-link-enabled: true
  survival-title: '<dark_green>SFX 科技书</dark_green>'
  cheat-title: '<dark_red>SFX 作弊科技书</dark_red>'


debug-text:
  enabled: true

options:
  
  
  

  
  
  sfx-vanilla-anvil-enchanting:
    enabled: true

  sfx-netherite-smithing:
    enabled: true
    allowed-items:
      - sf:smelters_pickaxe
      - sf:lumber_axe
      - sf:explosive_pickaxe
      - sf:explosive_shovel
      - sf:pickaxe_of_the_seeker
      - sf:pickaxe_of_vein_mining
      - sf:soulbound_sword
      - sf:soulbound_pickaxe
      - sf:soulbound_axe
      - sf:soulbound_shovel
      - sf:soulbound_hoe
      - sf:soulbound_helmet
      - sf:soulbound_chestplate
      - sf:soulbound_leggings
      - sf:soulbound_boots

  
  
  fire-breaking-chance: 34



electric-machines:
  
  
  allow-sfx-item-enchanting: true

  
  
  allow-conflicting-enchantments: true

  
  allow-illegal-enchantments: false

energy:
  regulator-display:
    mode: 'sfx'
    
    see-through: false
  bucket-fuels:
    instant-empty-bucket-return: true
  generator-balance:
    use-sfx-balance: true
    electrified-crucible-consumption-multiplier: 1.5
    future:
      nether-star-reactor:
        production: 2048
        buffer: 1310720
        duration-seconds: 1800
        coolant-rate-multiplier: 2.0
        coolant-units: 144
