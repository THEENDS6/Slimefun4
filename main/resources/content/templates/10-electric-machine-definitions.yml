# Shared electric machine definition templates. These compose machine parameters with optional UI fragments.
templates:
  machines:
    electric-definition:
      @it: true
      name-key: "${name-key}"
      speed: "${speed}"
      energy:
        capacity: "${capacity}"
        consumption-per-tick: "${consumption}"
      progress-material: "${progress-material}"
      functions: "${functions}"
      slots:
        input: "${input-slots}"
        output: "${output-slots}"
    standard-electric-definition:
      @it: true
      @cf: templates.ui.standard-electric-machine
      @d:
        functions:
        - standard-processing
        input-slots:
        - 19
        - 20
        output-slots:
        - 24
        - 25
      name-key: "${name-key}"
      speed: "${speed}"
      energy:
        capacity: "${capacity}"
        consumption-per-tick: "${consumption}"
      progress-material: "${progress-material}"
      functions: "${functions}"
      slots:
        input: "${input-slots}"
        output: "${output-slots}"
