# Shared energy component templates. Concrete component families live under machines/energy/.
templates:
  energy:
    component-definition:
      @it: true
      type: "${type}"
      energy:
        capacity: "${capacity}"
        generation-per-tick: "${generation}"
        consumption-per-tick: "${consumption}"
        burn-rate: "${burn-rate}"
      vanilla-fuel: "${vanilla-fuel}"
      progress-material: "${progress-material}"
      fuels: "${fuels}"
      slots:
        input:
        - 19
        - 20
        output:
        - 24
        - 25
      ui:
        inventory-size: 45
        status-slot: 22
        frame:
        - slots:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
          - 13
          - 31
          - 36
          - 37
          - 38
          - 39
          - 40
          - 41
          - 42
          - 43
          - 44
          item:
            material: GRAY_STAINED_GLASS_PANE
            name: " "
            lore: []
        - slots:
          - 9
          - 10
          - 11
          - 12
          - 18
          - 21
          - 27
          - 28
          - 29
          - 30
          item:
            material: CYAN_STAINED_GLASS_PANE
            name-key: electric-ui.input.name
            lore-key: electric-ui.input.lore
        - slots:
          - 14
          - 15
          - 16
          - 17
          - 23
          - 26
          - 32
          - 33
          - 34
          - 35
          item:
            material: ORANGE_STAINED_GLASS_PANE
            name-key: electric-ui.output.name
            lore-key: electric-ui.output.lore
        items: {}
        status: {}
    passive-component-output:
      @cf: templates.energy.component-definition
      @it: true
      @d:
        generation: 0
        consumption: 0
        burn-rate: 10
        vanilla-fuel: false
        progress-material: REDSTONE
        fuels: []
    generator-output:
      @cf: templates.energy.component-definition
      @it: true
      @d:
        type: GENERATOR
        consumption: 0
        vanilla-fuel: false
        fuels: []
