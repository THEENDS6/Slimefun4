# SFX template precompiler examples.
# UI templates should keep structure here and reference language keys for visible text.
@project:
  default-progress-material: FLINT_AND_STEEL

templates:
  ui:
    standard-electric-machine:
      @it: true
      slots:
        input: [19, 20]
        output: [24, 25]
      ui:
        inventory-size: 45
        status-slot: 22
        status:
          working:
            material: ${default-progress-material}
            name: " "
            include-default-lore: false
            durability-mode: AUTO
            lore-key: electric-ui.template.status.working.lore
          idle:
            material: BLACK_STAINED_GLASS_PANE
            name-key: electric-ui.template.status.idle.name
            lore-key: electric-ui.template.status.idle.lore
          no-power:
            material: RED_STAINED_GLASS_PANE
            name-key: electric-ui.template.status.no-power.name
            lore-key: electric-ui.template.status.no-power.lore
          output-full:
            material: ORANGE_STAINED_GLASS_PANE
            name-key: electric-ui.template.status.output-full.name
            lore-key: electric-ui.template.status.output-full.lore
          no-recipe:
            material: BLACK_STAINED_GLASS_PANE
            name-key: electric-ui.template.status.no-recipe.name
            lore-key: electric-ui.template.status.no-recipe.lore
        frame:
          - slots: [0, 1, 2, 3, 4, 5, 6, 7, 8, 13, 31, 36, 37, 38, 39, 40, 41, 42, 43, 44]
            item:
              material: GRAY_STAINED_GLASS_PANE
              name: " "
              lore: []
          - slots: [9, 10, 11, 12, 18, 21, 27, 28, 29, 30]
            item:
              material: CYAN_STAINED_GLASS_PANE
              name-key: electric-ui.template.frame.input.name
              lore-key: electric-ui.template.frame.input.lore
          - slots: [14, 15, 16, 17, 23, 26, 32, 33, 34, 35]
            item:
              material: ORANGE_STAINED_GLASS_PANE
              name-key: electric-ui.template.frame.output.name
              lore-key: electric-ui.template.frame.output.lore
  energy:
    electric-consumer:
      @istemplate: true
      @define:
        capacity: 1280
        consumption: 4
      energy:
        capacity: ${capacity}
        consumption-per-tick: ${consumption}
    electric-furnace-base:
      @copyfrom: templates.energy.electric-consumer
      @istemplate: true
      progress-material: ${default-progress-material}
    passive-component:
      @it: true
      energy:
        capacity: 0
        generation-per-tick: 0
        consumption-per-tick: 0
        burn-rate: 10
      vanilla-fuel: false
      progress-material: REDSTONE
      fuels: []
    charger:
      @copyfrom: templates.energy.passive-component
      @it: true
      type: CHARGER
      progress-material: GOLDEN_PICKAXE
      energy:
        capacity: ${capacity}
        consumption-per-tick: ${consumption}
  machines:
    standard-electric-machine:
      @copyfrom: templates.ui.standard-electric-machine
      @istemplate: true
      @define:
        machine-title: Electric Machine
        level-suffix: ""
        speed: 1
      speed: 1
      progress-material: ${default-progress-material}
    electric-furnace:
      @copyfrom: templates.machines.standard-electric-machine
      @istemplate: true
      @define:
        machine-title: Electric Furnace
        level-suffix: " &7- &eI"
        speed: 1
        capacity: 1280
        consumption: 4
      title: "&6${machine-title}${level-suffix}"
      speed: ${speed}
      energy:
        capacity: ${capacity}
        consumption-per-tick: ${consumption}
