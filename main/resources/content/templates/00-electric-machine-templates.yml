# SFX 模板预编译器示例：这里放可复用模板，不直接作为运行时产物。
# 规则要点：
# - @istemplate / @it 表示模板节点，不导出。
# - @copyfrom / @cf 从目标节点复制后再用本节点字段覆盖。
# - @mergeinto / @mi 把当前节点内容合并到目标路径。
# - @isoutput / @io 表示这个节点独立导出为完整显式 YAML。

@project:
  default-progress-material: FLINT_AND_STEEL

templates:
  ui:
    standard-electric-machine:
      @it: true
      slots:
        input: [19, 20]
        output: [24, 25]
      ui:
        inventory-size: 45
        status-slot: 22
        status:
          working:
            material: ${default-progress-material}
            name: " "
            include-default-lore: false
            durability-mode: AUTO
            lore:
              - "&7进度：&f{progress_current}&7/&f{progress_total} &8({progress_percent}%)"
              - "&7剩余时间：&f{time_left}"
              - ""
              - "&7储能：&e{stored_energy}&7/&e{energy_capacity} J"
              - "&7耗电：&e{energy_per_tick} J/t"
          idle:
            material: BLACK_STAINED_GLASS_PANE
            name: "&7闲置"
            lore:
              - "&7等待输入。"
          no-power:
            material: RED_STAINED_GLASS_PANE
            name: "&c无电力"
            lore:
              - "&7给机器供电后继续。"
          output-full:
            material: ORANGE_STAINED_GLASS_PANE
            name: "&c输出已满"
            lore:
              - "&7清理输出槽后继续。"
          no-recipe:
            material: BLACK_STAINED_GLASS_PANE
            name: "&7无配方"
            lore:
              - "&7当前输入没有匹配配方。"
        frame:
          - slots: [0, 1, 2, 3, 4, 5, 6, 7, 8, 13, 31, 36, 37, 38, 39, 40, 41, 42, 43, 44]
            item:
              material: GRAY_STAINED_GLASS_PANE
              name: " "
              lore: []
          - slots: [9, 10, 11, 12, 18, 21, 27, 28, 29, 30]
            item:
              material: CYAN_STAINED_GLASS_PANE
              name: "&b输入"
              lore:
                - "&7将物品放在这里。"
          - slots: [14, 15, 16, 17, 23, 26, 32, 33, 34, 35]
            item:
              material: ORANGE_STAINED_GLASS_PANE
              name: "&6输出"
              lore:
                - "&7从这里取走成品。"
  energy:
    electric-consumer:
      @istemplate: true
      @define:
        capacity: 1280
        consumption: 4
      energy:
        capacity: ${capacity}
        consumption-per-tick: ${consumption}
    electric-furnace-base:
      @copyfrom: templates.energy.electric-consumer
      @istemplate: true
      progress-material: ${default-progress-material}
    passive-component:
      @it: true
      energy:
        capacity: 0
        generation-per-tick: 0
        consumption-per-tick: 0
        burn-rate: 10
      vanilla-fuel: false
      progress-material: REDSTONE
      fuels: []
    charger:
      @copyfrom: templates.energy.passive-component
      @it: true
      type: CHARGER
      progress-material: GOLDEN_PICKAXE
      energy:
        capacity: ${capacity}
        consumption-per-tick: ${consumption}
  machines:
    standard-electric-machine:
      @copyfrom: templates.ui.standard-electric-machine
      @istemplate: true
      @define:
        machine-title: Electric Machine
        level-suffix: ""
        speed: 1
      speed: 1
      progress-material: ${default-progress-material}
    electric-furnace:
      @copyfrom: templates.machines.standard-electric-machine
      @istemplate: true
      @define:
        machine-title: Electric Furnace
        level-suffix: " &7- &eI"
        speed: 1
        capacity: 1280
        consumption: 4
      title: "&6${machine-title}${level-suffix}"
      speed: ${speed}
      energy:
        capacity: ${capacity}
        consumption-per-tick: ${consumption}
