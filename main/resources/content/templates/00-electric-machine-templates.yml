# SFX 模板预编译器示例：这里放可复用模板，不直接作为运行时产物。
# 规则要点：
# - @istemplate / @it 表示模板节点，不导出。
# - @copyfrom / @cf 从目标节点复制后再用本节点字段覆盖。
# - @mergeinto / @mi 把当前节点内容合并到目标路径。
# - @isoutput / @io 表示这个节点独立导出为完整显式 YAML。

@project:
  default-progress-material: FLINT_AND_STEEL
  standard-menu-style: STANDARD

templates:
  ui:
    standard-electric-machine:
      @it: true
      menu-style: ${standard-menu-style}
      slots:
        input: [19, 20]
        output: [24, 25]
      ui:
        title-color: red
        status-slot: 22
        border:
          material: GRAY_STAINED_GLASS_PANE
          name: " "
          lore:
            - "不可移动"
  energy:
    electric-consumer:
      @istemplate: true
      @define:
        capacity: 1280
        consumption: 4
      energy:
        capacity: ${capacity}
        consumption-per-tick: ${consumption}
    electric-furnace-base:
      @copyfrom: templates.energy.electric-consumer
      @istemplate: true
      progress-material: ${default-progress-material}
    passive-component:
      @it: true
      energy:
        capacity: 0
        generation-per-tick: 0
        consumption-per-tick: 0
        burn-rate: 10
      vanilla-fuel: false
      progress-material: REDSTONE
      fuels: []
    charger:
      @copyfrom: templates.energy.passive-component
      @it: true
      type: CHARGER
      progress-material: GOLDEN_PICKAXE
      energy:
        capacity: ${capacity}
        consumption-per-tick: ${consumption}
  machines:
    standard-electric-machine:
      @copyfrom: templates.ui.standard-electric-machine
      @istemplate: true
      @define:
        machine-title: Electric Machine
        level-suffix: ""
        speed: 1
      speed: 1
      progress-material: ${default-progress-material}
    electric-furnace:
      @copyfrom: templates.machines.standard-electric-machine
      @istemplate: true
      @define:
        machine-title: Electric Furnace
        level-suffix: " <gray>-</gray> <yellow>I</yellow>"
        speed: 1
        capacity: 1280
        consumption: 4
      title: "<gold>${machine-title}</gold>${level-suffix}"
      speed: ${speed}
      energy:
        capacity: ${capacity}
        consumption-per-tick: ${consumption}
