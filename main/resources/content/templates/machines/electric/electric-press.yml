# Electric press machine family. It accepts material-pressing recipes for
# compressing, forming and compacting materials.
items:
  "sf:electric_press":
    @d:
      suffix: ""
    category: sf:electricity
    material: PLAYER_HEAD
    name-key: items.sf.electric_press${suffix}.name
    priority: 410
    headTexture: 8d5cf92bc79ec19f4106441affff1406a1367010dcafb197dd94cfca1a6de0fc
    lore-key: items.sf.electric_press${suffix}.lore
    flags:
    - legacy-sf
  "sf:electric_press_2":
    @cf: items.sf:electric_press
    @d:
      suffix: "_2"
    priority: 411
machine-catalog:
  "sf:electric_press":
    @d:
      suffix: ""
    category: ELECTRIC
    display-name: sf:electric_press${suffix}
    status-slot: -1
    tick-interval: 1
    tags:
    - machine
    - electric
  "sf:electric_press_2":
    @cf: machine-catalog.sf:electric_press
    @d:
      suffix: "_2"
machines:
  @ot: content/machines/electric-machines.yml
  "sf:electric_press":
    @cf: templates.machines.standard-electric-definition
    @io: true
    @d:
      suffix: ""
      speed: 1
      capacity: 25600
      consumption: 16
      progress-material: IRON_HOE
    name-key: items.sf.electric_press${suffix}.name
    runtime:
      executor: sf:electric_processing
      accepts:
        recipe-tags:
        - material-pressing
      include-recipes: []
      exclude-recipes: []
  "sf:electric_press_2":
    @cf: machines.sf:electric_press
    @d:
      suffix: "_2"
    speed: 3
    energy:
      capacity: 51200
      consumption-per-tick: 40
