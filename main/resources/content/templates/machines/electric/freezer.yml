

items:
  "sf:freezer":
    @d:
      suffix: ""
    category: sf:electricity
    material: LIGHT_BLUE_STAINED_GLASS
    name-key: items.sf.freezer${suffix}.name
    priority: 439
    lore-key: items.sf.freezer${suffix}.lore
    flags:
    - legacy-sf
  "sf:freezer_2":
    @cf: items.sf:freezer
    @d:
      suffix: "_2"
    priority: 440
  "sf:freezer_3":
    @cf: items.sf:freezer
    @d:
      suffix: "_3"
    priority: 441
machine-catalog:
  "sf:freezer":
    @d:
      suffix: ""
    category: ELECTRIC
    display-name: sf:freezer${suffix}
    status-slot: -1
    tick-interval: 1
    tags:
    - machine
    - electric
  "sf:freezer_2":
    @cf: machine-catalog.sf:freezer
    @d:
      suffix: "_2"
  "sf:freezer_3":
    @cf: machine-catalog.sf:freezer
    @d:
      suffix: "_3"
machines:
  @ot: content/machines/electric-machines.yml
  "sf:freezer":
    @cf: templates.machines.standard-electric-definition
    @io: true
    @d:
      suffix: ""
      speed: 1
      capacity: 5120
      consumption: 18
      progress-material: GOLDEN_PICKAXE
    name-key: items.sf.freezer${suffix}.name
    runtime:
      executor: sf:electric_processing
      accepts:
        recipe-tags:
        - freezing
      include-recipes: []
      exclude-recipes: []
  "sf:freezer_2":
    @cf: machines.sf:freezer
    @d:
      suffix: "_2"
    speed: 2
    energy:
      capacity: 5120
      consumption-per-tick: 30
  "sf:freezer_3":
    @cf: machines.sf:freezer
    @d:
      suffix: "_3"
    speed: 3
    energy:
      capacity: 5120
      consumption-per-tick: 42
