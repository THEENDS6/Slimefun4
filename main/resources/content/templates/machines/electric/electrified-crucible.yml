# Electrified Crucible machine family. It accepts crucible melting recipes.
items:
  "sf:electrified_crucible":
    category: sf:electricity
    material: RED_TERRACOTTA
    name-key: items.sf.electrified_crucible.name
    priority: 412
    lore-key: items.sf.electrified_crucible.lore
    flags: [legacy-sf]
  "sf:electrified_crucible_2":
    category: sf:electricity
    material: RED_TERRACOTTA
    name-key: items.sf.electrified_crucible_2.name
    priority: 413
    lore-key: items.sf.electrified_crucible_2.lore
    flags: [legacy-sf]
  "sf:electrified_crucible_3":
    category: sf:electricity
    material: RED_TERRACOTTA
    name-key: items.sf.electrified_crucible_3.name
    priority: 414
    lore-key: items.sf.electrified_crucible_3.lore
    flags: [legacy-sf]
machine-catalog:
  "sf:electrified_crucible": {category: ELECTRIC, display-name: sf:electrified_crucible, status-slot: -1, tick-interval: 1, tags: [machine, electric]}
  "sf:electrified_crucible_2": {category: ELECTRIC, display-name: sf:electrified_crucible_2, status-slot: -1, tick-interval: 1, tags: [machine, electric]}
  "sf:electrified_crucible_3": {category: ELECTRIC, display-name: sf:electrified_crucible_3, status-slot: -1, tick-interval: 1, tags: [machine, electric]}
machines:
  @ot: content/machines/electric-machines.yml
  "sf:electrified_crucible":
    @cf: templates.machines.standard-electric-definition
    @io: true
    @d: {name-key: items.sf.electrified_crucible.name, speed: 1, capacity: 20480, consumption: 72, progress-material: FLINT_AND_STEEL}
    runtime: {executor: sf:electric_processing, accepts: {recipe-tags: [crucible-melting]}, include-recipes: [], exclude-recipes: []}
  "sf:electrified_crucible_2":
    @cf: templates.machines.standard-electric-definition
    @io: true
    @d: {name-key: items.sf.electrified_crucible_2.name, speed: 2, capacity: 40960, consumption: 120, progress-material: FLINT_AND_STEEL}
    runtime: {executor: sf:electric_processing, accepts: {recipe-tags: [crucible-melting]}, include-recipes: [], exclude-recipes: []}
  "sf:electrified_crucible_3":
    @cf: templates.machines.standard-electric-definition
    @io: true
    @d: {name-key: items.sf.electrified_crucible_3.name, speed: 4, capacity: 81920, consumption: 180, progress-material: FLINT_AND_STEEL}
    runtime: {executor: sf:electric_processing, accepts: {recipe-tags: [crucible-melting]}, include-recipes: [], exclude-recipes: []}
