    - machine
    - electric
  "sf:electrified_crucible_2":
    @cf: machine-catalog.sf:electrified_crucible
    @d:
      suffix: "_2"
  "sf:electrified_crucible_3":
    @cf: machine-catalog.sf:electrified_crucible
    @d:
      suffix: "_3"
machines:
  @ot: content/machines/electric-machines.yml
  "sf:electrified_crucible":
    @cf: templates.machines.standard-electric-definition
    @io: true
    @d:
      suffix: ""
      speed: 1
      capacity: 20480
      consumption: 72
      progress-material: FLINT_AND_STEEL
    name-key: items.sf.electrified_crucible${suffix}.name
    runtime:
      executor: sf:electric_processing
      accepts:
        recipe-tags:
        - crucible-melting
      include-recipes: []
      exclude-recipes: []
  "sf:electrified_crucible_2":
    @cf: machines.sf:electrified_crucible
    @d:
      suffix: "_2"
    speed: 2
    energy:
      capacity: 40960
      consumption-per-tick: 120
  "sf:electrified_crucible_3":
    @cf: machines.sf:electrified_crucible
    @d:
      suffix: "_3"
    speed: 4
    energy:
      capacity: 81920
      consumption-per-tick: 180
