    @io: true
    @d: {name-key: items.sf.electric_gold_pan_2.name, speed: 3, capacity: 5120, consumption: 4, progress-material: DIAMOND_SHOVEL}
    runtime: {executor: sf:electric_processing, accepts: {recipe-tags: [panning]}, include-recipes: [], exclude-recipes: []}
  "sf:electric_gold_pan_3":
    @cf: templates.machines.standard-electric-definition
