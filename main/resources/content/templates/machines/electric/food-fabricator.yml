# Food fabricator machine family. It accepts food-fabrication recipes.
items:
  "sf:food_fabricator":
    category: sf:electricity
    material: GREEN_STAINED_GLASS
    name-key: items.sf.food_fabricator.name
    priority: 433
    lore-key: items.sf.food_fabricator.lore
    flags: [legacy-sf]
  "sf:food_fabricator_2":
    category: sf:electricity
    material: GREEN_STAINED_GLASS
    name-key: items.sf.food_fabricator_2.name
    priority: 434
    lore-key: items.sf.food_fabricator_2.lore
    flags: [legacy-sf]
machine-catalog:
  "sf:food_fabricator": {category: ELECTRIC, display-name: sf:food_fabricator, status-slot: -1, tick-interval: 1, tags: [machine, electric]}
  "sf:food_fabricator_2": {category: ELECTRIC, display-name: sf:food_fabricator_2, status-slot: -1, tick-interval: 1, tags: [machine, electric]}
machines:
  @ot: content/machines/electric-machines.yml
  "sf:food_fabricator":
    @cf: templates.machines.standard-electric-definition
    @io: true
    @d: {name-key: items.sf.food_fabricator.name, speed: 1, capacity: 5120, consumption: 14, progress-material: GOLDEN_HOE}
    runtime: {executor: sf:electric_processing, accepts: {recipe-tags: [food-fabrication]}, include-recipes: [], exclude-recipes: []}
  "sf:food_fabricator_2":
    @cf: templates.machines.standard-electric-definition
    @io: true
    @d: {name-key: items.sf.food_fabricator_2.name, speed: 6, capacity: 10240, consumption: 48, progress-material: GOLDEN_HOE}
    runtime: {executor: sf:electric_processing, accepts: {recipe-tags: [food-fabrication]}, include-recipes: [], exclude-recipes: []}
