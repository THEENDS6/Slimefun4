# Heated pressure chamber machine family. It accepts heated-pressure-processing
# recipes for pressure and heat based material processing.
items:
  "sf:heated_pressure_chamber":
    category: sf:electricity
    material: LIGHT_GRAY_STAINED_GLASS
    name-key: items.sf.heated_pressure_chamber.name
    priority: 406
    lore-key: items.sf.heated_pressure_chamber.lore
    flags: [legacy-sf]
  "sf:heated_pressure_chamber_2":
    category: sf:electricity
    material: LIGHT_GRAY_STAINED_GLASS
    name-key: items.sf.heated_pressure_chamber_2.name
    priority: 407
    lore-key: items.sf.heated_pressure_chamber_2.lore
    flags: [legacy-sf]
machine-catalog:
  "sf:heated_pressure_chamber": {category: ELECTRIC, display-name: sf:heated_pressure_chamber, status-slot: -1, tick-interval: 1, tags: [machine, electric]}
  "sf:heated_pressure_chamber_2": {category: ELECTRIC, display-name: sf:heated_pressure_chamber_2, status-slot: -1, tick-interval: 1, tags: [machine, electric]}
machines:
  @ot: content/machines/electric-machines.yml
  "sf:heated_pressure_chamber":
    @cf: templates.machines.standard-electric-definition
    @io: true
    @d: {name-key: items.sf.heated_pressure_chamber.name, speed: 1, capacity: 20480, consumption: 10, progress-material: FLINT_AND_STEEL}
    runtime: {executor: sf:electric_processing, accepts: {recipe-tags: [heated-pressure-processing]}, include-recipes: [], exclude-recipes: []}
  "sf:heated_pressure_chamber_2":
    @cf: templates.machines.standard-electric-definition
    @io: true
    @d: {name-key: items.sf.heated_pressure_chamber_2.name, speed: 5, capacity: 81920, consumption: 44, progress-material: FLINT_AND_STEEL}
    runtime: {executor: sf:electric_processing, accepts: {recipe-tags: [heated-pressure-processing]}, include-recipes: [], exclude-recipes: []}
