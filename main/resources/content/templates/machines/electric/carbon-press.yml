    @io: true
    @d:
      name-key: items.sf.carbon_press.name
      speed: 1
      capacity: 25600
      consumption: 20
      progress-material: DIAMOND_PICKAXE
    runtime:
      executor: sf:electric_processing
      accepts:
        recipe-tags:
        - carbon-pressing
      include-recipes: []
      exclude-recipes: []
  "sf:carbon_press_2":
    @cf: machines.sf:carbon_press
    name-key: items.sf.carbon_press_2.name
    speed: 3
    energy:
      capacity: 81920
      consumption-per-tick: 50
  "sf:carbon_press_3":
    @cf: machines.sf:carbon_press
    name-key: items.sf.carbon_press_3.name
    speed: 15
    energy:
      capacity: 327680
      consumption-per-tick: 180
