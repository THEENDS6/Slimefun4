

items:
  "sf:carbon_press":
    category: sf:electricity
    material: BLACK_STAINED_GLASS
    name-key: items.sf.carbon_press.name
    priority: 415
    lore-key: items.sf.carbon_press.lore
    flags:
    - legacy-sf
  "sf:carbon_press_2":
    @cf: items.sf:carbon_press
    name-key: items.sf.carbon_press_2.name
    priority: 416
    lore-key: items.sf.carbon_press_2.lore
  "sf:carbon_press_3":
    @cf: items.sf:carbon_press
    name-key: items.sf.carbon_press_3.name
