

items:
  "sf:carbon_press":
    @d:
      suffix: ""
    category: sf:electricity
    material: BLACK_STAINED_GLASS
    name-key: items.sf.carbon_press${suffix}.name
    priority: 415
    lore-key: items.sf.carbon_press${suffix}.lore
    flags:
    - legacy-sf
  "sf:carbon_press_2":
    @cf: items.sf:carbon_press
    @d:
      suffix: "_2"
    priority: 416
  "sf:carbon_press_3":
    @cf: items.sf:carbon_press
    @d:
      suffix: "_3"
    priority: 417
machine-catalog:
  "sf:carbon_press":
    @d:
      suffix: ""
    category: ELECTRIC
    display-name: sf:carbon_press${suffix}
    status-slot: -1
    tick-interval: 1
    tags:
    - machine
    - electric
  "sf:carbon_press_2":
    @cf: machine-catalog.sf:carbon_press
    @d:
      suffix: "_2"
  "sf:carbon_press_3":
    @cf: machine-catalog.sf:carbon_press
    @d:
      suffix: "_3"
machines:
  @ot: content/machines/electric-machines.yml
  "sf:carbon_press":
    @cf: templates.machines.standard-electric-definition
    @io: true
    @d:
      suffix: ""
      speed: 1
      capacity: 25600
      consumption: 20
      progress-material: DIAMOND_PICKAXE
    name-key: items.sf.carbon_press${suffix}.name
    runtime:
      executor: sf:electric_processing
      accepts:
        recipe-tags:
        - carbon-pressing
      include-recipes: []
      exclude-recipes: []
  "sf:carbon_press_2":
    @cf: machines.sf:carbon_press
    @d:
      suffix: "_2"
    speed: 3
    energy:
      capacity: 81920
      consumption-per-tick: 50
  "sf:carbon_press_3":
    @cf: machines.sf:carbon_press
    @d:
      suffix: "_3"
    speed: 15
    energy:
      capacity: 327680
      consumption-per-tick: 180
