machine-catalog:
  "sf:carbon_press":
    category: ELECTRIC
    display-name: sf:carbon_press
    status-slot: -1
    tick-interval: 1
    tags:
    - machine
    - electric
  "sf:carbon_press_2":
    @cf: machine-catalog.sf:carbon_press
    display-name: sf:carbon_press_2
  "sf:carbon_press_3":
    @cf: machine-catalog.sf:carbon_press
    display-name: sf:carbon_press_3
machines:
  @ot: content/machines/electric-machines.yml
  "sf:carbon_press":
