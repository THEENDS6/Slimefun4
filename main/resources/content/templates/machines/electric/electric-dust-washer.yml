# Electric Dust Washer machine family. It accepts dust washing recipes.
items:
  "sf:electric_dust_washer":
    @d:
      suffix: ""
    category: sf:electricity
    material: BLUE_STAINED_GLASS
    name-key: items.sf.electric_dust_washer${suffix}.name
    priority: 445
    lore-key: items.sf.electric_dust_washer${suffix}.lore
    flags:
    - legacy-sf
  "sf:electric_dust_washer_2":
    @cf: items.sf:electric_dust_washer
    @d:
      suffix: "_2"
    priority: 446
  "sf:electric_dust_washer_3":
    @cf: items.sf:electric_dust_washer
    @d:
      suffix: "_3"
    priority: 447
machine-catalog:
  "sf:electric_dust_washer":
    @d:
      suffix: ""
    category: ELECTRIC
    display-name: sf:electric_dust_washer${suffix}
    status-slot: -1
    tick-interval: 1
    tags:
    - machine
    - electric
  "sf:electric_dust_washer_2":
    @cf: machine-catalog.sf:electric_dust_washer
    @d:
      suffix: "_2"
  "sf:electric_dust_washer_3":
    @cf: machine-catalog.sf:electric_dust_washer
    @d:
      suffix: "_3"
machines:
  @ot: content/machines/electric-machines.yml
  "sf:electric_dust_washer":
    @cf: templates.machines.standard-electric-definition
    @io: true
    @d:
      suffix: ""
      speed: 1
      capacity: 5120
      consumption: 6
      progress-material: GOLDEN_SHOVEL
      working-name-key: electric-ui.action.washing.name
    name-key: items.sf.electric_dust_washer${suffix}.name
    runtime:
      executor: sf:electric_processing
      accepts:
        recipe-tags:
        - dust-washing
      include-recipes: []
      exclude-recipes: []
  "sf:electric_dust_washer_2":
    @cf: machines.sf:electric_dust_washer
    @d:
      suffix: "_2"
    speed: 2
    energy:
      capacity: 10240
      consumption-per-tick: 10
  "sf:electric_dust_washer_3":
    @cf: machines.sf:electric_dust_washer
    @d:
      suffix: "_3"
    speed: 10
    energy:
      capacity: 20480
      consumption-per-tick: 30
