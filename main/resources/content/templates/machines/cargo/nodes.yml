machine-catalog:
  @ot: content/machines/catalog.yml
  sf:cargo_manager:
    category: CARGO
    display-name: sf:cargo_manager
    status-slot: -1
    tick-interval: 1
    tags: [machine, cargo, cargo-node]
    profile: cargo_node
  sf:cargo_node:
    category: CARGO
    display-name: sf:cargo_node
    status-slot: -1
    tick-interval: 1
    tags: [machine, cargo, cargo-node]
    profile: cargo_node
  sf:cargo_node_input:
    category: CARGO
    display-name: sf:cargo_node_input
    status-slot: -1
    tick-interval: 1
    tags: [machine, cargo, cargo-node]
    profile: cargo_node
  sf:cargo_node_input_advanced:
    category: CARGO
    display-name: sf:cargo_node_input_advanced
    status-slot: -1
    tick-interval: 1
    tags: [machine, cargo, cargo-node]
    profile: cargo_node
  sf:cargo_node_output:
    category: CARGO
    display-name: sf:cargo_node_output
    status-slot: -1
    tick-interval: 1
    tags: [machine, cargo, cargo-node]
    profile: cargo_node
  sf:cargo_node_output_advanced:
    category: CARGO
    display-name: sf:cargo_node_output_advanced
    status-slot: -1
    tick-interval: 1
    tags: [machine, cargo, cargo-node]
    profile: cargo_node
  sf:trash_can_block:
    category: CARGO
    display-name: sf:trash_can_block
    status-slot: -1
    tick-interval: 1
    tags: [machine, cargo, cargo-node]
    profile: cargo_node

cargo-components:
  @ot: content/machines/cargo-components.yml
  sf:cargo_manager:
    @io: true
    type: MANAGER
  sf:cargo_node:
    @io: true
    type: CONNECTOR
  sf:cargo_node_input:
    @io: true
    type: INPUT_NODE
  sf:cargo_node_input_advanced:
    @io: true
    type: ADVANCED_INPUT_NODE
  sf:cargo_node_output:
    @io: true
    type: OUTPUT_NODE
  sf:cargo_node_output_advanced:
    @io: true
    type: ADVANCED_OUTPUT_NODE
  sf:trash_can_block:
    @io: true
    type: TRASH_CAN
