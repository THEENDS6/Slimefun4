# 电炉 1-3 的模板化样板。
# 文件名前缀数字用于控制模板编译顺序。

machines:
  @ot: content/machines/electric-machines.yml
  "sf:electric_furnace":
    @cf: templates.machines.electric-furnace
    @io: true
  "sf:electric_furnace_2":
    @copyfrom: machines.sf:electric_furnace
    @isoutput: true
    @define:
      level-suffix: " &7- &eII"
      speed: 2
      capacity: 2560
      consumption: 6
  "sf:electric_furnace_3":
    @copyfrom: machines.sf:electric_furnace_2
    @isoutput: true
    @define:
      level-suffix: " &7- &eIII"
      speed: 4
      capacity: 5120
      consumption: 10
