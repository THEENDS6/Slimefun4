              material: GRAY_STAINED_GLASS_PANE
              name: " "
              lore: []
        items:
          auto-crafter.container.ok:
            material: CHEST
            name-key: electric-ui.template.auto-crafter.container.name
            lore-key: electric-ui.template.auto-crafter.container.lore
          auto-crafter.container.missing:
            material: BARRIER
            name-key: electric-ui.template.auto-crafter.container.name
            lore-key: electric-ui.template.auto-crafter.container.lore
          auto-crafter.enabled:
            material: BARRIER
            name-key: electric-ui.template.auto-crafter.enabled.name
            lore-key: electric-ui.template.auto-crafter.recipe-button.lore
          auto-crafter.disabled:
