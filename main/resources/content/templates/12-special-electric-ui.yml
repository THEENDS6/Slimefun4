          - slots: [3, 4, 5, 12, 14, 21, 23]
            item:
              material: GRAY_STAINED_GLASS_PANE
              name: " "
              lore: []
          - slots: [6, 7, 8, 15, 17, 24, 25, 26]
            item:
              material: BLUE_STAINED_GLASS_PANE
              name-key: electric-ui.template.auto-brewer.ingredient-frame.name
