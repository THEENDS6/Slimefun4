            name-key: electric-ui.template.auto-crafter.disabled.name
            lore-key: electric-ui.template.auto-crafter.recipe-button.lore
          auto-crafter.no-recipe:
            material: PAPER
            name-key: electric-ui.template.auto-crafter.no-recipe.name
            lore-key: electric-ui.template.auto-crafter.no-recipe.lore
          auto-crafter.previous:
            material: ARROW
            name-key: electric-ui.template.auto-crafter.previous.name
            lore-key: electric-ui.template.auto-crafter.page.lore
          auto-crafter.next:
            material: ARROW
            name-key: electric-ui.template.auto-crafter.next.name
            lore-key: electric-ui.template.auto-crafter.page.lore
          auto-crafter.select:
            material: CRAFTING_TABLE
            name-key: electric-ui.template.auto-crafter.select.name
            lore-key: electric-ui.template.auto-crafter.select.lore
    assembler-base:
      @it: true
      ui:
        inventory-size: 54
        status-slot: 22
        frame:
          - slots: [0, 2, 3, 4, 5, 6, 8, 12, 14, 21, 23, 30, 32, 39, 40, 41, 45, 46, 47, 48, 49, 50, 51, 52, 53]
