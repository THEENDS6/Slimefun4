          - slots: [0, 2, 3, 4, 5, 6, 8, 12, 14, 21, 23, 30, 32, 39, 40, 41, 45, 46, 47, 48, 49, 50, 51, 52, 53]
            item:
              material: GRAY_STAINED_GLASS_PANE
              name: " "
              lore: []
          - slots: [9, 10, 11, 18, 20, 27, 29, 36, 37, 38]
            item:
              material: ORANGE_STAINED_GLASS_PANE
              name-key: electric-ui.template.assembler.head.name
              lore: []
          - slots: [15, 16, 17, 24, 26, 33, 35, 42, 43, 44]
            item:
              material: WHITE_STAINED_GLASS_PANE
              name-key: electric-ui.template.assembler.body.name
              lore: []
    wither-assembler:
      @it: true
      @cf: templates.ui.assembler-base
      ui:
        frame:
          - slots: [0, 2, 3, 4, 5, 6, 8, 12, 14, 21, 23, 30, 32, 39, 40, 41, 45, 46, 47, 48, 49, 50, 51, 52, 53]
            item:
              material: GRAY_STAINED_GLASS_PANE
              name: " "
              lore: []
          - slots: [9, 10, 11, 18, 20, 27, 29, 36, 37, 38]
            item:
              material: BLACK_STAINED_GLASS_PANE
              name-key: electric-ui.template.assembler.head.name
              lore: []
          - slots: [15, 16, 17, 24, 26, 33, 35, 42, 43, 44]
            item:
              material: BROWN_STAINED_GLASS_PANE
              name-key: electric-ui.template.assembler.body.name
              lore: []

