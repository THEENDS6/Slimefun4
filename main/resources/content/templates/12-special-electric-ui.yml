            name-key: electric-ui.template.assembler.offset.name
            lore-key: electric-ui.template.assembler.offset.lore
          assembler.head.display:
            material: CARVED_PUMPKIN
            name-key: electric-ui.template.assembler.head.name
            lore-key: electric-ui.template.assembler.required.lore
          assembler.body.display:
            material: IRON_BLOCK
            name-key: electric-ui.template.assembler.body.name
            lore-key: electric-ui.template.assembler.required.lore
    iron-golem-assembler:
      @it: true
      @cf: templates.ui.assembler-base
      ui:
