              lore: []
        items:
          assembler.enabled:
            material: LIME_STAINED_GLASS_PANE
            name-key: electric-ui.template.assembler.enabled.name
            lore-key: electric-ui.template.assembler.toggle.lore
          assembler.disabled:
            material: RED_STAINED_GLASS_PANE
            name-key: electric-ui.template.assembler.disabled.name
            lore-key: electric-ui.template.assembler.disabled.lore
          assembler.offset:
