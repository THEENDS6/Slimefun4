# 可配置机器定义。
# 用于反应堆等结构复杂、仍需要专用控制器的机器，把速度、电力、材料和基础参数集中到 YAML。
#
# 完整示例（复制后去掉注释即可启用）：
# machines:
#   sf:example_configurable_machine:
#     title: "Example Configurable Machine"
#     head-material: FURNACE
#     body-material: IRON_BLOCK
#     speed: 1
#     energy:
#       capacity: 10000
#       consumption-per-tick: 20

machines:
  "sf:nuclear_reactor":
    kind: REACTOR
    energy:
      capacity: 327680
      energy-per-action: 0
      energy-per-tick: 500
    reactor:
      coolant-item: "sf:reactor_coolant_cell"
      wither-aura: false
      fuels:
        - key: "sf:uranium"
          amount: 1
          seconds: 1200
          output: {item: "sf:neptunium", amount: 1}
        - key: "sf:neptunium"
          amount: 1
          seconds: 600
          output: {item: "sf:plutonium", amount: 1}
        - key: "sf:boosted_uranium"
          amount: 1
          seconds: 1500
    ui:
      panels:
        reactor:
          inventory-size: 54
          frame:
            - slots: [0, 1, 2, 3, 5, 6, 7, 8, 12, 13, 14, 21, 23]
              item: {material: GRAY_STAINED_GLASS_PANE, name: " ", lore: []}
            - slots: [9, 10, 11, 18, 20, 27, 29, 36, 38, 45, 46, 47]
              item: {material: LIME_STAINED_GLASS_PANE, name: " ", lore: []}
            - slots: [15, 16, 17, 24, 26, 33, 35, 42, 44, 51, 52, 53]
              item: {material: CYAN_STAINED_GLASS_PANE, name: " ", lore: []}
            - slots: [30, 31, 32, 39, 41, 48, 50]
              item: {material: GREEN_STAINED_GLASS_PANE, name: " ", lore: []}
          inputs:
            - slot: 19
              state-index: 0
              accepts: reactor-fuel
            - slot: 28
              state-index: 1
              accepts: reactor-fuel
            - slot: 37
              state-index: 2
              accepts: reactor-fuel
            - slot: 25
              state-index: 3
              accepts: reactor-coolant
            - slot: 34
              state-index: 4
              accepts: reactor-coolant
            - slot: 43
              state-index: 5
              accepts: reactor-coolant
          outputs:
            - slot: 40
              state-index: 0
          buttons:
            - slot: 4
              action: reactor-toggle-mode
              item-source: reactor.mode
            - slot: 49
              action: reactor-access-port
              item-source: reactor.access-port
          status:
            - slot: 22
              item-source: reactor.progress
          display:
            - slot: 1
              item-source: reactor.fuel-slots
            - slot: 7
              item-source: reactor.coolant-slots
        access-port:
          inventory-size: 54
          frame:
            - slots: [0, 1, 2, 3, 5, 6, 7, 8, 12, 13, 14, 21, 23]
              item: {material: GRAY_STAINED_GLASS_PANE, name: " ", lore: []}
            - slots: [9, 10, 11, 18, 20, 27, 29, 36, 38, 45, 46, 47]
              item: {material: LIME_STAINED_GLASS_PANE, name: " ", lore: []}
