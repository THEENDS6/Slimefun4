# 电力系统组件定义。
# 该文件只描述电网节点、储能、耗电、发电和燃料；机器运行/UI 不应写在这里。
# capacity/generation/consumption 均为插件内部能量单位。
components:
  "sf:energy_regulator":
    # type 决定此方块在电网中的角色。
    type: REGULATOR
    energy:
      capacity: 0
      generation-per-tick: 0
      consumption-per-tick: 0
      burn-rate: 10
    vanilla-fuel: false
    progress-material: REDSTONE
    fuels: []
