content-expansion:
  ui:
    water:
      name: <blue>Electrolyte</blue>
      amount: '<gray>Stored: </gray><aqua>{stored}</aqua><gray> / </gray><aqua>{capacity} mB</aqua>'
      insert: <aqua>Water Buckets provide 1000 mB; Water Bottles provide 100 mB</aqua>
      consumption: <gray>Consumes <aqua>{consumption} mB</aqua> per tick while working</gray>
      bonus: <gray>Electrolyte quadruples generation and increases processing speed to 1.25x</gray>
      output: <gray>The empty Bucket or Bottle is returned immediately when its water enters storage</gray>
    oxidizing:
      active: <gray>Processing materials through oxidation and generating power.</gray>
    mode:
      power:
        name: <yellow>Power Mode</yellow>
        lore: <gray>Processing may auto-pause when the energy grid is full</gray>
      production:
        name: <aqua>Production Mode</aqua>
        lore: <gray>Continues processing even while the energy grid is full</gray>
      toggle: <yellow>Click to switch mode</yellow>
    salt:
      name: <yellow>Salt Storage</yellow>
      amount: '<gray>Stored: </gray><yellow>{stored}</yellow><gray> / </gray><yellow>{capacity}</yellow><gray> ticks</gray>'
      items: '<gray>Equivalent: </gray><yellow>{items}</yellow><gray> / </gray><yellow>{capacity_items}</yellow><gray> Salt</gray>'
      effect: <gray>Stored Salt increases generation to <yellow>1.5x</yellow></gray>
      insert: <yellow>Insert Salt into the upper-right slot</yellow>
    wax:
      name: <gold>Wax Storage</gold>
      amount: '<gray>{stored} / {capacity} uses</gray>'
      insert: <yellow>Honey Bottle 1 use, Honeycomb 3 uses, Bee Nest 10 uses</yellow>
  guide:
    oxidizing:
      copper:
      - <gray>Oxidizes copper materials and outputs the corresponding oxidized product.</gray>
      - <gray>Base generation is <yellow>24 J/t</yellow> with <yellow>120 ticks</yellow> per copper unit.</gray>
      zinc:
      - <gray>Zinc generates power without producing an oxidized output.</gray>
      - <gray>Zinc ingots and dust generate <yellow>36 J/t</yellow> for <yellow>80 ticks</yellow>.</gray>
      magnesium:
      - <gray>Magnesium provides high-power generation without an oxidized output.</gray>
      - <gray>Magnesium ingots, dust, and salt generate <yellow>72 J/t</yellow> for <yellow>60 ticks</yellow>.</gray>
      salt:
      - <gray>Each Salt stores <yellow>600 ticks</yellow>, up to 6000 ticks internally.</gray>
      - <gray>Stored Salt increases generation to <yellow>1.5x</yellow>.</gray>
      water:
      - <gray>Water Buckets provide 1000 mB and Bottles provide 100 mB, returning the empty container immediately.</gray>
      - <gray>Consumes <aqua>5 mB/t</aqua>, quadruples generation, and increases processing speed to 1.25x.</gray>

