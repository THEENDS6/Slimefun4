content-expansion:
  ui:
    water:
      name: <blue>电解液</blue>
      amount: '<gray>储量：</gray><aqua>{stored}</aqua><gray> / </gray><aqua>{capacity} mB</aqua>'
      insert: <aqua>水桶提供 1000 mB，水瓶提供 100 mB</aqua>
      consumption: <gray>工作时每 tick 消耗 <aqua>{consumption} mB</aqua></gray>
      bonus: <gray>有电解液时发电提高至 4 倍，加工速度提高至 1.25 倍</gray>
      output: <gray>容器转入储罐时立即从输出槽返还空桶或空瓶</gray>
    oxidizing:
      active: <gray>正在通过氧化反应处理材料并产生电力。</gray>
    mode:
      power:
        name: <yellow>发电模式</yellow>
        lore: <gray>电网储能充足时允许自动暂停加工</gray>
      production:
        name: <aqua>生产模式</aqua>
        lore: <gray>即使电网储能充足也持续加工材料</gray>
      toggle: <yellow>点击切换模式</yellow>
    salt:
      name: <yellow>盐储量</yellow>
      amount: '<gray>已储存：</gray><yellow>{stored}</yellow><gray> / </gray><yellow>{capacity}</yellow><gray> tick</gray>'
      items: '<gray>约合：</gray><yellow>{items}</yellow><gray> / </gray><yellow>{capacity_items}</yellow><gray> 个盐</gray>'
      effect: <gray>有盐储量时，发电量提升至 <yellow>1.5 倍</yellow></gray>
      insert: <yellow>在右上方空槽放入盐</yellow>
    wax:
      name: <gold>蜂蜡储量</gold>
      amount: '<gray>{stored} / {capacity} 次</gray>'
      insert: <yellow>蜂蜜瓶 1 次，蜜脾 3 次，蜂巢 10 次</yellow>
  guide:
    oxidizing:
      copper:
      - <gray>氧化铜材料，并输出对应的氧化产物。</gray>
      - <gray>基础发电量 <yellow>24 J/t</yellow>，每单位铜基础加工时间 <yellow>120 tick</yellow>。</gray>
      zinc:
      - <gray>锌用于发电，不产生氧化产物。</gray>
      - <gray>锌锭与锌粉均为 <yellow>36 J/t</yellow>，基础加工时间 <yellow>80 tick</yellow>。</gray>
      magnesium:
      - <gray>镁用于高功率发电，不产生氧化产物。</gray>
      - <gray>镁锭、镁粉与镁盐均为 <yellow>72 J/t</yellow>，基础加工时间 <yellow>60 tick</yellow>。</gray>
      salt:
      - <gray>每个盐提供 <yellow>600 tick</yellow>内部储量，最多储存 6000 tick。</gray>
      - <gray>有盐时发电量提高至 <yellow>1.5 倍</yellow>。</gray>
      water:
      - <gray>水桶提供 1000 mB，水瓶提供 100 mB，并立即返还空容器。</gray>
      - <gray>工作时消耗 <aqua>5 mB/t</aqua>，发电提高至 4 倍、加工速度提高至 1.25 倍。</gray>

