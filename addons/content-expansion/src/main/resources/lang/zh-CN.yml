content-expansion:
  ui:
    water:
      name: <blue>电解液</blue>
      amount: '<gray>储量：</gray><aqua>{stored}</aqua><gray> / </gray><aqua>{capacity} mB</aqua>'
      insert: <aqua>水桶提供 1000 mB，水瓶提供 100 mB</aqua>
      effect: <gray>强化加工每 tick 消耗 <aqua>{consumption} mB</aqua>，发电提高至 4 倍且耗时缩短 20%</gray>
      output: <gray>容器转入储罐时立即从输出槽返还空桶或空瓶</gray>
    mode:
      power:
        name: <yellow>发电模式</yellow>
        lore: <gray>电网储能充足时允许自动暂停加工</gray>
      production:
        name: <aqua>生产模式</aqua>
        lore: <gray>即使电网储能充足也持续加工材料</gray>
      toggle: <yellow>点击切换模式</yellow>
    salt:
      name: <yellow>盐储量</yellow>
      amount: '<gray>已储存：</gray><yellow>{stored}</yellow><gray> / </gray><yellow>{capacity}</yellow><gray> tick</gray>'
      items: '<gray>约合：</gray><yellow>{items}</yellow><gray> / </gray><yellow>{capacity_items}</yellow><gray> 个盐</gray>'
      effect: <gray>有盐储量时，发电量提升至 <yellow>1.5 倍</yellow></gray>
      insert: <yellow>在右上方空槽放入盐</yellow>
    wax:
      name: <gold>蜂蜡储量</gold>
      amount: '<gray>{stored} / {capacity} 次</gray>'
      insert: <yellow>蜂蜜瓶 1 次，蜜脾 3 次，蜂巢 10 次</yellow>

