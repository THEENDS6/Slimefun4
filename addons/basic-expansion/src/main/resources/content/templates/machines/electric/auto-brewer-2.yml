# SFX Basic Expansion: Auto Brewer II.
items:
  "sf:auto_brewer_2":
    requires-feature: sfx:auto_brewer
    category: sf:electricity
    guide-category: guide:sf:electricity
    material: SMOKER
    name-key: items.sf.auto_brewer_2.name
    priority: 361
    guide-order: 360.1
    lore-key: items.sf.auto_brewer_2.lore
    flags: [legacy-sf]

machine-catalog:
  "sf:auto_brewer_2":
    requires-feature: sfx:auto_brewer
    category: ELECTRIC
    display-name: sf:auto_brewer_2
    status-slot: -1
    tick-interval: 1
    tags: [machine, electric, auto-brewer]
    profile: auto_brewer

machines:
  @ot: content/machines/electric-machines.yml
  "sf:auto_brewer_2":
    @cf: templates.machines.auto-brewer-definition
    @io: true
    requires-feature: sfx:auto_brewer
    @d: {name-key: items.sf.auto_brewer_2.name, speed: 5, capacity: 20480, consumption: 50, progress-material: BREWING_STAND}
    runtime: {executor: sf:provider, provider: sf:auto_brewer}
