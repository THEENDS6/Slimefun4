enabled: true

debug-energy-unit:
  max-rate: 1000000
  max-capacity: 1000000000
  default-rate: 1000
  default-capacity: 0

debug-transport-dispatcher:
  max-range: 32
  default-range-x: 8
  default-range-y: 4
  default-range-z: 8
  default-interval-ticks: 20
  max-transfers-per-run: 64
  max-speed-multiplier: 16

debug-fish:
  damage: 6.0
  lifetime-ticks: 100
  max-distance: 64.0
  speed: 1.6
  gravity-per-tick: 0.045
  bounce-retention: 0.72
  surface-retention: 0.90
  ground-friction: 0.94
  stop-bounce-speed: 0.12
  entity-bounce-retention: 0.80

magic-slime-block:
  interval-ticks: 20
