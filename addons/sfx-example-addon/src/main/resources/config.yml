enabled: true

debug-energy-unit:
  max-rate: 1000000
  max-capacity: 1000000000
  default-rate: 1000
  default-capacity: 0

debug-transport-dispatcher:
  max-range: 32
  default-range-x: 8
  default-range-y: 4
  default-range-z: 8
  default-interval-ticks: 20
  max-transfers-per-run: 64
  max-speed-multiplier: 16

debug-fish:
  damage: 6.0
  lifetime-ticks: 100
  max-distance: 64.0
  speed: 1.6
  air-drag: 0.995
  gravity-per-tick: 0.15
  bounce-retention: 0.72
  surface-retention: 0.90
  slide-drag: 0.0
  ground-bounce-tangent-retention: 0.94
  slide-normal-speed: 0.45

magic-slime-block:
  interval-ticks: 20
