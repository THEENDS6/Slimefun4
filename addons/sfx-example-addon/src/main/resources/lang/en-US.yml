items:
  sfx_example:
    slime_block_iv:
      name: '&aSlime Block IV'
      lore:
      - '&7IV stands for Slimefun 4.'
      - '&7A placeable example block declared entirely in YAML.'
    debug_energy_unit:
      name: '&eDEBUG Energy Unit'
      lore:
      - '&7A configurable energy-grid test node.'
      - '&7Supports stopped, generating, and consuming modes.'
      - '&cAdministrator debugging only.'
    debug_transport_dispatcher:
      name: '&6DEBUG Transport Dispatcher'
      lore:
      - '&7Tests regional cargo dispatch and topology caches.'
      - '&7Coexists with a normal Cargo Manager and controls the network.'
      - '&cAdministrator debugging only.'
    debug_fish:
      name: '&bDEBUG Bouncy Fish Ball'
      lore:
      - '&7A tribute to the classic Slimefun4 DEBUG fish.'
      - '&7Inherits launch velocity and damages entities on contact.'
      - '&7Bounces off blocks and slides without drag after gentle landings.'
      - '&cAdministrator debugging only.'
    magic_slime_block:
      name: '&dMagic Slime Block'
      lore:
      - '&7Cycles between slime and honey blocks.'
      - '&7Validates the public rainbow-block API.'
      - '&cAdministrator debugging only.'

researches:
  sfx_example:
    debug:
      name: DEBUG API Examples

example-energy:
  mode:
    name: '&eSwitch mode'
    lore: '&7Current: {mode}; click to cycle stop/generate/consume.'
    stopped: '&cStopped'
    generating: '&aGenerating'
    consuming: '&6Consuming'
  power-section:
    name: '&ePower controls'
    lore: '&7Current power: {rate} J/t.'
  capacity-section:
    name: '&6Storage controls'
    lore: '&7Current capacity: {capacity} J.'
  rate-down: {name: '&cDecrease power'}
  rate-up: {name: '&aIncrease power'}
  rate-exact: {name: '&eEnter exact power'}
  rate: {lore: '&7Power: {rate} J/t. Click to enter a value in chat.'}
  adjust: {lore: '&7Left 1, right 10, Shift-left 100, Shift-right 1000.'}
  capacity-down: {name: '&cDecrease storage capacity'}
  capacity-up: {name: '&aIncrease storage capacity'}
  storage-exact: {name: '&eEnter storage capacity'}
  storage: {lore: '&7Capacity: {capacity} J; currently stored: {stored} J.'}
  overview:
    name: '&cEnergy unit overview'
    lore: '&7Mode: {mode} &8| &7Power: {rate} J/t &8| &7Energy: {stored}/{capacity} J'
  grid-empty:
    name: '&fEmpty entire grid'
    lore: '&7Sets every energy store in the connected grid to 0 J.'
  grid-fill:
    name: '&6Fill entire grid'
    lore: '&7Fills every energy store in the connected grid to capacity.'
  message:
    rate-prompt: '&eEnter a new power value (1-{max}), or type cancel.'
    capacity-prompt: '&eEnter a new capacity (0-{max}), or type cancel.'
    updated: '&aDEBUG Energy Unit settings updated. Reopen the block to view them.'
    invalid: '&cInvalid integer; nothing was changed.'
    timeout: '&7Input timed out; nothing was changed.'
    grid-cleared: '&aThe connected grid has been emptied.'
    grid-filled: '&aThe connected grid has been filled.'

example-cargo:
  title: '&6DEBUG Transport Dispatcher'
  state:
    name: '&eNetwork state: {state}'
    lore: '&7Current work interval: {interval} ticks.'
    enabled: '&aEnabled'
    disabled: '&cDisabled'
  enable:
    name: '&aEnable cargo network'
    lore: '&7Allows the connected network to transfer items.'
  disable:
    name: '&cDisable cargo network'
    lore: '&7Pauses all transfers in the connected network.'
  interval-down:
    name: '&cShorten work interval'
  interval-up:
    name: '&aLengthen work interval'
  interval:
    name: '&eWork interval: {interval} ticks'
    lore: '&7Left-click adjusts 0.1, right-click 1; Shift-left 10, Shift-right 100. Click the clock for exact input. 0 runs every tick until all possible transfers finish. Maximum: {max_interval} ticks.'
  visualizer:
    name: '&dToggle cargo particles'
    lore: '&7Toggles network particles for the current player.'
  message:
    interval-prompt: '&eEnter a work interval from 0 to {max} ticks (decimals allowed), or type cancel.'
    updated: '&aThe current cargo network now works every {interval} ticks.'
    invalid: '&cEnter a valid number from 0 to {max}.'
    timeout: '&7Input timed out; the work interval was not changed.'
