items:
  sfx_example:
    slime_block_iv:
      name: '&aSlime Block IV'
      lore:
      - '&7IV stands for Slimefun 4.'
      - '&7A placeable example block declared entirely in YAML.'
    debug_energy_unit:
      name: '&eDEBUG Energy Unit'
      lore:
      - '&7A configurable energy-grid test node.'
      - '&7Supports stopped, generating, and consuming modes.'
      - '&cAdministrator debugging only.'
    debug_transport_dispatcher:
      name: '&6DEBUG Transport Dispatcher'
      lore:
      - '&7Tests regional cargo dispatch and topology caches.'
      - '&7Coexists with a normal Cargo Manager and controls the network.'
      - '&cAdministrator debugging only.'
    debug_fish:
      name: '&bDEBUG Bouncy Fish Ball'
      lore:
      - '&7A tribute to the classic Slimefun4 DEBUG fish.'
      - '&7Falls under gravity and bounces off blocks or entities.'
      - '&7Keeps sliding after low-speed ground impacts.'
      - '&cAdministrator debugging only.'
    magic_slime_block:
      name: '&dMagic Slime Block'
      lore:
      - '&7Cycles between slime and honey blocks.'
      - '&7Validates the public rainbow-block API.'
      - '&cAdministrator debugging only.'

researches:
  sfx_example:
    debug:
      name: DEBUG API Examples

example-energy:
  mode:
    name: '&eSwitch mode'
    lore: '&7Current: {mode}; click to cycle stop/generate/consume.'
  rate-down: {name: '&cDecrease power'}
  rate-up: {name: '&aIncrease power'}
  rate-exact: {name: '&eEnter exact power'}
  rate: {lore: '&7Power: {rate} J/t. Click to enter a value in chat.'}
  adjust: {lore: '&7Left 1, right 10, Shift-left 100, Shift-right 1000.'}
  capacity-down: {name: '&cDecrease storage capacity'}
  capacity-up: {name: '&aIncrease storage capacity'}
  storage-exact: {name: '&eEnter storage capacity'}
  storage: {lore: '&7Capacity: {capacity} J; currently stored: {stored} J.'}
  grid-empty:
    name: '&fEmpty entire grid'
    lore: '&7Sets every energy store in the connected grid to 0 J.'
  grid-fill:
    name: '&6Fill entire grid'
    lore: '&7Fills every energy store in the connected grid to capacity.'

example-cargo:
  title: '&6DEBUG Transport Dispatcher'
  state:
    name: '&eNetwork state: {state}'
    lore: '&7Current speed multiplier: x{speed}.'
  enable:
    name: '&aEnable cargo network'
    lore: '&7Allows the connected network to transfer items.'
  disable:
    name: '&cDisable cargo network'
    lore: '&7Pauses all transfers in the connected network.'
  speed-down:
    name: '&cDecrease dispatch speed'
  speed-up:
    name: '&aIncrease dispatch speed'
  speed:
    name: '&eDispatch speed: x{speed}'
    lore: '&7Click adjusts 1; Shift-click adjusts 10; maximum x{max_speed}.'
  visualizer:
    name: '&dToggle cargo particles'
    lore: '&7Toggles network particles for the current player.'
