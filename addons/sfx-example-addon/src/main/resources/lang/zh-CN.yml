      lore:
      - '&7可调式电网测试节点。'
      - '&7支持停止、发电和用电模式。'
      - '&c仅限管理员调试使用。'
    debug_transport_dispatcher:
      name: '&6DEBUG 运输调度'
      lore:
      - '&7区域型运输调度和拓扑缓存测试节点。'
