      - '&c仅限管理员调试使用。'
    debug_fish:
      name: '&bDEBUG 弹力鱼球'
      lore:
      - '&7向经典 Slimefun4 DEBUG 鱼致敬。'
      - '&7继承发射者速度，命中实体时造成伤害。'
      - '&7撞击方块时反弹，低速落地后无阻尼滑行。'
      - '&c仅限管理员调试使用。'
