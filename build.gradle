tasks.register('buildJustEnoughGuideClassic') {
    group = 'just-enough-guide'
    description = 'Builds the pinned JustEnoughGuide en-master source with Maven and Java 21.'
    doLast {
        def sourceDir = layout.projectDirectory.dir(rootProject.ext.justEnoughGuideSourceDirName).asFile
        if (!new File(sourceDir, 'pom.xml').isFile()) {
            throw new GradleException('Missing JustEnoughGuide source tree. Run generateJustEnoughGuideClassicSource first.')
        }

        def mavenHome = System.getenv('MAVEN_HOME')
        def mavenCandidates = []
        if (mavenHome != null && !mavenHome.isBlank()) {
            mavenCandidates << file("${mavenHome}/bin/mvn.cmd")
        }
        mavenCandidates.addAll([
                file('D:/MyApp/IDEA/IntelliJ IDEA 2025.3.3/plugins/maven/lib/maven3/bin/mvn.cmd'),
                file('C:/Program Files/JetBrains/IntelliJ IDEA 2025.3/plugins/maven/lib/maven3/bin/mvn.cmd')
        ])
        def mavenCommand = mavenCandidates.find { it.isFile() }
        if (mavenCommand == null) {
            throw new GradleException('Maven was not found. Set MAVEN_HOME or install IntelliJ IDEA with bundled Maven.')
        }

        def java21Home = [
                file('C:/Program Files/Java/jdk-21'),
                file('D:/MyApp/java/jdk-21')
        ].find { new File(it, 'bin/java.exe').isFile() }
        if (java21Home == null) {
            throw new GradleException('Java 21 is required because JEG en-master targets Java 16, which Java 25 no longer compiles.')
        }

        exec {
            workingDir sourceDir
            environment 'JAVA_HOME', java21Home.absolutePath
            environment 'PATH', "${new File(java21Home, 'bin').absolutePath}${File.pathSeparator}${System.getenv('PATH')}"
            commandLine mavenCommand.absolutePath, 'clean', 'package', '-DskipTests', '-B'
        }

        def builtJar = new File(sourceDir, "target/${rootProject.ext.justEnoughGuideBuiltJarName}")
        if (!builtJar.isFile()) {
            throw new GradleException("Missing JustEnoughGuide shaded jar: ${builtJar}")
        }
        def pluginDescriptor = zipTree(builtJar).matching { include 'plugin.yml' }.singleFile.getText(StandardCharsets.UTF_8.name())
        if (!pluginDescriptor.contains('name: JustEnoughGuide')
                || !pluginDescriptor.contains('version: EN-22')
                || !pluginDescriptor.contains('  - Slimefun')) {
            throw new GradleException("Unexpected plugin.yml in ${builtJar}")
        }
        if (zipTree(builtJar).matching {
            include 'net/guizhanss/guizhanlib/minecraft/helper/inventory/ItemStackHelper.class'
        }.files.size() != 1) {
            throw new GradleException("Missing bundled GuizhanLib ItemStackHelper in ${builtJar}")
        }
        logger.lifecycle("Built and verified ${builtJar}")
    }
}

tasks.register('deployJustEnoughGuideClassic') {
    group = 'just-enough-guide'
    description = 'Builds JustEnoughGuide en-master and deploys it to the classic Slimefun Paper 1.21.8 runtime.'
    dependsOn 'buildJustEnoughGuideClassic', 'prepareLegacySlimefunRuntime'
    doLast {
        def sourceDir = layout.projectDirectory.dir(rootProject.ext.justEnoughGuideSourceDirName).asFile
        def builtJar = new File(sourceDir, "target/${rootProject.ext.justEnoughGuideBuiltJarName}")
        def pluginsDir = layout.projectDirectory.dir("${rootProject.ext.legacyRuntimeDirName}/plugins").asFile
        def slimefunJar = pluginsDir.listFiles()?.find {
            it.isFile() && it.name.toLowerCase(Locale.ROOT).startsWith('slimefun') && it.name.endsWith('.jar')
        }
        if (slimefunJar == null) {
            throw new GradleException("Classic Slimefun is not installed under ${pluginsDir}. Run deployLegacySlimefunRuntime first.")
        }

        pluginsDir.listFiles()?.findAll {
            it.isFile() && it.name.toLowerCase(Locale.ROOT).startsWith('justenoughguide')
        }?.each { oldJar ->
            if (oldJar.name != rootProject.ext.justEnoughGuideRuntimeJarName) {
                oldJar.delete()
            }
        }
        copy {
            from builtJar
            into pluginsDir
            rename { rootProject.ext.justEnoughGuideRuntimeJarName }
        }
        logger.lifecycle("Deployed ${builtJar.name} as ${new File(pluginsDir, rootProject.ext.justEnoughGuideRuntimeJarName)}")
    }
}

