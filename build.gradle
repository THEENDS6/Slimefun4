                'Component itemName(String itemId, Component',
                'Component researchName(String researchId, Component',
                'List<Component> itemLore(String itemId, List<Component>',
                'List<Component> recipeNote(String itemId, int index, Component'
        ].each { forbiddenSignature ->
            if (localizationApi.contains(forbiddenSignature)) {
                violations << "SfxLocalization exposes fallback overload: ${forbiddenSignature}"
            }
        }
        def flattenLanguageKeys = { File file ->
            def keys = [] as Set
            def stack = []
            file.readLines('UTF-8').each { line ->
                if (line.trim().isEmpty() || line.trim().startsWith('#') || line.trim().startsWith('-')) {
                    return
                }
                def matcher = line =~ /^(\s*)(['"]?)([^:'"]+)\2:\s*(.*)$/
                if (!matcher.matches()) {
                    return
                }
                int indent = matcher[0][1].length()
                String key = matcher[0][3].trim()
                while (!stack.isEmpty() && stack[-1].indent >= indent) {
                    stack.remove(stack.size() - 1)
                }
                def path = (stack.collect { it.key } + key).join('.')
                keys << path
                stack << [indent: indent, key: key]
            }
            keys
        }
        def languageFiles = fileTree(layout.projectDirectory.dir('main/resources/lang')) {
            include '**/*.yml'
        }.files.sort { it.name }
        def languageKeysByFile = languageFiles.collectEntries { file ->
            [(file.name): flattenLanguageKeys(file)]
        }
        if (languageKeysByFile.isEmpty()) {
            violations << "no bundled language files found under main/resources/lang"
        }
        def literalFallback = ~/(?s)localization\.(?:text|component)\(\s*"[^"]+"\s*,\s*"[^"]+"/
        def itemFallback = ~/(?s)localization\.(?:itemName|itemLore)\(\s*"[^"]+"\s*,/
        def literalLanguageCall = ~/localization\.(?:text|component|requiredList|list)\(\s*"([^"]+)"/
        def literalHelperLanguageCall = /(?:^|[^\w.])(?:send|sendMessage|sendActionbar)\(\s*[^,\r\n]+,\s*"([^"]+)"/
        def literalTrLanguageCall = /(?:^|[^\w.])tr\(\s*"([^"]+)"/
        def literalDisplayTextCall = /new\s+DisplayText\(\s*"([^"]+)"/
        def literalCargoLanguageString = /"((?:cargo\.(?:status|message|ui)\.[^"]+))"/
        def literalGpsLanguageString = /"((?:gps\.(?:ui|messages|resources)\.[^"]+))"/
        def literalAndroidLanguageString = /"((?:android\.(?:messages|menu|instructions)\.[^"]+))"/
        def literalCommandLanguageString = /"((?:command\.[^"]+))"/
        coreLocalizationFiles.each { path ->
            def file = layout.projectDirectory.file(path).asFile
            def text = file.getText('UTF-8')
            [literalFallback, itemFallback].each { pattern ->
                def matcher = pattern.matcher(text)
                while (matcher.find()) {
                    def line = text.substring(0, matcher.start()).count('\n') + 1
                    violations << "${path}:${line}: uses localization fallback argument"
                }
            }
            def keyMatcher = literalLanguageCall.matcher(text)
            while (keyMatcher.find()) {
                def key = keyMatcher.group(1)
                if (key.contains("{") || key.contains("+") || key.endsWith(".")) {
                    continue
                }
                languageKeysByFile.each { languageFile, keys ->
                    if (!keys.contains(key)) {
                        def line = text.substring(0, keyMatcher.start()).count('\n') + 1
                        violations << "${path}:${line}: ${languageFile} missing language key ${key}"
                    }
                }
            }
            def helperKeyMatcher = (text =~ literalHelperLanguageCall)
            while (helperKeyMatcher.find()) {
                def key = helperKeyMatcher.group(1)
                if (key.contains("{") || key.contains("+") || key.endsWith(".")) {
                    continue
                }
                languageKeysByFile.each { languageFile, keys ->
                    if (!keys.contains(key)) {
                        def line = text.substring(0, helperKeyMatcher.start()).count('\n') + 1
                        violations << "${path}:${line}: ${languageFile} missing language key ${key}"
                    }
                }
            }
            def trKeyMatcher = (text =~ literalTrLanguageCall)
            while (trKeyMatcher.find()) {
                def key = trKeyMatcher.group(1)
                if (key.contains("{") || key.contains("+") || key.endsWith(".")) {
                    continue
                }
                languageKeysByFile.each { languageFile, keys ->
                    if (!keys.contains(key)) {
                        def line = text.substring(0, trKeyMatcher.start()).count('\n') + 1
                        violations << "${path}:${line}: ${languageFile} missing language key ${key}"
                    }
                }
            }
            def displayTextMatcher = (text =~ literalDisplayTextCall)
            while (displayTextMatcher.find()) {
                def key = displayTextMatcher.group(1)
                if (key.contains("{") || key.contains("+") || key.endsWith(".")) {
                    continue
                }
                languageKeysByFile.each { languageFile, keys ->
                    if (!keys.contains(key)) {
                        def line = text.substring(0, displayTextMatcher.start()).count('\n') + 1
                        violations << "${path}:${line}: ${languageFile} missing language key ${key}"
                    }
                }
            }
            def cargoKeyMatcher = (text =~ literalCargoLanguageString)
            while (cargoKeyMatcher.find()) {
                def key = cargoKeyMatcher.group(1)
                if (key.contains("{") || key.contains("+") || key.endsWith(".")) {
                    continue
                }
                languageKeysByFile.each { languageFile, keys ->
                    if (!keys.contains(key)) {
                        def line = text.substring(0, cargoKeyMatcher.start()).count('\n') + 1
                        violations << "${path}:${line}: ${languageFile} missing language key ${key}"
                    }
                }
            }
            def gpsKeyMatcher = (text =~ literalGpsLanguageString)
            while (gpsKeyMatcher.find()) {
                def key = gpsKeyMatcher.group(1)
                if (key.contains("{") || key.contains("+") || key.endsWith(".")) {
                    continue
                }
                languageKeysByFile.each { languageFile, keys ->
                    if (!keys.contains(key)) {
                        def line = text.substring(0, gpsKeyMatcher.start()).count('\n') + 1
                        violations << "${path}:${line}: ${languageFile} missing language key ${key}"
                    }
                }
            }
            def androidKeyMatcher = (text =~ literalAndroidLanguageString)
            while (androidKeyMatcher.find()) {
                def key = androidKeyMatcher.group(1)
                if (key.contains("{") || key.contains("+") || key.endsWith(".")) {
