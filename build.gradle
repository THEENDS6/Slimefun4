import java.nio.charset.StandardCharsets

plugins {
    id 'java'
}

group = 'cc.theends6'
version = 'SFX-20260524c1'

description = 'SlimeFunX restored single-module workspace.'

ext {
    paperApiVersion = '1.21.8-R0.1-SNAPSHOT'
    pluginJarName = 'SlimeFunX.jar'
    paperRuntimeJarName = 'paper-1.21.8-60.jar'
    paperRuntimeRconHost = '127.0.0.1'
    paperRuntimeRconPort = 25575
    paperRuntimeRconPassword = 'sfx-dev'
    paper261RuntimeDirName = 'run-paper-26.1'
    paper261RuntimeJarName = 'paper-26.1.jar'
    foliaRuntimeJarName = 'folia-1.21.8-6.jar'
    legacyRuntimeDirName = 'run-legacy-slimefun-1.21.8'
    legacySlimefunDownloadUrl = 'https://github.com/rutwok-labs/SlimefunCore-V.4.0/releases/download/2647/SlimefunCore4-2647.jar'
    legacySlimefunJarName = 'SlimefunCore4-2647.jar'
    serverEncodingJvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dstdout.encoding=UTF-8',
            '-Dstderr.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8'
    ]
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'codemc-releases'
        url = 'https://repo.codemc.io/repository/maven-releases/'
    }
    maven {
        name = 'codemc-snapshots'
        url = 'https://repo.codemc.io/repository/maven-snapshots/'
    }
}

configurations {
    shade
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDirs = ['main/java']
        resources.srcDirs = ['main/resources']
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${rootProject.ext.paperApiVersion}"
    compileOnly "com.github.retrooper:packetevents-spigot:2.12.1"
    compileOnly "org.xerial:sqlite-jdbc:3.50.3.0"
    shade "org.xerial:sqlite-jdbc:3.50.3.0"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

tasks.named('jar') {
    archiveBaseName.set('SlimeFunX')
    archiveVersion.set('')
    from {
        configurations.shade.collect { zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.register('prepareRuntimeDirs') {
    group = 'application'
    description = 'Creates runtime plugin directories for Paper, Folia, and legacy Slimefun.'
    doLast {
        file('run-paper-1.21.8/plugins').mkdirs()
        file("${rootProject.ext.paper261RuntimeDirName}/plugins").mkdirs()
        file('run-folia-1.21.8/plugins').mkdirs()
        file("${rootProject.ext.legacyRuntimeDirName}/plugins").mkdirs()
    }
}

tasks.register('deployToPaperRuntime', Copy) {
    group = 'deployment'
    description = 'Builds the plugin and copies it to run-paper-1.21.8/plugins.'
    dependsOn 'prepareRuntimeDirs', 'jar'
    from(tasks.named('jar').flatMap { it.archiveFile })
    into(layout.projectDirectory.dir('run-paper-1.21.8/plugins'))
    rename { rootProject.ext.pluginJarName }
}

def configurePaperTestServerProperties = {
    def propertiesFile = layout.projectDirectory.file('run-paper-1.21.8/server.properties').asFile
    propertiesFile.parentFile.mkdirs()
    def properties = new Properties()
    if (propertiesFile.exists()) {
        propertiesFile.withInputStream { input -> properties.load(input) }
    }
    properties.setProperty('pause-when-empty-seconds', '-1')
    properties.setProperty('player-idle-timeout', '0')
    properties.setProperty('enable-rcon', 'true')
    properties.setProperty('rcon.port', rootProject.ext.paperRuntimeRconPort.toString())
    properties.setProperty('rcon.password', rootProject.ext.paperRuntimeRconPassword)
    properties.setProperty('enable-command-block', 'true')
    properties.setProperty('online-mode', 'false')
    properties.setProperty('motd', 'SlimeFunX Paper 1.21.8')
    propertiesFile.withOutputStream { output ->
        properties.store(output, 'SlimeFunX Paper 1.21.8 test runtime')
    }
}

tasks.register('ensurePaperRuntimeTestConfig') {
    group = 'verification'
    description = 'Keeps the Paper 1.21.8 test server alive when empty and enables local RCON for SFX reload commands.'
    dependsOn 'prepareRuntimeDirs'
    doLast {
        configurePaperTestServerProperties()
        logger.lifecycle("Paper 1.21.8 test config ready: pause-when-empty-seconds=-1, player-idle-timeout=0, RCON ${rootProject.ext.paperRuntimeRconHost}:${rootProject.ext.paperRuntimeRconPort}")
    }
}

tasks.register('stagePaperRuntimeUpdate', Copy) {
    group = 'deployment'
    description = 'Builds SlimeFunX and stages the jar in run-paper-1.21.8/plugins/update for the next restart or external plugin loader.'
    dependsOn 'ensurePaperRuntimeTestConfig', 'jar'
    from(tasks.named('jar').flatMap { it.archiveFile })
    into(layout.projectDirectory.dir('run-paper-1.21.8/plugins/update'))
    rename { rootProject.ext.pluginJarName }
}

def readLittleEndianInt = { InputStream input ->
    int b0 = input.read()
    int b1 = input.read()
    int b2 = input.read()
    int b3 = input.read()
    if ((b0 | b1 | b2 | b3) < 0) {
        throw new EOFException('RCON connection closed while reading packet length')
    }
    (b0 & 0xff) | ((b1 & 0xff) << 8) | ((b2 & 0xff) << 16) | ((b3 & 0xff) << 24)
}

def writeLittleEndianInt = { OutputStream output, int value ->
    output.write(value & 0xff)
    output.write((value >>> 8) & 0xff)
    output.write((value >>> 16) & 0xff)
    output.write((value >>> 24) & 0xff)
}

def sendRconPacket = { OutputStream output, int requestId, int type, String payload ->
    def body = new ByteArrayOutputStream()
    writeLittleEndianInt(body, requestId)
    writeLittleEndianInt(body, type)
    body.write(payload.getBytes(StandardCharsets.UTF_8))
    body.write(0)
    body.write(0)
    writeLittleEndianInt(output, body.size())
    body.writeTo(output)
    output.flush()
}

def readRconPacket = { InputStream input ->
    int length = readLittleEndianInt(input)
    byte[] data = input.readNBytes(length)
    if (data.length != length) {
        throw new EOFException('RCON connection closed while reading packet body')
    }
    def buffer = java.nio.ByteBuffer.wrap(data).order(java.nio.ByteOrder.LITTLE_ENDIAN)
    int requestId = buffer.getInt()
    int type = buffer.getInt()
    int payloadLength = Math.max(0, length - 10)
    byte[] payload = new byte[payloadLength]
    buffer.get(payload)
    [id: requestId, type: type, payload: new String(payload, StandardCharsets.UTF_8)]
}

def sendPaperRconCommand = { String commandText ->
    def socket = new Socket()
    socket.connect(new InetSocketAddress(rootProject.ext.paperRuntimeRconHost, rootProject.ext.paperRuntimeRconPort as int), 1500)
    socket.soTimeout = 3000
    socket.withCloseable {
        def input = it.getInputStream()
        def output = it.getOutputStream()
        sendRconPacket(output, 1001, 3, rootProject.ext.paperRuntimeRconPassword)
        def auth = readRconPacket(input)
        if (auth.id == -1) {
            throw new GradleException('Paper RCON authentication failed. Check rcon.password in run-paper-1.21.8/server.properties.')
        }
        sendRconPacket(output, 1002, 2, commandText)
        def response = readRconPacket(input)
        if (response.payload != null && !response.payload.isBlank()) {
            logger.lifecycle(response.payload.trim())
        }
    }
}

tasks.register('reloadPaperRuntime') {
    group = 'application'
    description = 'Sends /sfx reload runtime to the running Paper 1.21.8 test server over local RCON.'
    dependsOn 'ensurePaperRuntimeTestConfig'
    doLast {
        try {
            sendPaperRconCommand('sfx reload runtime')
            logger.lifecycle('Requested SFX runtime reload on Paper 1.21.8.')
        } catch (ConnectException exception) {
            throw new GradleException('Paper 1.21.8 test server is not running or RCON is not enabled yet. Start it with runPaper after ensurePaperRuntimeTestConfig.', exception)
        }
    }
}

tasks.register('stageAndReloadPaperRuntime') {
    group = 'application'
    description = 'Stages the jar for the next restart and reloads the current SFX runtime/config over RCON. Bytecode changes still require restart or an external plugin loader.'
    dependsOn 'stagePaperRuntimeUpdate', 'reloadPaperRuntime'
}

tasks.named('reloadPaperRuntime') {
    mustRunAfter 'stagePaperRuntimeUpdate'
}

tasks.register('preparePaper261Runtime') {
    group = 'deployment'
    description = 'Prepares a dedicated Paper 26.1 runtime directory for SFX testing.'
    dependsOn 'prepareRuntimeDirs'
    doLast {
        def sourceDir = layout.projectDirectory.dir('run-paper-1.21.8').asFile
        def targetDir = layout.projectDirectory.dir(rootProject.ext.paper261RuntimeDirName).asFile

        targetDir.mkdirs()
        ['plugins', 'logs'].each { child ->
            new File(targetDir, child).mkdirs()
        }

        [
                'eula.txt',
                'server.properties',
                'ops.json',
                'bukkit.yml',
                'spigot.yml',
                'commands.yml',
                'help.yml',
                'permissions.yml'
        ].each { fileName ->
            def sourceFile = new File(sourceDir, fileName)
            def targetFile = new File(targetDir, fileName)
            if (sourceFile.exists() && !targetFile.exists()) {
                copy {
                    from sourceFile
                    into targetDir
                }
            }
        }

        def sourceConfigDir = new File(sourceDir, 'config')
        def targetConfigDir = new File(targetDir, 'config')
        if (sourceConfigDir.exists()) {
            sourceConfigDir.mkdirs()
            copy {
                from sourceConfigDir
                into targetConfigDir
                include 'paper-global.yml', 'paper-world-defaults.yml'
            }
        }

        def sourcePacketEvents = new File(sourceDir, 'plugins/packetevents-spigot-2.12.1.jar')
        if (sourcePacketEvents.exists()) {
            copy {
                from sourcePacketEvents
                into new File(targetDir, 'plugins')
            }
        }

        def sourceReadme = new File(sourceDir, 'README.md')
        def targetReadme = new File(targetDir, 'README.md')
        if (!targetReadme.exists()) {
            targetReadme.text = """Place a Paper 26.1 server jar here as ${rootProject.ext.paper261RuntimeJarName}.
Paper 26.1+ requires Java 25 according to PaperMC documentation.

${sourceReadme.exists() ? sourceReadme.text : ''}
""".stripIndent()
        }

        new File(targetDir, 'start-paper.ps1').text = """\$ErrorActionPreference = 'Stop'
Set-Location \$PSScriptRoot
chcp 65001 > \$null
[Console]::InputEncoding = [System.Text.UTF8Encoding]::new()
[Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()

\$javaCmd = 'java'
\$preferredJava = 'D:\\MyApp\\java\\jdk-25\\bin\\java.exe'
if (-not (Test-Path \$preferredJava)) {
    \$preferredJava = 'C:\\Program Files\\Java\\jdk-25\\bin\\java.exe'
}
if (-not (Test-Path \$preferredJava)) {
    \$preferredJava = 'C:\\Program Files\\Java\\jdk-25.0.1\\bin\\java.exe'
}
if (-not (Test-Path \$preferredJava)) {
    \$preferredJava = 'C:\\Program Files\\Java\\jdk-25.0.2\\bin\\java.exe'
}
if (Test-Path \$preferredJava) {
    \$javaCmd = \$preferredJava
}

& \$javaCmd -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8 -Xms1G -Xmx2G -jar .\\${rootProject.ext.paper261RuntimeJarName} nogui
""".stripIndent()
    }
}

tasks.register('deployToPaper261Runtime', Copy) {
    group = 'deployment'
    description = 'Builds the plugin and copies it to run-paper-26.1/plugins.'
    dependsOn 'preparePaper261Runtime', 'jar'
    from(tasks.named('jar').flatMap { it.archiveFile })
    into(layout.projectDirectory.dir(rootProject.ext.paper261RuntimeDirName + '/plugins'))
    rename { rootProject.ext.pluginJarName }
}

tasks.register('deployToFoliaRuntime', Copy) {
    group = 'deployment'
    description = 'Builds the plugin and copies it to run-folia-1.21.8/plugins.'
    dependsOn 'prepareRuntimeDirs', 'jar'
    from(tasks.named('jar').flatMap { it.archiveFile })
    into(layout.projectDirectory.dir('run-folia-1.21.8/plugins'))
    rename { rootProject.ext.pluginJarName }
}

tasks.register('fetchLegacySlimefun') {
    group = 'deployment'
    description = 'Downloads the classic Slimefun4-compatible 1.21.x jar used by the legacy runtime.'
    def outputFile = layout.buildDirectory.file("legacy-runtime/${rootProject.ext.legacySlimefunJarName}")
    outputs.file(outputFile)
    doLast {
        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        if (target.exists() && target.length() > 0L) {
            logger.lifecycle("Using cached legacy Slimefun jar: ${target}")
            return
        }

        logger.lifecycle("Downloading legacy Slimefun from ${rootProject.ext.legacySlimefunDownloadUrl}")
        new URL(rootProject.ext.legacySlimefunDownloadUrl).withInputStream { input ->
            target.withOutputStream { output -> output << input }
        }
    }
}

tasks.register('prepareLegacySlimefunRuntime') {
    group = 'deployment'
    description = 'Prepares a dedicated Paper 1.21.8 runtime directory for classic Slimefun.'
    dependsOn 'prepareRuntimeDirs'
    doLast {
        def sourceDir = layout.projectDirectory.dir('run-paper-1.21.8').asFile
        def targetDir = layout.projectDirectory.dir(rootProject.ext.legacyRuntimeDirName).asFile
        def sourcePaperJar = new File(sourceDir, rootProject.ext.paperRuntimeJarName)
        if (!sourcePaperJar.exists()) {
            throw new GradleException("Missing Paper runtime jar: ${sourcePaperJar}. Prepare run-paper-1.21.8 first.")
        }

        copy {
            from sourcePaperJar
            into targetDir
        }

        [
                'eula.txt',
                'server.properties',
                'ops.json',
                'bukkit.yml',
                'spigot.yml',
                'commands.yml',
                'help.yml',
                'permissions.yml'
        ].each { fileName ->
            def sourceFile = new File(sourceDir, fileName)
            def targetFile = new File(targetDir, fileName)
            if (sourceFile.exists() && !targetFile.exists()) {
                copy {
                    from sourceFile
                    into targetDir
                }
            }
        }

        new File(targetDir, 'plugins').mkdirs()
        new File(targetDir, 'logs').mkdirs()
    }
}

tasks.register('deployLegacySlimefunRuntime', Copy) {
    group = 'deployment'
    description = 'Downloads a classic Slimefun4-compatible 1.21.x jar, deploys it to the legacy Paper runtime, and removes SlimeFunX from that runtime.'
    dependsOn 'fetchLegacySlimefun', 'prepareLegacySlimefunRuntime'
    from(layout.buildDirectory.file("legacy-runtime/${rootProject.ext.legacySlimefunJarName}"))
    into(layout.projectDirectory.dir("${rootProject.ext.legacyRuntimeDirName}/plugins"))
    rename { rootProject.ext.legacySlimefunJarName }
    doLast {
        def pluginsDir = layout.projectDirectory.dir("${rootProject.ext.legacyRuntimeDirName}/plugins").asFile
        pluginsDir.listFiles()?.findAll { it.isFile() && it.name.toLowerCase(Locale.ROOT).startsWith('slimefun') && it.name != rootProject.ext.legacySlimefunJarName }?.each { jarFile ->
            jarFile.delete()
        }

        def sfxJar = new File(pluginsDir, rootProject.ext.pluginJarName)
        if (sfxJar.exists()) {
            sfxJar.delete()
        }

        def sfxDataDir = new File(pluginsDir, 'SlimeFunX')
        if (sfxDataDir.exists()) {
            delete(sfxDataDir)
        }
    }
}

def preferredJavaExecutable = {
    def java21 = file('C:/Program Files/Java/jdk-21/bin/java.exe')
    java21.exists() ? java21.absolutePath : 'java'
}

def preferredJava25Executable = {
    def java25Candidates = [
            file('D:/MyApp/java/jdk-25/bin/java.exe'),
            file('C:/Program Files/Java/jdk-25/bin/java.exe'),
            file('C:/Program Files/Java/jdk-25.0.1/bin/java.exe'),
            file('C:/Program Files/Java/jdk-25.0.2/bin/java.exe')
    ]
    def java25 = java25Candidates.find { it.exists() }
    java25 != null ? java25.absolutePath : 'java'
}

tasks.register('runPaper', Exec) {
    group = 'application'
    description = 'Builds the plugin, deploys it to the Paper runtime, and starts Paper 1.21.8.'
    dependsOn 'ensurePaperRuntimeTestConfig', 'deployToPaperRuntime'
    workingDir layout.projectDirectory.dir('run-paper-1.21.8').asFile
    executable preferredJavaExecutable()
    standardInput = System.in
    args rootProject.ext.serverEncodingJvmArgs + ['-Xms1G', '-Xmx2G', '-jar', rootProject.ext.paperRuntimeJarName, 'nogui']
}

tasks.register('runPaper261', Exec) {
    group = 'application'
    description = 'Builds the plugin, deploys it to the Paper 26.1 runtime, and starts Paper 26.1 using Java 25 when available.'
    dependsOn 'deployToPaper261Runtime'
    workingDir layout.projectDirectory.dir(rootProject.ext.paper261RuntimeDirName).asFile
    executable preferredJava25Executable()
    standardInput = System.in
    args rootProject.ext.serverEncodingJvmArgs + ['-Xms1G', '-Xmx2G', '-jar', rootProject.ext.paper261RuntimeJarName, 'nogui']
}

tasks.register('runFolia', Exec) {
    group = 'application'
    description = 'Builds the plugin, deploys it to the Folia runtime, and starts Folia 1.21.8.'
    dependsOn 'deployToFoliaRuntime'
    workingDir layout.projectDirectory.dir('run-folia-1.21.8').asFile
    executable preferredJavaExecutable()
    standardInput = System.in
    args rootProject.ext.serverEncodingJvmArgs + ['-Xms1G', '-Xmx2G', '-jar', rootProject.ext.foliaRuntimeJarName, 'nogui']
}

tasks.register('runLegacySlimefun', Exec) {
    group = 'application'
    description = 'Deploys a classic Slimefun4-compatible plugin to a dedicated Paper 1.21.8 runtime and starts it.'
    dependsOn 'deployLegacySlimefunRuntime'
    workingDir layout.projectDirectory.dir(rootProject.ext.legacyRuntimeDirName).asFile
    executable preferredJavaExecutable()
    standardInput = System.in
    args rootProject.ext.serverEncodingJvmArgs + ['-Xms1G', '-Xmx2G', '-jar', rootProject.ext.paperRuntimeJarName, 'nogui']
}
