def readLittleEndianInt = { InputStream input ->
    byte[] data = new byte[4]
    new DataInputStream(input).readFully(data)
    java.nio.ByteBuffer.wrap(data).order(java.nio.ByteOrder.LITTLE_ENDIAN).getInt()
}

def writeLittleEndianInt = { OutputStream output, int value ->
    output.write(value & 0xff)
    output.write((value >>> 8) & 0xff)
    output.write((value >>> 16) & 0xff)
    output.write((value >>> 24) & 0xff)
}

def sendRconPacket = { OutputStream output, int requestId, int type, String payload ->
    def body = new ByteArrayOutputStream()
    writeLittleEndianInt(body, requestId)
    writeLittleEndianInt(body, type)
    body.write(payload.getBytes(StandardCharsets.UTF_8))
    body.write(0)
    body.write(0)
    writeLittleEndianInt(output, body.size())
    body.writeTo(output)
    output.flush()
}

def readRconPacket = { InputStream input ->
    int length = readLittleEndianInt(input)
    byte[] data = new byte[length]
    new DataInputStream(input).readFully(data)
    def buffer = java.nio.ByteBuffer.wrap(data).order(java.nio.ByteOrder.LITTLE_ENDIAN)
    int requestId = buffer.getInt()
    int type = buffer.getInt()
    int payloadLength = Math.max(0, length - 10)
    byte[] payload = new byte[payloadLength]
    buffer.get(payload)
    [id: requestId, type: type, payload: new String(payload, StandardCharsets.UTF_8)]
}

def sendPaperRconCommand = { String commandText ->
    def output = new ByteArrayOutputStream()
    def script = layout.projectDirectory.file('tools/paper-rcon.ps1').asFile
    def result = exec {
        executable = 'powershell.exe'
        args = [
                '-NoProfile',
                '-ExecutionPolicy', 'Bypass',
                '-File', script.absolutePath,
                '-HostName', rootProject.ext.paperRuntimeRconHost,
                '-Port', rootProject.ext.paperRuntimeRconPort.toString(),
                '-Password', rootProject.ext.paperRuntimeRconPassword,
                '-CommandText', commandText,
                '-TimeoutMs', '5000'
        ]
        standardOutput = output
        errorOutput = output
        ignoreExitValue = true
    }
    def responseText = output.toString(StandardCharsets.UTF_8.name()).trim()
    if (responseText != null && !responseText.isBlank()) {
        logger.lifecycle(responseText)
    }
    if (result.exitValue != 0) {
        throw new IOException(responseText.isBlank() ? "RCON command failed: ${commandText}" : responseText)
    }
    responseText
}

def sendPaperRconCommandWithRetry = { String commandText, int attempts = 3, long delayMs = 1000L ->
    IOException lastIo = null
    for (int attempt = 1; attempt <= attempts; attempt++) {
        try {
            return sendPaperRconCommand(commandText)
        } catch (IOException exception) {
            lastIo = exception
            if (attempt < attempts) {
                Thread.sleep(delayMs)
            }
        }
    }
    throw lastIo
}

def readNewLogText = { logFile, offset ->
    if (!logFile.exists() || logFile.length() <= offset) {
        return ''
    }
    def stream = new RandomAccessFile(logFile, 'r')
    stream.withCloseable {
        it.seek(offset as long)
        byte[] data = new byte[(int) Math.min(Integer.MAX_VALUE, it.length() - offset)]
        it.readFully(data)
        return new String(data, StandardCharsets.UTF_8)
    }
}

def waitForLogMatch = { logFile, offset, needles, timeoutMs ->
    long deadline = System.currentTimeMillis() + timeoutMs
    while (System.currentTimeMillis() <= deadline) {
        def text = readNewLogText(logFile, offset)
        if (needles.any { text.contains(it) }) {
            return true
        }
        Thread.sleep(250L)
    }
    false
}

def waitForSfxEnable = { logFile, offset, timeoutMs ->
    long deadline = System.currentTimeMillis() + timeoutMs
    while (System.currentTimeMillis() <= deadline) {
        def text = readNewLogText(logFile, offset)
        if (text.contains('[SlimeFunX] SlimeFunX failed to start:')
                || text.contains('Cannot execute command') && text.contains('plugin is disabled')) {
            return false
        }
        if (text.contains('[SlimeFunX] SFX enabled.')) {
            return true
        }
        Thread.sleep(250L)
    }
    false
}

tasks.register('paperRcon') {
    group = 'application'
    description = 'Sends an arbitrary command to the running Paper 1.21.8 test server over local RCON. Use -Pcmd="command".'
    dependsOn 'ensurePaperRuntimeTestConfig'
    doLast {
        def commandText = project.findProperty('cmd')?.toString()
        if (commandText == null || commandText.isBlank()) {
            throw new GradleException('Missing command. Use: .\\gradlew.bat paperRcon -Pcmd="say test"')
        }
        try {
            sendPaperRconCommandWithRetry(commandText)
        } catch (IOException exception) {
            throw new GradleException('Paper 1.21.8 test server is not running or RCON is not enabled yet. Start it with runPaper after ensurePaperRuntimeTestConfig.', exception)
        }
    }
}

