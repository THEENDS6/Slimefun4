tasks.named('jar') {
    dependsOn 'validateSfxTemplateCompile', 'basicExpansionJar', 'contentExpansionJar'
    archiveBaseName.set('SlimeFunX')
    archiveVersion.set('')
    from {
        configurations.shade.collect { zipTree(it) }
    }
    from(layout.buildDirectory.dir('sfx-template-compiled')) {
        into 'content/compiled'
    }
    from(tasks.named('basicExpansionJar').flatMap { it.archiveFile }) {
        into 'bundled-addons'
    }
    from(tasks.named('contentExpansionJar').flatMap { it.archiveFile }) {
        into 'bundled-addons'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.register('contentExpansionJar', Jar) {
    group = 'build'
    description = 'Packages the SFX Content Expansion addon as a standalone addon jar.'
    dependsOn 'contentExpansionClasses'
    archiveFileName.set('sfx-content-expansion.jar')
    destinationDirectory.set(layout.buildDirectory.dir('addons'))
