tasks.register('plugmanReloadPaperRuntime') {
    group = 'application'
    description = 'Builds SlimeFunX, unloads it with PlugManX, replaces the Paper 1.21.8 plugin jar, then loads it again.'
    dependsOn 'ensurePaperRuntimeTestConfig', 'installPaperRuntimePlugManX', 'jar'
    doLast {
        try {
            sendPaperRconCommandWithRetry('list')
            def logFile = layout.projectDirectory.file('run-paper-1.21.8/logs/latest.log').asFile
            long unloadLogOffset = logFile.exists() ? logFile.length() : 0L
            def unloadResponse = sendPaperRconCommandWithRetry('plugman unload SlimeFunX')
            if (!String.valueOf(unloadResponse).contains('SlimeFunX has been unloaded')
                    && !String.valueOf(unloadResponse).contains('That is not a valid plugin')
                    && !waitForLogMatch(logFile, unloadLogOffset, ['[SlimeFunX] Disabling SlimeFunX'], 10000L)) {
                throw new GradleException('PlugManX unload command was sent, but SlimeFunX disable was not observed in latest.log.')
            }
            def builtJar = tasks.named('jar').get().archiveFile.get().asFile
            def targetJar = layout.projectDirectory.file("run-paper-1.21.8/plugins/${rootProject.ext.pluginJarName}").asFile
            java.nio.file.Files.copy(builtJar.toPath(), targetJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("Copied ${builtJar.name} to ${targetJar}")
            Thread.sleep(1500L)
            long loadLogOffset = logFile.exists() ? logFile.length() : 0L
            sendPaperRconCommandWithRetry('plugman load SlimeFunX', 5, 1500L)
            if (!waitForSfxEnable(logFile, loadLogOffset, 20000L)) {
                throw new GradleException('PlugManX load command was sent, but SlimeFunX enable was not observed in latest.log.')
            }
            logger.lifecycle('Requested PlugManX unload/load for SlimeFunX on Paper 1.21.8.')
        } catch (IOException exception) {
            throw new GradleException('Paper 1.21.8 test server is not running or RCON is not enabled. Start it with runPaper first.', exception)
        }
    }
}

