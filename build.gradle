tasks.register('deployLegacySlimefunRuntime', Copy) {
    group = 'deployment'
    description = 'Downloads a classic Slimefun4-compatible 1.21.x jar, deploys it to the legacy Paper runtime, and removes SlimeFunX from that runtime.'
    dependsOn 'fetchLegacySlimefun', 'prepareLegacySlimefunRuntime'
    from(layout.buildDirectory.file("legacy-runtime/${rootProject.ext.legacySlimefunJarName}"))
    into(layout.projectDirectory.dir("${rootProject.ext.legacyRuntimeDirName}/plugins"))
    rename { rootProject.ext.legacySlimefunJarName }
    doLast {
        def pluginsDir = layout.projectDirectory.dir("${rootProject.ext.legacyRuntimeDirName}/plugins").asFile
        pluginsDir.listFiles()?.findAll { it.isFile() && it.name.toLowerCase(Locale.ROOT).startsWith('slimefun') && it.name != rootProject.ext.legacySlimefunJarName }?.each { jarFile ->
            jarFile.delete()
        }

        def sfxJar = new File(pluginsDir, rootProject.ext.pluginJarName)
        if (sfxJar.exists()) {
            sfxJar.delete()
        }

        def sfxDataDir = new File(pluginsDir, 'SlimeFunX')
        if (sfxDataDir.exists()) {
            delete(sfxDataDir)
        }
    }
}

def preferredJavaExecutable = {
    def java21 = file('C:/Program Files/Java/jdk-21/bin/java.exe')
    java21.exists() ? java21.absolutePath : 'java'
}

def preferredJava25Executable = {
    def java25Candidates = [
            file('D:/MyApp/java/jdk-25/bin/java.exe'),
            file('C:/Program Files/Java/jdk-25/bin/java.exe'),
            file('C:/Program Files/Java/jdk-25.0.1/bin/java.exe'),
            file('C:/Program Files/Java/jdk-25.0.2/bin/java.exe')
    ]
    def java25 = java25Candidates.find { it.exists() }
    java25 != null ? java25.absolutePath : 'java'
}

tasks.register('runPaper') {
    group = 'application'
    description = 'Builds the plugin, deploys it to the Paper runtime, and starts Paper 1.21.8.'
    dependsOn 'ensurePaperRuntimeTestConfig', 'deployToPaperRuntime'
    doLast {
        def workingDirFile = layout.projectDirectory.dir('run-paper-1.21.8').asFile
        def command = [preferredJavaExecutable()]
        command.addAll(rootProject.ext.serverEncodingJvmArgs)
        command.addAll(['-Xms1G', '-Xmx2G', '-jar', rootProject.ext.paperRuntimeJarName, 'nogui'])

        logger.lifecycle('Starting Paper 1.21.8 with heartbeat output to avoid idle timeout false positives.')

        def process = new ProcessBuilder(command)
                .directory(workingDirFile)
                .redirectErrorStream(true)
                .start()

        def inputThread = Thread.startDaemon('runPaper-input-forwarder') {
            def processInput = process.outputStream
            try {
                byte[] buffer = new byte[1024]
                int read
                while (process.isAlive() && (read = System.in.read(buffer)) != -1) {
                    processInput.write(buffer, 0, read)
                    processInput.flush()
                }
            } catch (IOException ignored) {
                // Ignore stdin forwarding errors during shutdown.
            } finally {
                try {
                    processInput.close()
                } catch (IOException ignored) {
                    // Ignore close failure during shutdown.
                }
            }
        }

        def forwardThread = Thread.startDaemon('runPaper-output-forwarder') {
            process.inputStream.withReader(StandardCharsets.UTF_8.name()) { reader ->
                String line
                while ((line = reader.readLine()) != null) {
                    println line
                }
            }
        }

        try {
            while (process.isAlive()) {
                if (!process.waitFor(30, TimeUnit.SECONDS)) {
                    logger.lifecycle('[runPaper] still running...')
                }
            }
            inputThread.join(1000)
            forwardThread.join(1000)
        } finally {
            if (process.isAlive()) {
                process.destroy()
            }
        }

        def exitCode = process.exitValue()
        if (exitCode != 0) {
            throw new GradleException("Paper 1.21.8 exited with code ${exitCode}.")
        }
    }
}

