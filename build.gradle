tasks.register('fetchLegacySlimefun') {
    group = 'deployment'
    description = 'Downloads and verifies SlimefunGuguProject Build 254 for the Paper 1.21.8 test runtime.'
    def outputFile = layout.buildDirectory.file("legacy-runtime/${rootProject.ext.legacySlimefunJarName}")
    outputs.file(outputFile)
    doLast {
        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        if (!target.exists() || target.length() == 0L) {
            logger.lifecycle("Downloading SlimefunGuguProject Build 254 from ${rootProject.ext.legacySlimefunDownloadUrl}")
            new URL(rootProject.ext.legacySlimefunDownloadUrl).withInputStream { input ->
                target.withOutputStream { output -> output << input }
            }
        }

        def digest = java.security.MessageDigest.getInstance('SHA-256')
        target.withInputStream { input ->
            byte[] buffer = new byte[1024 * 1024]
            int count
            while ((count = input.read(buffer)) >= 0) {
                if (count > 0) {
                    digest.update(buffer, 0, count)
                }
            }
        }
        def actual = digest.digest().encodeHex().toString()
        if (actual != rootProject.ext.legacySlimefunSha256) {
            target.delete()
            throw new GradleException("Slimefun Build 254 SHA-256 mismatch: expected ${rootProject.ext.legacySlimefunSha256}, got ${actual}")
        }
        logger.lifecycle("Verified SlimefunGuguProject Build 254: ${target}")
    }
}

tasks.register('fetchGuguSlimefunCompanions') {
    group = 'deployment'
    description = 'Downloads and verifies JEG 2.1.27, its missing runtime libraries, and GuizhanLibPlugin Build 62.'
    def jegOutput = layout.buildDirectory.file("legacy-runtime/${rootProject.ext.guguJustEnoughGuideUpstreamJarName}")
    def heavenOutput = layout.buildDirectory.file("legacy-runtime/${rootProject.ext.guguHeavenJarName}")
    def nlpOutput = layout.buildDirectory.file("legacy-runtime/${rootProject.ext.guguNlpCommonJarName}")
    def libOutput = layout.buildDirectory.file("legacy-runtime/${rootProject.ext.guizhanLibPluginJarName}")
    outputs.files(jegOutput, heavenOutput, nlpOutput, libOutput)
    doLast {
        def downloadVerified = { String label, String url, String expectedSha256, File target ->
            target.parentFile.mkdirs()
            if (!target.exists() || target.length() == 0L) {
                logger.lifecycle("Downloading ${label} from ${url}")
                new URL(url).withInputStream { input ->
                    target.withOutputStream { output -> output << input }
                }
            }

            def digest = java.security.MessageDigest.getInstance('SHA-256')
            target.withInputStream { input ->
                byte[] buffer = new byte[1024 * 1024]
                int count
                while ((count = input.read(buffer)) >= 0) {
                    if (count > 0) {
                        digest.update(buffer, 0, count)
                    }
                }
            }
            def actual = digest.digest().encodeHex().toString()
            if (actual != expectedSha256) {
                target.delete()
                throw new GradleException("${label} SHA-256 mismatch: expected ${expectedSha256}, got ${actual}")
            }
            logger.lifecycle("Verified ${label}: ${target}")
        }

        downloadVerified(
                'JustEnoughGuide 2.1.27',
                rootProject.ext.guguJustEnoughGuideDownloadUrl,
                rootProject.ext.guguJustEnoughGuideSha256,
                jegOutput.get().asFile)
        downloadVerified(
                'heaven 0.13.0',
                rootProject.ext.guguHeavenDownloadUrl,
                rootProject.ext.guguHeavenSha256,
                heavenOutput.get().asFile)
        downloadVerified(
                'nlp-common 0.0.5',
                rootProject.ext.guguNlpCommonDownloadUrl,
                rootProject.ext.guguNlpCommonSha256,
                nlpOutput.get().asFile)
        downloadVerified(
                'GuizhanLibPlugin Build 62',
                rootProject.ext.guizhanLibPluginDownloadUrl,
                rootProject.ext.guizhanLibPluginSha256,
                libOutput.get().asFile)
    }
}

