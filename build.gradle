def readLittleEndianInt = { InputStream input ->
    byte[] data = new byte[4]
    new DataInputStream(input).readFully(data)
    java.nio.ByteBuffer.wrap(data).order(java.nio.ByteOrder.LITTLE_ENDIAN).getInt()
}

def writeLittleEndianInt = { OutputStream output, int value ->
    output.write(value & 0xff)
    output.write((value >>> 8) & 0xff)
    output.write((value >>> 16) & 0xff)
    output.write((value >>> 24) & 0xff)
}

def sendRconPacket = { OutputStream output, int requestId, int type, String payload ->
    def body = new ByteArrayOutputStream()
    writeLittleEndianInt(body, requestId)
    writeLittleEndianInt(body, type)
    body.write(payload.getBytes(StandardCharsets.UTF_8))
    body.write(0)
    body.write(0)
    writeLittleEndianInt(output, body.size())
    body.writeTo(output)
    output.flush()
}

def readRconPacket = { InputStream input ->
    int length = readLittleEndianInt(input)
    byte[] data = new byte[length]
    new DataInputStream(input).readFully(data)
    def buffer = java.nio.ByteBuffer.wrap(data).order(java.nio.ByteOrder.LITTLE_ENDIAN)
    int requestId = buffer.getInt()
    int type = buffer.getInt()
    int payloadLength = Math.max(0, length - 10)
    byte[] payload = new byte[payloadLength]
    buffer.get(payload)
    [id: requestId, type: type, payload: new String(payload, StandardCharsets.UTF_8)]
}

def sendPaperRconCommand = { String commandText ->
    def output = new ByteArrayOutputStream()
    def script = layout.projectDirectory.file('tools/paper-rcon.ps1').asFile
    def result = exec {
        executable = 'powershell.exe'
        args = [
                '-NoProfile',
                '-ExecutionPolicy', 'Bypass',
                '-File', script.absolutePath,
                '-HostName', rootProject.ext.paperRuntimeRconHost,
                '-Port', rootProject.ext.paperRuntimeRconPort.toString(),
                '-Password', rootProject.ext.paperRuntimeRconPassword,
                '-CommandText', commandText,
                '-TimeoutMs', '5000'
        ]
        standardOutput = output
        errorOutput = output
        ignoreExitValue = true
    }
    def responseText = output.toString(StandardCharsets.UTF_8.name()).trim()
    if (responseText != null && !responseText.isBlank()) {
        logger.lifecycle(responseText)
    }
    if (result.exitValue != 0) {
        throw new IOException(responseText.isBlank() ? "RCON command failed: ${commandText}" : responseText)
    }
    responseText
}

def sendPaperRconCommandWithRetry = { String commandText, int attempts = 3, long delayMs = 1000L ->
    IOException lastIo = null
    for (int attempt = 1; attempt <= attempts; attempt++) {
        try {
            return sendPaperRconCommand(commandText)
        } catch (IOException exception) {
            lastIo = exception
            if (attempt < attempts) {
                Thread.sleep(delayMs)
            }
        }
    }
    throw lastIo
}

def readNewLogText = { logFile, offset ->
    if (!logFile.exists() || logFile.length() <= offset) {
        return ''
    }
    def stream = new RandomAccessFile(logFile, 'r')
    stream.withCloseable {
        it.seek(offset as long)
        byte[] data = new byte[(int) Math.min(Integer.MAX_VALUE, it.length() - offset)]
        it.readFully(data)
        return new String(data, StandardCharsets.UTF_8)
    }
}

def waitForLogMatch = { logFile, offset, needles, timeoutMs ->
    long deadline = System.currentTimeMillis() + timeoutMs
    while (System.currentTimeMillis() <= deadline) {
        def text = readNewLogText(logFile, offset)
        if (needles.any { text.contains(it) }) {
            return true
        }
        Thread.sleep(250L)
    }
    false
}

def waitForSfxEnable = { logFile, offset, timeoutMs ->
    long deadline = System.currentTimeMillis() + timeoutMs
    while (System.currentTimeMillis() <= deadline) {
        def text = readNewLogText(logFile, offset)
        if (text.contains('[SlimeFunX] SlimeFunX failed to start:')
                || text.contains('Cannot execute command') && text.contains('plugin is disabled')) {
            return false
        }
        if (text.contains('[SlimeFunX] SFX enabled.')) {
            return true
        }
        Thread.sleep(250L)
    }
    false
}

tasks.register('paperRcon') {
    group = 'application'
    description = 'Sends an arbitrary command to the running Paper 1.21.8 test server over local RCON. Use -Pcmd="command".'
    dependsOn 'ensurePaperRuntimeTestConfig'
    doLast {
        def commandText = project.findProperty('cmd')?.toString()
        if (commandText == null || commandText.isBlank()) {
            throw new GradleException('Missing command. Use: .\\gradlew.bat paperRcon -Pcmd="say test"')
        }
        try {
            sendPaperRconCommandWithRetry(commandText)
        } catch (IOException exception) {
            throw new GradleException('Paper 1.21.8 test server is not running or RCON is not enabled yet. Start it with runPaper after ensurePaperRuntimeTestConfig.', exception)
        }
    }
}

tasks.register('reloadPaperRuntime') {
    group = 'application'
    description = 'Sends /sfx reload runtime to the running Paper 1.21.8 test server over local RCON.'
    dependsOn 'ensurePaperRuntimeTestConfig'
    doLast {
        try {
            sendPaperRconCommandWithRetry('sfx reload runtime')
            logger.lifecycle('Requested SFX runtime reload on Paper 1.21.8.')
        } catch (IOException exception) {
            throw new GradleException('Paper 1.21.8 test server is not running or RCON is not enabled yet. Start it with runPaper after ensurePaperRuntimeTestConfig.', exception)
        }
    }
}

tasks.register('stageAndReloadPaperRuntime') {
    group = 'application'
    description = 'Stages the jar for the next restart and reloads the current SFX runtime/config over RCON. Bytecode changes still require restart or an external plugin loader.'
    dependsOn 'stagePaperRuntimeUpdate', 'reloadPaperRuntime'
}

tasks.register('plugmanReloadPaperRuntime') {
    group = 'application'
    description = 'Builds SlimeFunX, unloads it with PlugManX, replaces the Paper 1.21.8 plugin jar, then loads it again.'
    dependsOn 'ensurePaperRuntimeTestConfig', 'installPaperRuntimePlugManX', 'jar'
    doLast {
        try {
            sendPaperRconCommandWithRetry('list')
            def logFile = layout.projectDirectory.file('run-paper-1.21.8/logs/latest.log').asFile
            long unloadLogOffset = logFile.exists() ? logFile.length() : 0L
            def unloadResponse = sendPaperRconCommandWithRetry('plugman unload SlimeFunX')
            if (!String.valueOf(unloadResponse).contains('SlimeFunX has been unloaded')
                    && !String.valueOf(unloadResponse).contains('That is not a valid plugin')
                    && !waitForLogMatch(logFile, unloadLogOffset, ['[SlimeFunX] Disabling SlimeFunX'], 10000L)) {
                throw new GradleException('PlugManX unload command was sent, but SlimeFunX disable was not observed in latest.log.')
            }
            def builtJar = tasks.named('jar').get().archiveFile.get().asFile
            def targetJar = layout.projectDirectory.file("run-paper-1.21.8/plugins/${rootProject.ext.pluginJarName}").asFile
            java.nio.file.Files.copy(builtJar.toPath(), targetJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("Copied ${builtJar.name} to ${targetJar}")
            Thread.sleep(1500L)
            long loadLogOffset = logFile.exists() ? logFile.length() : 0L
            sendPaperRconCommandWithRetry('plugman load SlimeFunX', 5, 1500L)
            if (!waitForSfxEnable(logFile, loadLogOffset, 20000L)) {
                throw new GradleException('PlugManX load command was sent, but SlimeFunX enable was not observed in latest.log.')
            }
            logger.lifecycle('Requested PlugManX unload/load for SlimeFunX on Paper 1.21.8.')
        } catch (IOException exception) {
            throw new GradleException('Paper 1.21.8 test server is not running or RCON is not enabled. Start it with runPaper first.', exception)
        }
    }
}

tasks.named('reloadPaperRuntime') {
    mustRunAfter 'stagePaperRuntimeUpdate'
}

tasks.register('preparePaper261Runtime') {
    group = 'deployment'
    description = 'Prepares a dedicated Paper 26.1 runtime directory for SFX testing.'
    dependsOn 'prepareRuntimeDirs'
    doLast {
        def sourceDir = layout.projectDirectory.dir('run-paper-1.21.8').asFile
        def targetDir = layout.projectDirectory.dir(rootProject.ext.paper261RuntimeDirName).asFile

        targetDir.mkdirs()
        ['plugins', 'logs'].each { child ->
            new File(targetDir, child).mkdirs()
        }

        [
                'eula.txt',
                'server.properties',
                'ops.json',
                'bukkit.yml',
                'spigot.yml',
                'commands.yml',
                'help.yml',
                'permissions.yml'
        ].each { fileName ->
            def sourceFile = new File(sourceDir, fileName)
            def targetFile = new File(targetDir, fileName)
            if (sourceFile.exists() && !targetFile.exists()) {
                copy {
                    from sourceFile
                    into targetDir
                }
            }
        }

        def sourceConfigDir = new File(sourceDir, 'config')
        def targetConfigDir = new File(targetDir, 'config')
        if (sourceConfigDir.exists()) {
            sourceConfigDir.mkdirs()
            copy {
                from sourceConfigDir
                into targetConfigDir
                include 'paper-global.yml', 'paper-world-defaults.yml'
            }
        }

        def sourcePacketEvents = new File(sourceDir, 'plugins/packetevents-spigot-2.12.1.jar')
        if (sourcePacketEvents.exists()) {
            copy {
                from sourcePacketEvents
                into new File(targetDir, 'plugins')
            }
        }

        def sourceReadme = new File(sourceDir, 'README.md')
        def targetReadme = new File(targetDir, 'README.md')
        if (!targetReadme.exists()) {
            targetReadme.text = """Place a Paper 26.1 server jar here as ${rootProject.ext.paper261RuntimeJarName}.
Paper 26.1+ requires Java 25 according to PaperMC documentation.

${sourceReadme.exists() ? sourceReadme.text : ''}
""".stripIndent()
        }

        new File(targetDir, 'start-paper.ps1').text = """\$ErrorActionPreference = 'Stop'
Set-Location \$PSScriptRoot
chcp 65001 > \$null
[Console]::InputEncoding = [System.Text.UTF8Encoding]::new()
[Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()

\$javaCmd = 'java'
\$preferredJava = 'D:\\MyApp\\java\\jdk-25\\bin\\java.exe'
if (-not (Test-Path \$preferredJava)) {
    \$preferredJava = 'C:\\Program Files\\Java\\jdk-25\\bin\\java.exe'
}
if (-not (Test-Path \$preferredJava)) {
    \$preferredJava = 'C:\\Program Files\\Java\\jdk-25.0.1\\bin\\java.exe'
}
if (-not (Test-Path \$preferredJava)) {
    \$preferredJava = 'C:\\Program Files\\Java\\jdk-25.0.2\\bin\\java.exe'
}
if (Test-Path \$preferredJava) {
    \$javaCmd = \$preferredJava
}

& \$javaCmd -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8 -Xms1G -Xmx2G -jar .\\${rootProject.ext.paper261RuntimeJarName} nogui
""".stripIndent()
    }
}

