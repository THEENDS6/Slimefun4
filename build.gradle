                violations << "compiled configurable machine ui panels expected inventory-size 54 on every panel, got ${configurableInventorySizeCount}"
            }
            def configurableSlotsSectionCount = (configurableText =~ /(?m)^          slots:\s*$/).count
            if (configurableSlotsSectionCount != 5) {
                violations << "compiled configurable machine ui panels expected explicit slots section on every panel, got ${configurableSlotsSectionCount}"
            }
            def configurableSlotCount = (configurableText =~ /(?m)^            ['"]?[0-9]+['"]?:\s*$/).count
            if (configurableSlotCount != 270) {
                violations << "compiled configurable machine ui explicit slot count expected 270, got ${configurableSlotCount}"
            }
            def configurableSlotRoleCount = (configurableText =~ /(?m)^              role:\s*/).count
            def configurableSlotBehaviorCount = (configurableText =~ /(?m)^              behavior:\s*/).count
            if (configurableSlotRoleCount != 270 || configurableSlotBehaviorCount != 270) {
                violations << "compiled configurable machine ui slots expected role/behavior on every slot, got role=${configurableSlotRoleCount}, behavior=${configurableSlotBehaviorCount}"
            }
            def configurableInputCount = (configurableText =~ /(?m)^              role:\s*input\s*$/).count
            def configurableOutputCount = (configurableText =~ /(?m)^              role:\s*output\s*$/).count
            if (configurableInputCount != 24 || configurableOutputCount != 4) {
                violations << "compiled configurable machine ui expected 24 input and 4 output slots, got input=${configurableInputCount}, output=${configurableOutputCount}"
            }
            def configurableStateIndexCount = (configurableText =~ /(?m)^              state-index:\s*/).count
            if (configurableStateIndexCount != 28) {
                violations << "compiled configurable machine ui state-index count expected 28, got ${configurableStateIndexCount}"
            }
            def configurableAcceptsCount = (configurableText =~ /(?m)^              accepts:\s*/).count
            if (configurableAcceptsCount != 24) {
                violations << "compiled configurable machine ui accepts count expected 24, got ${configurableAcceptsCount}"
            }
            def configurableActionCount = (configurableText =~ /(?m)^              action:\s*/).count
            if (configurableActionCount != 8) {
                violations << "compiled configurable machine ui action count expected 8, got ${configurableActionCount}"
            }
            def configurableItemSourceCount = (configurableText =~ /(?m)^              item-source:\s*/).count
            if (configurableItemSourceCount != 21) {
                violations << "compiled configurable machine ui item-source count expected 21, got ${configurableItemSourceCount}"
            }
            def configurablePanelHelper = configurableText =~ /(?m)^          (frame|inputs|outputs|buttons|status|display):\s*$/
            if (configurablePanelHelper.find()) {
                violations << "compiled configurable machine ui panels contain helper section: ${configurablePanelHelper.group(1)}"
            }
            validateNoLiteralUiText(configurableText, 'content/machines/configurable-machines/configurable-machines.yml', 'configurable ui')
        }
        def compiledCategoryCount = 0
        def compiledItemCount = 0
        def compiledResearchCount = 0
        def compiledCategoryFile = new File(root, 'content/items/10-legacy-categories.yml')
        if (!compiledCategoryFile.isFile()) {
            violations << "compiled item category output missing content/items/10-legacy-categories.yml"
        } else {
            def categoryText = compiledCategoryFile.getText('UTF-8')
            compiledCategoryCount = (categoryText =~ /(?m)^- id:\s*/).count
            if (compiledCategoryCount != 50) {
                violations << "compiled item category count expected 50, got ${compiledCategoryCount}"
            }
            [
                    'name-key'     : (categoryText =~ /(?m)^  name-key:\s*/).count,
                    'priority/order': (categoryText =~ /(?m)^  (priority|order):\s*/).count,
                    'icon'         : (categoryText =~ /(?m)^  icon:\s*/).count,
                    'icon material': (categoryText =~ /(?m)^    material:\s*/).count,
                    'icon name-key': (categoryText =~ /(?m)^    name-key:\s*/).count
            ].each { field, count ->
                if (count != 50) {
                    violations << "compiled item categories expected ${field} on every entry, got ${count}"
                }
            }
            if ((categoryText =~ /(?m)^  name:\s*/).find() || (categoryText =~ /(?m)^    name:\s*/).find()) {
                violations << "compiled item categories must not contain literal name fields"
            }
        }
        def compiledItemFile = new File(root, 'content/items/20-legacy-items.yml')
        if (!compiledItemFile.isFile()) {
            violations << "compiled item output missing content/items/20-legacy-items.yml"
        } else {
            def itemText = compiledItemFile.getText('UTF-8')
            compiledItemCount = (itemText =~ /(?m)^- id:\s*/).count
            if (compiledItemCount != 556) {
                violations << "compiled item count expected 556, got ${compiledItemCount}"
            }
            [
                    'category'      : (itemText =~ /(?m)^  category:\s*/).count,
                    'material'      : (itemText =~ /(?m)^  material:\s*/).count,
                    'name-key'      : (itemText =~ /(?m)^  name-key:\s*/).count,
                    'priority/order': (itemText =~ /(?m)^  (priority|order|pos):\s*/).count
            ].each { field, count ->
                if (count != 556) {
                    violations << "compiled items expected ${field} on every entry, got ${count}"
                }
            }
            if ((itemText =~ /(?m)^  name:\s*/).find() || (itemText =~ /(?m)^  lore:\s*/).find()) {
                violations << "compiled items must not contain literal name/lore fields"
            }
            def itemRecipeCount = (itemText =~ /(?m)^  recipes:\s*/).count
            def itemRecipeTypeCount = (itemText =~ /(?m)^  - type:\s*/).count
            def itemRecipeNoteCount = (itemText =~ /(?m)^    note-key:\s*/).count
            def itemRecipeMatrixCount = (itemText =~ /(?m)^    matrix:\s*/).count
            if (itemRecipeTypeCount != itemRecipeCount || itemRecipeNoteCount != itemRecipeCount || itemRecipeMatrixCount != itemRecipeCount) {
                violations << "compiled item guide recipes must explicitly include type/note-key/matrix on every entry: recipes=${itemRecipeCount}, type=${itemRecipeTypeCount}, note-key=${itemRecipeNoteCount}, matrix=${itemRecipeMatrixCount}"
            }
            if ((itemText =~ /(?m)^    note:\s*/).find()) {
                violations << "compiled item guide recipes must not contain literal note fields"
            }
            def itemGuideMatrixSlotCount = (itemText =~ /(?m)^    - type:\s*/).count
            def itemGuideMatrixAmountCount = (itemText =~ /(?m)^      amount:\s*/).count
            if (itemGuideMatrixSlotCount != itemRecipeMatrixCount * 9 || itemGuideMatrixAmountCount != itemRecipeMatrixCount * 9) {
                violations << "compiled item guide recipe matrices must contain explicit type/amount on every slot: matrices=${itemRecipeMatrixCount}, slots=${itemGuideMatrixSlotCount}, amounts=${itemGuideMatrixAmountCount}"
            }
            def currentItemId = null
            def inItemGuideMatrix = false
            def pendingItemGuideSfxLine = null
            itemText.readLines().eachWithIndex { line, lineIndex ->
                def itemIdMatch = line =~ /^- id:\s*(.+?)\s*$/
                if (itemIdMatch.matches()) {
                    if (pendingItemGuideSfxLine != null) {
                        violations << "content/items/20-legacy-items.yml:${pendingItemGuideSfxLine}: item ${currentItemId} guide recipe sfx matrix slot missing id"
                        pendingItemGuideSfxLine = null
                    }
                    currentItemId = cleanScalar(itemIdMatch[0][1])
                    inItemGuideMatrix = false
                    return
                }
                if ((line =~ /^    matrix:\s*$/).matches()) {
                    inItemGuideMatrix = true
                    return
                }
                if (inItemGuideMatrix && (line =~ /^  [A-Za-z0-9_-]+:/).find()) {
                    if (pendingItemGuideSfxLine != null) {
                        violations << "content/items/20-legacy-items.yml:${pendingItemGuideSfxLine}: item ${currentItemId} guide recipe sfx matrix slot missing id"
                        pendingItemGuideSfxLine = null
                    }
                    inItemGuideMatrix = false
                }
                if (inItemGuideMatrix) {
                    def scalarSlot = line =~ /^    -\s*(.+?)\s*$/
                    if (scalarSlot.matches() && !scalarSlot.group(1).startsWith('type:')) {
                        violations << "compiled item guide recipe matrix contains scalar slot shorthand: ${scalarSlot.group(1)}"
                    }
                    def typeMatch = line =~ /^    -\s*type:\s*(.+?)\s*$/
                    if (typeMatch.matches()) {
                        if (pendingItemGuideSfxLine != null) {
                            violations << "content/items/20-legacy-items.yml:${pendingItemGuideSfxLine}: item ${currentItemId} guide recipe sfx matrix slot missing id"
                            pendingItemGuideSfxLine = null
                        }
                        def type = cleanScalar(typeMatch[0][1])
                        if (type != null && type.equalsIgnoreCase('sfx')) {
                            pendingItemGuideSfxLine = lineIndex + 1
                        }
                        return
                    }
                    def idMatch = line =~ /^      id:\s*(.+?)\s*$/
                    if (pendingItemGuideSfxLine != null && idMatch.matches()) {
                        def id = cleanScalar(idMatch[0][1])
                        if (id == null || id.isBlank()) {
                            violations << "content/items/20-legacy-items.yml:${lineIndex + 1}: item ${currentItemId} guide recipe contains blank sfx item reference"
                        } else {
                            itemGuideRecipeItemReferences << [rel: 'content/items/20-legacy-items.yml', line: lineIndex + 1, item: currentItemId, ref: id]
                        }
                        pendingItemGuideSfxLine = null
                    }
                }
            }
            if (pendingItemGuideSfxLine != null) {
                violations << "content/items/20-legacy-items.yml:${pendingItemGuideSfxLine}: item ${currentItemId} guide recipe sfx matrix slot missing id"
            }
        }
        if (!new File(root, 'content/items/items.yml').isFile()) {
            violations << "compiled item override output missing content/items/items.yml"
        }
        def compiledItemContentFiles = fileTree(new File(root, 'content/items')) {
            include '**/*.yml'
        }.files
        compiledItemContentFiles.each { itemFile ->
            def rel = root.toPath().relativize(itemFile.toPath()).toString()
            def inItems = false
            itemFile.readLines('UTF-8').eachWithIndex { line, lineIndex ->
                def itemsRootMatch = line =~ /^items:\s*(.*)$/
                if (itemsRootMatch.matches()) {
                    def value = cleanScalar(itemsRootMatch[0][1])
                    inItems = value == null || value.isBlank()
                    return
                }
                if ((line =~ /^[A-Za-z0-9_-]+:\s*/).matches()) {
                    inItems = false
                    return
                }
                if (!inItems) {
                    return
                }
                def idMatch = line =~ /^- id:\s*(.+?)\s*$/
                if (idMatch.matches()) {
                    def id = cleanScalar(idMatch[0][1])
                    if (id == null || id.isBlank()) {
                        violations << "${rel}:${lineIndex + 1}: blank compiled item id"
                    } else if (!compiledItemIds.add(id)) {
                        violations << "${rel}:${lineIndex + 1}: duplicate compiled item id ${id}"
                    }
                }
            }
        }
        def compiledResearchFile = new File(root, 'content/researches/10-legacy-slimefun.yml')
        if (!compiledResearchFile.isFile()) {
            violations << "compiled research output missing content/researches/10-legacy-slimefun.yml"
        } else {
            def researchText = compiledResearchFile.getText('UTF-8')
            compiledResearchCount = (researchText =~ /(?m)^- id:\s*/).count
            if (compiledResearchCount != 258) {
                violations << "compiled research count expected 258, got ${compiledResearchCount}"
            }
            def researchNameKeyCount = (researchText =~ /(?m)^  name-key:\s*/).count
            if (researchNameKeyCount != 258) {
                violations << "compiled researches expected name-key on every entry, got ${researchNameKeyCount}"
            }
            if ((researchText =~ /(?m)^  name:\s*/).find()) {
                violations << "compiled researches must not contain literal name fields"
            }
        }
        def compiledLegacyBehaviorFile = new File(root, 'content/legacy-item-behavior/legacy-item-behavior.yml')
        if (!compiledLegacyBehaviorFile.isFile()) {
            violations << "compiled legacy item behavior output missing content/legacy-item-behavior/legacy-item-behavior.yml"
        } else {
            def behaviorText = compiledLegacyBehaviorFile.getText('UTF-8')
            ['beheading-chances:', 'tools:', 'gadgets:', 'talismans:', 'seasonal:'].each { token ->
                if (!behaviorText.contains(token)) {
                    violations << "compiled legacy item behavior missing ${token}"
                }
            }
            [
                    'default:',
                    'ender-dragon:',
                    'allow-fortune:',
                    'custom-smelts:',
                    'max-blocks:',
                    'range:',
                    'durability-cost:',
                    'dual-wielding:',
                    'consume-on-use:',
                    'no-fall-ticks:',
                    'firework-count:',
                    'copy-equipment-drops:',
                    'duplicate-block-drops:',
                    'fortune-min:',
                    'fortune-max:',
                    'degrade-existing-enchantments:',
                    'degrade-chance:'
            ].each { token ->
                if (!behaviorText.contains(token)) {
                    violations << "compiled legacy item behavior missing ${token}"
                }
            }
            def talismanChanceCount = (behaviorText =~ /(?m)^    chance:\s*/).count
            def talismanConsumeCount = (behaviorText =~ /(?m)^    consume:\s*/).count
            def talismanDurationCount = (behaviorText =~ /(?m)^    duration-ticks:\s*/).count
            def talismanAmplifierCount = (behaviorText =~ /(?m)^    amplifier:\s*/).count
            def christmasGiftCount = (behaviorText =~ /(?m)^    -\s*/).count
            if (talismanChanceCount != 16) {
                violations << "compiled legacy item behavior talisman chance count expected 16, got ${talismanChanceCount}"
            }
            if (talismanConsumeCount != 16) {
                violations << "compiled legacy item behavior talisman consume count expected 16, got ${talismanConsumeCount}"
            }
            if (talismanDurationCount != 7) {
                violations << "compiled legacy item behavior talisman duration count expected 7, got ${talismanDurationCount}"
            }
            if (talismanAmplifierCount != 7) {
                violations << "compiled legacy item behavior talisman amplifier count expected 7, got ${talismanAmplifierCount}"
            }
            if (christmasGiftCount != 12) {
                violations << "compiled legacy item behavior christmas gift count expected 12, got ${christmasGiftCount}"
            }
        }
        def electricRecipeCompiledFile = new File(root, 'content/machines/electric-recipes/electric-recipes.yml')
        def electricRecipeCompiledProviderCount = 0
        def electricRecipeCompiledEntryCount = 0
        if (!electricRecipeCompiledFile.isFile()) {
            violations << "compiled electric recipe provider output missing content/machines/electric-recipes/electric-recipes.yml"
        } else {
            def electricRecipeText = electricRecipeCompiledFile.getText('UTF-8')
            electricRecipeCompiledProviderCount = (electricRecipeText =~ /(?m)^  [a-z0-9_]+:\s*$/).count
            electricRecipeCompiledEntryCount = (electricRecipeText =~ /(?m)^    - id:\s*/).count
            if (electricRecipeCompiledProviderCount != 13) {
                violations << "compiled electric recipe provider count expected 13, got ${electricRecipeCompiledProviderCount}"
            }
            if (electricRecipeCompiledEntryCount != 182) {
                violations << "compiled electric recipe entry count expected 182, got ${electricRecipeCompiledEntryCount}"
            }
            ['id:', 'inputs:', 'ticks:'].each { token ->
                if (!electricRecipeText.contains(token)) {
                    violations << "compiled electric recipes missing ${token}"
                }
            }
            def electricScalarSlot = electricRecipeText =~ /(?m)^\s+-\s+(?!id:|item:|material:)[A-Za-z0-9_:.-]+(?:\*[0-9]+)?\s*$/
            if (electricScalarSlot.find()) {
                violations << "compiled electric recipes contain scalar input/output shorthand: ${electricScalarSlot.group(0).trim()}"
            }
            def electricSlotCount = (electricRecipeText =~ /(?m)^\s+-\s+(item|material):\s*/).count
            def electricAmountCount = (electricRecipeText =~ /(?m)^\s+amount:\s*/).count
            if (electricSlotCount != electricAmountCount) {
                violations << "compiled electric recipe slots must explicitly include amount: slots=${electricSlotCount}, amounts=${electricAmountCount}"
            }
            electricRecipeText.readLines().eachWithIndex { line, lineIndex ->
                def itemMatch = line =~ /^\s+-\s*item:\s*(.+?)\s*$/
                if (itemMatch.matches()) {
                    def id = cleanScalar(itemMatch[0][1])
                    if (id == null || id.isBlank()) {
                        violations << "content/machines/electric-recipes/electric-recipes.yml:${lineIndex + 1}: blank electric recipe item reference"
                    } else {
                        electricRecipeItemReferences << [rel: 'content/machines/electric-recipes/electric-recipes.yml', line: lineIndex + 1, item: id]
                    }
                }
            }
        }
        if (!compiledItemIds.isEmpty()) {
            catalogMachineIds.each { machineId ->
                if (!compiledItemIds.contains(machineId)) {
                    violations << "compiled machine catalog entry ${machineId} has no matching item definition"
                }
            }
            recipeItemReferences.each { ref ->
                if (!compiledItemIds.contains(ref.item)) {
                    violations << "${ref.rel}:${ref.line}: recipe ${ref.recipe} ${ref.section} references unknown item ${ref.item}"
                }
            }
            electricRecipeItemReferences.each { ref ->
                if (!compiledItemIds.contains(ref.item)) {
                    violations << "${ref.rel}:${ref.line}: electric recipe references unknown item ${ref.item}"
                }
            }
            itemGuideRecipeItemReferences.each { ref ->
                if (!compiledItemIds.contains(ref.ref)) {
                    violations << "${ref.rel}:${ref.line}: item ${ref.item} guide recipe references unknown item ${ref.ref}"
                }
            }
        }
        def electricFiles = fileTree(new File(root, 'content/machines/electric-machines')) {
            include '**/*.yml'
        }.files
        if (electricFiles.size() != 66) {
            violations << "compiled electric machine file count expected 66, got ${electricFiles.size()}"
        }
        electricFiles.each { file ->
            def text = file.getText('UTF-8')
            def rel = root.toPath().relativize(file.toPath()).toString()
            ['name-key:', 'functions:', 'ui:', 'inventory-size:', 'status-slot:', 'items:', 'status:', 'slots:'].each { token ->
                if (!text.contains(token)) {
                    violations << "${rel}: missing ${token}"
                }
            }
            if ((text =~ /(?m)^      frame:\s*/).find()) {
                violations << "${rel}: contains ui.frame helper; compiled UI must render from ui.slots"
            }
            if ((text =~ /(?m)^    (slots|input-slots|output-slots):\s*$/).find()) {
                violations << "${rel}: contains top-level slot helper fields; derive runtime slots from ui.slots"
            }
            if (!text.contains('inventory-size: 0')) {
                ['role:', 'behavior:'].each { token ->
                    if (!text.contains(token)) {
                        violations << "${rel}: missing ${token}"
                    }
                }
            }
            validateNoLiteralUiText(text, rel, 'electric ui')
            def inUiSlots = false
            def currentSlot = null
            def currentRole = null
            def currentStateIndex = false
            def flushSlot = {
                if (currentSlot != null && (currentRole == 'input' || currentRole == 'output') && !currentStateIndex) {
                    violations << "${rel}: ui.slots.${currentSlot} ${currentRole} missing state-index"
                }
            }
            text.readLines().each { line ->
                if (!inUiSlots && line == '      slots:') {
                    inUiSlots = true
                    return
                }
                if (!inUiSlots) {
                    return
                }
                def slotMatch = line =~ /^        '?([0-9]+)'?:\s*$/
                if (slotMatch.matches()) {
                    flushSlot()
                    currentSlot = slotMatch[0][1]
                    currentRole = null
                    currentStateIndex = false
                    return
                }
                if ((line =~ /^      [^ ]/).find()) {
                    flushSlot()
                    inUiSlots = false
                    currentSlot = null
                    currentRole = null
                    currentStateIndex = false
                    return
                }
                if (currentSlot != null) {
                    def roleMatch = line =~ /^          role:\s*([A-Za-z0-9_-]+)\s*$/
                    if (roleMatch.matches()) {
                        currentRole = roleMatch[0][1].replace('_', '-').toLowerCase(Locale.ROOT)
                    }
                    if ((line =~ /^          state-index:\s*[0-9]+\s*$/).find()) {
                        currentStateIndex = true
                    }
                }
            }
            flushSlot()
        }
        def energyFiles = fileTree(new File(root, 'content/machines/energy-components')) {
            include '**/*.yml'
        }.files
        if (energyFiles.size() != 21) {
            violations << "compiled energy component file count expected 21, got ${energyFiles.size()}"
        }
        energyFiles.each { file ->
            def text = file.getText('UTF-8')
            def rel = root.toPath().relativize(file.toPath()).toString()
            ['components:', 'type:', 'energy:', 'capacity:', 'generation-per-tick:', 'consumption-per-tick:', 'burn-rate:', 'vanilla-fuel:', 'progress-material:', 'fuels:', 'ui:', 'inventory-size:', 'status-slot:', 'slots:', 'role:', 'behavior:', 'state-index:', 'item-source: machine-status'].each { token ->
                if (!text.contains(token)) {
                    violations << "${rel}: missing ${token}"
                }
            }
            if ((text =~ /(?m)^      frame:\s*/).find()) {
                violations << "${rel}: contains ui.frame helper; compiled UI must render from ui.slots"
            }
            if ((text =~ /(?m)^    slots:\s*$/).find()) {
                violations << "${rel}: contains top-level slot helper fields; derive runtime slots from ui.slots"
            }
            def energyScalarStack = text =~ /(?m)^\s+(input|output):\s+[A-Za-z0-9_:.-]+(?:\*[0-9]+)?\s*$/
            if (energyScalarStack.find()) {
                violations << "${rel}: energy fuel stack uses scalar shorthand: ${energyScalarStack.group(0).trim()}"
            }
            def uiSlotCount = (text =~ /(?m)^        '?[0-9]+'?:\s*$/).count
            if (uiSlotCount != 45) {
                violations << "${rel}: energy ui.slots must explicitly define 45 slots, got ${uiSlotCount}"
            }
            [
                    input : (text =~ /(?m)^\s+role:\s*input\s*$/).count,
                    output: (text =~ /(?m)^\s+role:\s*output\s*$/).count,
                    status: (text =~ /(?m)^\s+role:\s*status\s*$/).count
            ].each { role, count ->
                def expected = role == 'status' ? 1 : 2
                if (count != expected) {
                    violations << "${rel}: energy ui expected ${expected} ${role} role slot(s), got ${count}"
                }
            }
            def stateIndexCount = (text =~ /(?m)^\s+state-index:\s*[0-9]+\s*$/).count
            if (stateIndexCount != 4) {
                violations << "${rel}: energy ui expected state-index on 2 input and 2 output slots, got ${stateIndexCount}"
            }
            validateNoLiteralUiText(text, rel, 'energy ui')
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Compiled SFX content validation failed:\n" + violations.take(100).join('\n'))
        }
        logger.lifecycle("Validated compiled SFX content: ${compiledFiles.size()} YAML file(s), ${recipeFiles.size()} recipe file(s), ${electricFiles.size()} electric machine file(s), ${energyFiles.size()} energy component file(s), ${catalogCompiledCount} machine catalog entries, ${manualCompiledCount} manual machine entries, ${configurableCompiledCount} configurable machine entries, ${electricRecipeCompiledEntryCount} electric provider recipe entries, ${compiledItemCount} items, ${compiledCategoryCount} categories, ${compiledResearchCount} researches, ${catalogMachineIds.size()} machine item reference(s), ${recipeMachineReferences.size()} recipe machine reference(s), ${recipeMachineTagReferences.size()} recipe machine tag reference(s), ${recipeItemReferences.size()} recipe item reference(s), ${electricRecipeItemReferences.size()} electric recipe item reference(s), ${itemGuideRecipeItemReferences.size()} item guide recipe item reference(s), and ${referencedLanguageKeys.size()} language key reference(s) against ${languageKeysByFile.size()} bundled language file(s).")
    }
}

tasks.register('validateSfxBundledCompiledContent') {
    group = 'verification'
    description = 'Validates the plugin jar embeds compiled SFX content matching the generated manifest.'
    dependsOn 'jar'
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    inputs.dir(layout.buildDirectory.dir('sfx-template-compiled'))
    doLast {
        def root = layout.buildDirectory.dir('sfx-template-compiled').get().asFile
        def manifestFile = new File(root, '_manifest.yml')
        if (!manifestFile.isFile()) {
            throw new GradleException("compiled manifest missing _manifest.yml")
        }
        def sourceMapFile = new File(root, '_source-map.yml')
        if (!sourceMapFile.isFile()) {
            throw new GradleException("compiled source map missing _source-map.yml")
        }
        def cleanScalar = { value ->
            value == null ? null : value.trim().replaceAll(/^['"]|['"]$/, '')
        }
        def sha256Stream = { InputStream stream ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            byte[] buffer = new byte[8192]
            int read
            while ((read = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        }
        def sha256File = { File file ->
            file.withInputStream { stream -> sha256Stream(stream) }
        }
        def manifestText = manifestFile.getText('UTF-8')
        def outputEntries = []
        def currentOutput = null
        boolean inOutputs = false
        manifestText.readLines().each { line ->
            if (line == 'outputs:') {
                inOutputs = true
                return
            }
            if (!inOutputs) {
                return
            }
            def fileMatch = line =~ /^- file:\s*(.+?)\s*$/
            if (fileMatch.matches()) {
                currentOutput = [file: cleanScalar(fileMatch[0][1]), sha256: null]
                outputEntries << currentOutput
                return
            }
            def shaMatch = line =~ /^  sha256:\s*([0-9a-fA-F]{64})\s*$/
            if (shaMatch.matches() && currentOutput != null) {
                currentOutput.sha256 = shaMatch[0][1].toLowerCase(Locale.ROOT)
            }
        }
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def violations = []
        def declaredJarEntries = outputEntries.collect { "content/compiled/${it.file}".toString() } as Set
        def expectedManifestSha = sha256File(manifestFile)
        def expectedSourceMapSha = sha256File(sourceMapFile)
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def manifestEntry = zip.getEntry('content/compiled/_manifest.yml')
            if (manifestEntry == null) {
                violations << "${jarFile.name}: missing content/compiled/_manifest.yml"
            } else {
                def actualManifestSha = zip.getInputStream(manifestEntry).withCloseable { stream -> sha256Stream(stream) }
                if (actualManifestSha != expectedManifestSha) {
                    violations << "${jarFile.name}: content/compiled/_manifest.yml sha256 mismatch"
                }
            }
            def sourceMapEntry = zip.getEntry('content/compiled/_source-map.yml')
            if (sourceMapEntry == null) {
                violations << "${jarFile.name}: missing content/compiled/_source-map.yml"
            } else {
                def actualSourceMapSha = zip.getInputStream(sourceMapEntry).withCloseable { stream -> sha256Stream(stream) }
                if (actualSourceMapSha != expectedSourceMapSha) {
                    violations << "${jarFile.name}: content/compiled/_source-map.yml sha256 mismatch"
                }
            }
            outputEntries.each { output ->
                if (output.file == null || output.file.isBlank()) {
                    violations << "_manifest.yml contains output without file"
                    return
                }
                if (output.sha256 == null) {
                    violations << "_manifest.yml output ${output.file} missing sha256"
                    return
                }
                String entryName = "content/compiled/${output.file}".toString()
                def entry = zip.getEntry(entryName)
                if (entry == null) {
                    violations << "${jarFile.name}: missing ${entryName}"
                    return
                }
                def actualSha = zip.getInputStream(entry).withCloseable { stream -> sha256Stream(stream) }
                if (actualSha != output.sha256) {
                    violations << "${jarFile.name}: ${entryName} sha256 mismatch"
                }
            }
            zip.entries().each { entry ->
                String name = entry.name
                if (!name.startsWith('content/compiled/') || !name.endsWith('.yml')) {
                    return
                }
                if (name == 'content/compiled/_manifest.yml' || name == 'content/compiled/_source-map.yml') {
                    return
                }
                if (!declaredJarEntries.contains(name)) {
                    violations << "${jarFile.name}: bundled compiled YAML is not listed in _manifest.yml: ${name}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Bundled compiled content validation failed:\n" + violations.take(100).join('\n'))
        }
        logger.lifecycle("Validated bundled compiled content in ${jarFile.name}: ${outputEntries.size()} manifest output file(s).")
    }
}

