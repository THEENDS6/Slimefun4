                languageKeysByFile.each { languageFile, keys ->
                    if (!keys.contains(key)) {
                        def line = text.substring(0, androidKeyMatcher.start()).count('\n') + 1
                        violations << "${path}:${line}: ${languageFile} missing language key ${key}"
