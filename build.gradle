    inputs.file(layout.projectDirectory.file('main/java/cc/theends6/sfx/internal/electric/SfxAreaElectricMachineProviders.java'))
    inputs.dir(layout.projectDirectory.dir('addons/basic-expansion/src/main/java'))
    inputs.file(layout.projectDirectory.file('main/java/cc/theends6/sfx/api/behavior/SfxBehaviorRegistrar.java'))
    inputs.dir(layout.projectDirectory.dir('main/java/cc/theends6/sfx/api/behavior'))
    doLast {
        def violations = []
        def definitions = layout.projectDirectory.file('main/java/cc/theends6/sfx/internal/electric/SfxElectricMachineDefinitions.java').asFile.getText('UTF-8')
        def definitionConfig = layout.projectDirectory.file('main/java/cc/theends6/sfx/internal/electric/SfxElectricMachineDefinitionConfig.java').asFile.getText('UTF-8')
        def areaProviders = layout.projectDirectory.file('main/java/cc/theends6/sfx/internal/electric/SfxAreaElectricMachineProviders.java').asFile.getText('UTF-8')
        def addon = fileTree(layout.projectDirectory.dir('addons/basic-expansion/src/main/java')) {
            include '**/*.java'
        }.files.collect { it.getText('UTF-8') }.join('\n')
        def registrar = layout.projectDirectory.file('main/java/cc/theends6/sfx/api/behavior/SfxBehaviorRegistrar.java').asFile.getText('UTF-8')
        def behaviorApiFiles = fileTree(layout.projectDirectory.dir('main/java/cc/theends6/sfx/api/behavior')) {
            include '**/*.java'
        }.files
        behaviorApiFiles.each { apiFile ->
            def apiText = apiFile.getText('UTF-8')
            if (apiText =~ /(?m)^import\s+cc\.theends6\.sfx\.internal\./) {
                violations << "Addon behavior API must not expose core internals: ${apiFile.name}"
            }
        }
        def providerFactory = layout.projectDirectory.file('main/java/cc/theends6/sfx/api/behavior/SfxElectricMachineProviderFactory.java').asFile.getText('UTF-8')
        if (!providerFactory.contains('SfxElectricMachineProvider create(SfxElectricMachineProviderContext context)')) {
            violations << 'Electric provider addons must be created through the public provider context hook.'
        }
        if (definitions.contains('SfxUtilityRulesResolver.rules(plugin).autoBrewerEnabled()')) {
            violations << 'SfxElectricMachineDefinitions must not directly select SFX Auto Brewer through utility rules.'
        }
        if (definitions.contains('new SfxAdvancedAutoBrewerRecipeProvider')
                || definitions.contains('sfx:advanced_auto_brewer')
                || definitions.contains('SfxAreaElectricMachineProviders.produceCollector(true)')
                || definitions.contains('SfxAreaElectricMachineProviders.autoBreeder(true)')
                || definitions.contains('SfxAreaElectricMachineProviders.cropGrowthAccelerator(blockData, 3, 20, true)')) {
            violations << 'SfxElectricMachineDefinitions must not construct or name SFX electric providers directly.'
        }
        if (!definitionConfig.contains('electricMachineProviderKeyPolicies()')) {
            violations << 'SfxElectricMachineDefinitionConfig must resolve providers through addon policies.'
        }
        if (!registrar.contains('registerElectricMachineProviderKeyPolicy') || !registrar.contains('registerElectricMachineProvider')) {
            violations << 'SfxBehaviorRegistrar must expose electric machine provider key policies and provider factories.'
        }
        if (!addon.contains('registerElectricMachineProviderKeyPolicy') || !addon.contains('registerElectricMachineProvider') || !addon.contains('sfx:advanced_auto_brewer')) {
            violations << 'SfxBasicExpansionAddon must register the Auto Brewer provider override and provider through addon behavior API.'
        }
        [
                'sfx:crop_growth_accelerator',
                'sfx:crop_growth_accelerator_2',
                'sfx:tree_growth_accelerator',
                'sfx:produce_collector',
                'sfx:auto_breeder',
                'sfx:animal_growth_accelerator',
                'sfx:xp_collector',
                'sfx:fluid_pump'
        ].each { providerKey ->
            if (definitions.contains(providerKey) || !addon.contains(providerKey)) {
                violations << "SFX electric provider override is missing ${providerKey}"
            }
        }
        if (areaProviders.contains('SfxAreaMachineBalance.rules(plugin).cropGrowthAcceleratorBalance()')
                || areaProviders.contains('SfxAreaMachineBalance.rules(plugin).treeGrowthAcceleratorBalance()')
                || areaProviders.contains('SfxAreaMachineBalance.rules(plugin).produceCollectorBalance()')
                || areaProviders.contains('SfxAreaMachineBalance.rules(plugin).autoBreederBalance()')
                || areaProviders.contains('SfxAreaMachineBalance.rules(plugin).animalGrowthAgeIncrement()')
                || areaProviders.contains('SfxAreaMachineBalance.rules(plugin).xpCollectorBalance()')
                || areaProviders.contains('SfxAreaMachineBalance.rules(plugin).xpFlaskEnergyCost()')
                || areaProviders.contains('SfxAreaMachineBalance.rules(plugin).fluidPumpOptimization()')
                || areaProviders.contains('SfxAreaMachineBalance.rules(plugin).fluidPumpProbeIntervalTicks()')) {
            violations << 'SfxAreaElectricMachineProviders must not directly switch SFX area providers through area balance rules.'
        }
        if (!violations.isEmpty()) {
            throw new GradleException("SFX electric provider addon policy validation failed:\n" + violations.join('\n'))
        }
        logger.lifecycle("Validated SFX electric machine provider addon policy boundary.")
    }
}

