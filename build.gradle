                    if (recipeId == null || recipeId.isBlank()) {
                        violations << "content/machines/electric-recipes/electric-recipes.yml:${lineIndex + 1}: blank electric recipe id"
                    } else if (!electricRecipeIds.add(recipeId)) {
                        violations << "content/machines/electric-recipes/electric-recipes.yml:${lineIndex + 1}: duplicate electric recipe id ${recipeId}"
                    }
                    currentElectricRecipeId = recipeId
                    inElectricRecipeTags = false
                    electricRecipeSlotSection = null
                    return
                }
                if (currentElectricRecipeId != null) {
                    def typeMatch = line =~ /^  recipe-type:\s*(.+?)\s*$/
                    if (typeMatch.matches()) {
                        electricRecipeTypes[currentElectricRecipeId] = cleanScalar(typeMatch[0][1])
                        inElectricRecipeTags = false
                        electricRecipeSlotSection = null
                        return
                    }
                    if ((line =~ /^  recipe-tags:\s*$/).matches()) {
                        inElectricRecipeTags = true
                        electricRecipeSlotSection = null
                        return
                    }
                    def electricSlotSectionMatch = line =~ /^  (inputs|outputs|random-outputs):\s*$/
                    if (electricSlotSectionMatch.matches()) {
                        electricRecipeSlotSection = electricSlotSectionMatch[0][1]
                        inElectricRecipeTags = false
                        return
                    }
                    if ((line =~ /^  ticks:/).find()) {
                        inElectricRecipeTags = false
                        electricRecipeSlotSection = null
                    }
                    if (inElectricRecipeTags) {
                        def tagMatch = line =~ /^  -\s*(.+?)\s*$/
                        if (tagMatch.matches()) {
                            electricRecipeTagsById[currentElectricRecipeId].add(cleanTag(tagMatch[0][1]))
                            return
                        }
                    }
                    if (electricRecipeSlotSection != null) {
                        def scalarSlot = line =~ /^  -\s+(?!item:|material:)(.+?)\s*$/
                        if (scalarSlot.matches()) {
                            violations << "content/machines/electric-recipes/electric-recipes.yml:${lineIndex + 1}: electric recipe ${currentElectricRecipeId} ${electricRecipeSlotSection} contains scalar input/output shorthand: ${scalarSlot[0][1]}"
                        }
                        if ((line =~ /^  [A-Za-z0-9_-]+:/).matches()) {
                            electricRecipeSlotSection = null
                        }
                    }
                }
                def itemMatch = line =~ /^\s+-\s*item:\s*(.+?)\s*$/
                if (itemMatch.matches()) {
                    def id = cleanScalar(itemMatch[0][1])
                    if (id == null || id.isBlank()) {
                        violations << "content/machines/electric-recipes/electric-recipes.yml:${lineIndex + 1}: blank electric recipe item reference"
                    } else {
                        electricRecipeItemReferences << [rel: 'content/machines/electric-recipes/electric-recipes.yml', line: lineIndex + 1, item: id]
                    }
                }
            }
        }
        if (!compiledItemIds.isEmpty()) {
            catalogMachineIds.each { machineId ->
                if (!compiledItemIds.contains(machineId)) {
                    violations << "compiled machine catalog entry ${machineId} has no matching item definition"
                }
            }
            recipeItemReferences.each { ref ->
                if (!compiledItemIds.contains(ref.item)) {
                    violations << "${ref.rel}:${ref.line}: recipe ${ref.recipe} ${ref.section} references unknown item ${ref.item}"
                }
            }
            electricRecipeItemReferences.each { ref ->
                if (!compiledItemIds.contains(ref.item)) {
                    violations << "${ref.rel}:${ref.line}: electric recipe references unknown item ${ref.item}"
                }
            }
            itemGuideRecipeItemReferences.each { ref ->
                if (!compiledItemIds.contains(ref.ref)) {
                    violations << "${ref.rel}:${ref.line}: item ${ref.item} guide recipe references unknown item ${ref.ref}"
                }
            }
        }
        def electricFiles = fileTree(new File(root, 'content/machines/electric-machines')) {
            include '**/*.yml'
        }.files
        def specialElectricProviders = [
                'sf:vanilla_furnace',
                'sf:classic_ore_grinder',
                'sf:electric_smeltery',
                'sf:auto_brewer',
                'sf:auto_brewer_legacy',
                'sf:vanilla_auto_crafter',
                'sf:enhanced_auto_crafter',
                'sf:armor_auto_crafter',
                'sf:auto_enchanter',
                'sf:auto_disenchanter',
                'sf:book_binder',
                'sf:auto_anvil',
                'sf:auto_anvil_2',
                'sf:produce_collector',
                'sf:auto_breeder',
                'sf:animal_growth_accelerator',
                'sf:crop_growth_accelerator',
                'sf:crop_growth_accelerator_2',
                'sf:tree_growth_accelerator',
                'sf:xp_collector',
                'sf:gps_transmitter',
                'sf:geo_miner',
                'sf:oil_pump',
                'sf:fluid_pump',
                'sf:iron_golem_assembler',
                'sf:wither_assembler'
        ] as Set
        if (electricFiles.size() != 66) {
            violations << "compiled electric machine file count expected 66, got ${electricFiles.size()}"
        }
        electricFiles.each { file ->
            def text = file.getText('UTF-8')
            def rel = root.toPath().relativize(file.toPath()).toString()
            def machineSlug = rel.replace('\\', '/').replaceFirst('^content/machines/electric-machines/', '').replaceFirst('\\.yml$', '')
            def namespaceSplit = machineSlug.indexOf('_')
            def machineId = namespaceSplit < 0 ? machineSlug : machineSlug.substring(0, namespaceSplit) + ':' + machineSlug.substring(namespaceSplit + 1)
            electricMachineIds.add(machineId)
            def runtimeExecutor = null
            def runtimeProvider = null
            def runtimeTags = [] as Set
            def runtimeIncludes = [] as Set
            def runtimeExcludes = [] as Set
            def runtimeList = null
            text.readLines().each { line ->
                def executorMatch = line =~ /^      executor:\s*(.+?)\s*$/
                if (executorMatch.matches()) {
                    runtimeExecutor = cleanScalar(executorMatch[0][1])
                    runtimeList = null
                    return
                }
                def providerMatch = line =~ /^      provider:\s*(.+?)\s*$/
                if (providerMatch.matches()) {
                    runtimeProvider = cleanScalar(providerMatch[0][1])
                    runtimeList = null
                    return
                }
                if ((line =~ /^      include-recipes:\s*$/).matches()) {
                    runtimeList = 'include'
                    return
                }
                if ((line =~ /^      exclude-recipes:\s*$/).matches()) {
                    runtimeList = 'exclude'
                    return
                }
                if ((line =~ /^        recipe-tags:\s*$/).matches()) {
                    runtimeList = 'tags'
                    return
                }
                if (runtimeList != null) {
                    def valueMatch = line =~ /^        -\s*(.+?)\s*$/
                    if (valueMatch.matches()) {
                        def value = cleanScalar(valueMatch[0][1])
                        if (runtimeList == 'tags') {
                            runtimeTags.add(cleanTag(value))
                        } else if (runtimeList == 'include') {
                            runtimeIncludes.add(value)
                        } else if (runtimeList == 'exclude') {
                            runtimeExcludes.add(value)
                        }
                    } else if ((line =~ /^      [A-Za-z0-9_-]+:/).matches() || (line =~ /^    [A-Za-z0-9_-]+:/).matches()) {
                        runtimeList = null
                    }
                }
            }
            if (runtimeExecutor != null || runtimeProvider != null || !runtimeTags.isEmpty() || !runtimeIncludes.isEmpty() || !runtimeExcludes.isEmpty()) {
                electricMachineRuntimeExecutorById[machineId] = runtimeExecutor
                electricMachineRuntimeTagsById[machineId] = runtimeTags
                def runtimeConflict = [] as Set
                runtimeConflict.addAll(runtimeIncludes)
                runtimeConflict.retainAll(runtimeExcludes)
                if (!runtimeConflict.isEmpty()) {
                    violations << "${rel}: runtime include-recipes/exclude-recipes conflict ${runtimeConflict}"
                }
                if (runtimeExecutor == null || runtimeExecutor.isBlank()) {
                    violations << "${rel}: runtime requires executor"
                }
                if (runtimeExecutor == 'sf:special_provider') {
                    if (runtimeProvider == null || runtimeProvider.isBlank()) {
                        violations << "${rel}: sf:special_provider runtime requires provider"
                    } else if (!specialElectricProviders.contains(runtimeProvider)) {
                        violations << "${rel}: unknown special electric provider ${runtimeProvider}"
                    }
                    if (!runtimeTags.isEmpty() || !runtimeIncludes.isEmpty() || !runtimeExcludes.isEmpty()) {
                        violations << "${rel}: sf:special_provider runtime must not declare electric recipe tags/includes/excludes"
                    }
                } else if (runtimeProvider != null && !runtimeProvider.isBlank()) {
                    violations << "${rel}: runtime provider is only valid for sf:special_provider"
                }
                runtimeIncludes.each { recipeId ->
                    if (!electricRecipeIds.contains(recipeId)) {
                        violations << "${rel}: runtime include-recipes references unknown electric recipe ${recipeId}"
                    } else if (electricRecipeTypes[recipeId] != runtimeExecutor) {
                        violations << "${rel}: runtime include-recipes ${recipeId} has recipe-type ${electricRecipeTypes[recipeId]} but executor is ${runtimeExecutor}"
                    }
                }
                runtimeExcludes.each { recipeId ->
                    if (!electricRecipeIds.contains(recipeId)) {
                        violations << "${rel}: runtime exclude-recipes references unknown electric recipe ${recipeId}"
                    }
                }
            }
            ['name-key:', 'functions:', 'ui:', 'inventory-size:', 'status-slot:', 'items:', 'status:', 'slots:'].each { token ->
                if (!text.contains(token)) {
                    violations << "${rel}: missing ${token}"
                }
            }
            if ((text =~ /(?m)^      frame:\s*/).find()) {
                violations << "${rel}: contains ui.frame helper; compiled UI must render from ui.slots"
            }
            if ((text =~ /(?m)^    (slots|input-slots|output-slots):\s*$/).find()) {
                violations << "${rel}: contains top-level slot helper fields; derive runtime slots from ui.slots"
            }
            if (!text.contains('inventory-size: 0')) {
                ['role:', 'behavior:'].each { token ->
                    if (!text.contains(token)) {
                        violations << "${rel}: missing ${token}"
                    }
                }
            }
            validateNoLiteralUiText(text, rel, 'electric ui')
            def inUiSlots = false
            def currentSlot = null
            def currentRole = null
            def currentStateIndex = false
            def flushSlot = {
                if (currentSlot != null && (currentRole == 'input' || currentRole == 'output') && !currentStateIndex) {
                    violations << "${rel}: ui.slots.${currentSlot} ${currentRole} missing state-index"
                }
            }
            text.readLines().each { line ->
                if (!inUiSlots && line == '      slots:') {
                    inUiSlots = true
                    return
                }
                if (!inUiSlots) {
                    return
                }
                def slotMatch = line =~ /^        '?([0-9]+)'?:\s*$/
                if (slotMatch.matches()) {
                    flushSlot()
                    currentSlot = slotMatch[0][1]
                    currentRole = null
                    currentStateIndex = false
                    return
                }
                if ((line =~ /^      [^ ]/).find()) {
                    flushSlot()
                    inUiSlots = false
                    currentSlot = null
                    currentRole = null
                    currentStateIndex = false
                    return
                }
                if (currentSlot != null) {
                    def roleMatch = line =~ /^          role:\s*([A-Za-z0-9_-]+)\s*$/
                    if (roleMatch.matches()) {
                        currentRole = roleMatch[0][1].replace('_', '-').toLowerCase(Locale.ROOT)
                    }
                    if ((line =~ /^          state-index:\s*[0-9]+\s*$/).find()) {
                        currentStateIndex = true
                    }
                }
            }
            flushSlot()
        }
        electricMachineIds.each { machineId ->
            def visibleMachineId = machineId == 'sf:auto_brewer_legacy' ? 'sf:auto_brewer' : machineId
            if (!compiledItemIds.contains(visibleMachineId)) {
                violations << "compiled electric machine ${machineId} has no matching item definition"
            }
            if (!catalogMachineIds.contains(visibleMachineId)) {
                violations << "compiled electric machine ${machineId} has no matching machine catalog definition"
            }
        }
        electricMachineRuntimeTagsById.each { machineId, runtimeTags ->
            def executor = electricMachineRuntimeExecutorById[machineId]
            runtimeTags.each { tag ->
                def matches = electricRecipeTagsById.any { recipeId, tags ->
                    electricRecipeTypes[recipeId] == executor && tags.contains(tag)
                }
                if (!matches) {
                    violations << "compiled electric machine ${machineId} runtime recipe-tag ${tag} has no matching recipe for executor ${executor}"
                }
            }
        }
        electricRecipeTagsById.each { recipeId, tags ->
            def recipeType = electricRecipeTypes[recipeId]
            tags.each { tag ->
                def accepted = electricMachineRuntimeTagsById.any { machineId, runtimeTags ->
                    electricMachineRuntimeExecutorById[machineId] == recipeType && runtimeTags.contains(tag)
                }
                if (!accepted) {
                    violations << "compiled electric recipe ${recipeId} recipe-tag ${tag} has no accepting machine runtime for recipe-type ${recipeType}"
                }
            }
        }
        def energyFiles = fileTree(new File(root, 'content/machines/energy-components')) {
            include '**/*.yml'
        }.files
        if (energyFiles.size() != 21) {
            violations << "compiled energy component file count expected 21, got ${energyFiles.size()}"
        }
        energyFiles.each { file ->
            def text = file.getText('UTF-8')
            def rel = root.toPath().relativize(file.toPath()).toString()
            ['components:', 'type:', 'energy:', 'capacity:', 'generation-per-tick:', 'consumption-per-tick:', 'burn-rate:', 'vanilla-fuel:', 'progress-material:', 'fuels:', 'ui:', 'inventory-size:', 'status-slot:', 'slots:', 'role:', 'behavior:', 'state-index:', 'item-source: machine-status'].each { token ->
                if (!text.contains(token)) {
                    violations << "${rel}: missing ${token}"
                }
            }
            if ((text =~ /(?m)^      frame:\s*/).find()) {
                violations << "${rel}: contains ui.frame helper; compiled UI must render from ui.slots"
            }
            if ((text =~ /(?m)^    slots:\s*$/).find()) {
                violations << "${rel}: contains top-level slot helper fields; derive runtime slots from ui.slots"
            }
            def energyScalarStack = text =~ /(?m)^\s+(input|output):\s+[A-Za-z0-9_:.-]+(?:\*[0-9]+)?\s*$/
            if (energyScalarStack.find()) {
                violations << "${rel}: energy fuel stack uses scalar shorthand: ${energyScalarStack.group(0).trim()}"
            }
            def uiSlotCount = (text =~ /(?m)^        '?[0-9]+'?:\s*$/).count
            if (uiSlotCount != 45) {
                violations << "${rel}: energy ui.slots must explicitly define 45 slots, got ${uiSlotCount}"
            }
            [
                    input : (text =~ /(?m)^\s+role:\s*input\s*$/).count,
                    output: (text =~ /(?m)^\s+role:\s*output\s*$/).count,
                    status: (text =~ /(?m)^\s+role:\s*status\s*$/).count
            ].each { role, count ->
                def expected = role == 'status' ? 1 : 2
                if (count != expected) {
                    violations << "${rel}: energy ui expected ${expected} ${role} role slot(s), got ${count}"
                }
            }
            def stateIndexCount = (text =~ /(?m)^\s+state-index:\s*[0-9]+\s*$/).count
            if (stateIndexCount != 4) {
                violations << "${rel}: energy ui expected state-index on 2 input and 2 output slots, got ${stateIndexCount}"
            }
            validateNoLiteralUiText(text, rel, 'energy ui')
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Compiled SFX content validation failed:\n" + violations.take(100).join('\n'))
        }
        logger.lifecycle("Validated compiled SFX content: ${compiledFiles.size()} YAML file(s), ${recipeFiles.size()} recipe file(s), ${electricFiles.size()} electric machine file(s), ${energyFiles.size()} energy component file(s), ${cargoFiles.size()} cargo component file(s), ${catalogCompiledCount} machine catalog entries, ${manualCompiledCount} manual machine entries, ${configurableCompiledCount} configurable machine entries, ${electricRecipeCompiledEntryCount} electric recipes, ${compiledItemCount} items, ${compiledCategoryCount} categories, ${compiledResearchCount} researches, ${catalogMachineIds.size()} machine item reference(s), ${recipeMachineReferences.size()} recipe machine reference(s), ${recipeMachineTagReferences.size()} recipe machine tag reference(s), ${recipeItemReferences.size()} recipe item reference(s), ${electricRecipeItemReferences.size()} electric recipe item reference(s), ${itemGuideRecipeItemReferences.size()} item guide recipe item reference(s), and ${referencedLanguageKeys.size()} language key reference(s) against ${languageKeysByFile.size()} bundled language file(s).")
    }
}

tasks.register('validateSfxBundledCompiledContent') {
    group = 'verification'
    description = 'Validates the plugin jar embeds compiled SFX content matching the generated manifest.'
    dependsOn 'jar'
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    inputs.dir(layout.buildDirectory.dir('sfx-template-compiled'))
    doLast {
        def root = layout.buildDirectory.dir('sfx-template-compiled').get().asFile
        def manifestFile = new File(root, '_manifest.yml')
        if (!manifestFile.isFile()) {
            throw new GradleException("compiled manifest missing _manifest.yml")
        }
        def sourceMapFile = new File(root, '_source-map.yml')
        if (!sourceMapFile.isFile()) {
            throw new GradleException("compiled source map missing _source-map.yml")
        }
        def cleanScalar = { value ->
            value == null ? null : value.trim().replaceAll(/^['"]|['"]$/, '')
        }
        def sha256Stream = { InputStream stream ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            byte[] buffer = new byte[8192]
            int read
            while ((read = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        }
        def sha256File = { File file ->
            file.withInputStream { stream -> sha256Stream(stream) }
        }
        def manifestText = manifestFile.getText('UTF-8')
        def outputEntries = []
        def currentOutput = null
        boolean inOutputs = false
        manifestText.readLines().each { line ->
            if (line == 'outputs:') {
                inOutputs = true
                return
            }
            if (!inOutputs) {
                return
            }
            def fileMatch = line =~ /^- file:\s*(.+?)\s*$/
            if (fileMatch.matches()) {
                currentOutput = [file: cleanScalar(fileMatch[0][1]), sha256: null]
                outputEntries << currentOutput
                return
            }
            def shaMatch = line =~ /^  sha256:\s*([0-9a-fA-F]{64})\s*$/
            if (shaMatch.matches() && currentOutput != null) {
                currentOutput.sha256 = shaMatch[0][1].toLowerCase(Locale.ROOT)
            }
        }
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def violations = []
        def declaredJarEntries = outputEntries.collect { "content/compiled/${it.file}".toString() } as Set
        def expectedManifestSha = sha256File(manifestFile)
        def expectedSourceMapSha = sha256File(sourceMapFile)
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def manifestEntry = zip.getEntry('content/compiled/_manifest.yml')
            if (manifestEntry == null) {
                violations << "${jarFile.name}: missing content/compiled/_manifest.yml"
            } else {
                def actualManifestSha = zip.getInputStream(manifestEntry).withCloseable { stream -> sha256Stream(stream) }
                if (actualManifestSha != expectedManifestSha) {
                    violations << "${jarFile.name}: content/compiled/_manifest.yml sha256 mismatch"
                }
            }
            def sourceMapEntry = zip.getEntry('content/compiled/_source-map.yml')
            if (sourceMapEntry == null) {
                violations << "${jarFile.name}: missing content/compiled/_source-map.yml"
            } else {
                def actualSourceMapSha = zip.getInputStream(sourceMapEntry).withCloseable { stream -> sha256Stream(stream) }
                if (actualSourceMapSha != expectedSourceMapSha) {
                    violations << "${jarFile.name}: content/compiled/_source-map.yml sha256 mismatch"
                }
            }
            outputEntries.each { output ->
                if (output.file == null || output.file.isBlank()) {
                    violations << "_manifest.yml contains output without file"
                    return
                }
                if (output.sha256 == null) {
                    violations << "_manifest.yml output ${output.file} missing sha256"
                    return
                }
                String entryName = "content/compiled/${output.file}".toString()
                def entry = zip.getEntry(entryName)
                if (entry == null) {
                    violations << "${jarFile.name}: missing ${entryName}"
                    return
                }
                def actualSha = zip.getInputStream(entry).withCloseable { stream -> sha256Stream(stream) }
                if (actualSha != output.sha256) {
                    violations << "${jarFile.name}: ${entryName} sha256 mismatch"
                }
            }
            zip.entries().each { entry ->
                String name = entry.name
                if (!name.startsWith('content/compiled/') || !name.endsWith('.yml')) {
                    return
                }
                if (name == 'content/compiled/_manifest.yml' || name == 'content/compiled/_source-map.yml') {
                    return
                }
                if (!declaredJarEntries.contains(name)) {
                    violations << "${jarFile.name}: bundled compiled YAML is not listed in _manifest.yml: ${name}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Bundled compiled content validation failed:\n" + violations.take(100).join('\n'))
        }
        logger.lifecycle("Validated bundled compiled content in ${jarFile.name}: ${outputEntries.size()} manifest output file(s).")
    }
}

