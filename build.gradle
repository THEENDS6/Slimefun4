                'content.sync-bundled-templates-before-compile'     : /(?m)^\s{2}sync-bundled-templates-before-compile:\s*false\s*$/,
                'content.runtime.compiled-only'                     : /(?m)^\s{4}compiled-only:\s*true\s*$/,
                'content.runtime.allow-java-ui-fallback'            : /(?m)^\s{4}allow-java-ui-fallback:\s*false\s*$/,
