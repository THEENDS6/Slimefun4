            'main/java/cc/theends6/sfx/internal/energy/SfxMultimeterListener.java',
            'main/java/cc/theends6/sfx/internal/energy/SfxEnergyDisplayController.java',
            'main/java/cc/theends6/sfx/internal/block/SfxBasicMachineBlockListener.java',
            'main/java/cc/theends6/sfx/internal/block/SfxSpawnerService.java',
            'main/java/cc/theends6/sfx/internal/item/DefaultSfxItems.java',
            'main/java/cc/theends6/sfx/internal/listener/SfxItemUseDispatcher.java',
            'main/java/cc/theends6/sfx/internal/listener/SfxLegacyFoodListener.java',
            'main/java/cc/theends6/sfx/internal/listener/SfxLegacyCombatToolListener.java',
            'main/java/cc/theends6/sfx/internal/listener/SfxLegacyUtilityListener.java',
            'main/java/cc/theends6/sfx/internal/listener/SfxBackpackListener.java',
            'main/java/cc/theends6/sfx/internal/radiation/SfxRadiationService.java'
    ]
    inputs.files(coreLocalizationFiles.collect { layout.projectDirectory.file(it) })
    inputs.file(layout.projectDirectory.file('main/java/cc/theends6/sfx/internal/util/SfxLocalization.java'))
    inputs.dir(layout.projectDirectory.dir('main/resources/lang'))
    doLast {
        def violations = []
        def localizationApi = layout.projectDirectory.file('main/java/cc/theends6/sfx/internal/util/SfxLocalization.java').asFile.getText('UTF-8')
        [
                'String text(String path, String fallback',
                'Component component(String path, String fallback',
                'Component categoryName(String categoryId, Component',
                'Component itemName(String itemId, Component',
                'Component researchName(String researchId, Component',
                'List<Component> itemLore(String itemId, List<Component>',
                'List<Component> recipeNote(String itemId, int index, Component'
        ].each { forbiddenSignature ->
            if (localizationApi.contains(forbiddenSignature)) {
                violations << "SfxLocalization exposes fallback overload: ${forbiddenSignature}"
            }
        }
        def flattenLanguageKeys = { File file ->
            def keys = [] as Set
            def stack = []
            file.readLines('UTF-8').each { line ->
                if (line.trim().isEmpty() || line.trim().startsWith('#') || line.trim().startsWith('-')) {
                    return
                }
                def matcher = line =~ /^(\s*)(['"]?)([^:'"]+)\2:\s*(.*)$/
                if (!matcher.matches()) {
                    return
                }
                int indent = matcher[0][1].length()
                String key = matcher[0][3].trim()
                while (!stack.isEmpty() && stack[-1].indent >= indent) {
                    stack.remove(stack.size() - 1)
                }
                def path = (stack.collect { it.key } + key).join('.')
                keys << path
                stack << [indent: indent, key: key]
            }
            keys
        }
