tasks.register('validateSfxFeatureGates') {
    group = 'verification'
    description = 'Validates bundled content feature gates reference features registered by bundled addons.'
    inputs.file(layout.projectDirectory.file('addons/basic-expansion/src/main/java/cc/theends6/sfx/addons/basic/SfxBasicExpansionAddon.java'))
    inputs.file(layout.projectDirectory.file('main/resources/config.yml'))
    inputs.dir(layout.projectDirectory.dir('main/resources/content'))
    inputs.dir(layout.projectDirectory.dir('addons/basic-expansion/src/main/resources/content'))
    doLast {
        def addonFile = layout.projectDirectory.file('addons/basic-expansion/src/main/java/cc/theends6/sfx/addons/basic/SfxBasicExpansionAddon.java').asFile
        def addonText = addonFile.getText('UTF-8')
        def constants = [:]
        (addonText =~ /private static final String\s+([A-Z0-9_]+)\s*=\s*"([^"]+)"/).each { match ->
            constants[match[1]] = match[2]
        }
        def registered = [] as Set
        (addonText =~ /context\.features\(\)\.registerBoolean\(\s*([A-Z0-9_]+|"[^"]+")\s*,/).each { match ->
            def token = match[1]
            if (token.startsWith('"')) {
                registered << token.replaceAll(/^"|"$/, '')
            } else if (constants.containsKey(token)) {
                registered << constants[token]
            }
        }
        if (registered.isEmpty()) {
            throw new GradleException('No bundled addon features were detected in SfxBasicExpansionAddon.')
        }
        def violations = []

        def registeredConfigPaths = [] as Set
        (addonText =~ /context\.features\(\)\.registerBoolean\(\s*(?:[A-Z0-9_]+|"[^"]+")\s*,\s*"([^"]+)"/).each { match ->
            registeredConfigPaths << match[1]
        }
        def configFile = layout.projectDirectory.file('main/resources/config.yml').asFile
        def configPaths = [] as Set
        def pathStack = []
        configFile.readLines('UTF-8').each { line ->
            if (line.trim().isEmpty() || line.trim().startsWith('#')) {
                return
            }
            def matcher = line =~ /^(\s*)([A-Za-z0-9_.-]+):(?:\s*(.*))?$/
            if (!matcher.matches()) {
                return
            }
            int level = ((String) matcher.group(1)).length().intdiv(2)
            while (pathStack.size() > level) {
                pathStack.remove(pathStack.size() - 1)
            }
            pathStack.add(matcher.group(2))
            configPaths << pathStack.join('.')
        }
        registeredConfigPaths.each { path ->
            if (!configPaths.contains(path)) {
                violations << "SfxBasicExpansionAddon registers feature config path ${path}, but main/resources/config.yml does not declare it"
            }
        }

        [
                layout.projectDirectory.dir('main/resources/content').asFile,
                layout.projectDirectory.dir('addons/basic-expansion/src/main/resources/content').asFile
        ].each { contentRoot ->
            fileTree(contentRoot) {
                include '**/*.yml'
            }.files.sort { it.path }.each { file ->
                def relative = layout.projectDirectory.asFile.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                file.readLines('UTF-8').eachWithIndex { line, index ->
                    def requires = line =~ /requires-feature:\s*(.+?)\s*$/
                    if (requires.find()) {
                        (requires.group(1) =~ /sfx:[A-Za-z0-9_:-]+/).each { featureMatch ->
                            def feature = featureMatch instanceof List ? featureMatch[0] : featureMatch
                            if (!registered.contains(feature)) {
                                violations << "${relative}:${index + 1}: requires-feature references unregistered bundled feature ${feature}"
                            }
                        }
                    }
                    def excludes = line =~ /excludes-feature:\s*(.+?)\s*$/
                    if (excludes.find()) {
                        (excludes.group(1) =~ /sfx:[A-Za-z0-9_:-]+/).each { featureMatch ->
                            def feature = featureMatch instanceof List ? featureMatch[0] : featureMatch
                            if (!registered.contains(feature)) {
                                violations << "${relative}:${index + 1}: excludes-feature references unregistered bundled feature ${feature}"
                            }
                        }
                    }
                    def gate = line =~ /^\s*sf:[A-Za-z0-9_:-]+:\s*(sfx:[A-Za-z0-9_:-]+)\s*$/
                    if (gate.find()) {
                        def feature = gate.group(1)
                        if (!registered.contains(feature)) {
                            violations << "${relative}:${index + 1}: item-feature-gates references unregistered bundled feature ${feature}"
                        }
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("SFX feature gate validation failed:\n" + violations.join('\n'))
        }
        logger.lifecycle("Validated SFX content feature gates against ${registered.size()} bundled addon feature(s).")
    }
}

tasks.register('validateSfxAddonJarResourceOverlay') {
    group = 'verification'
    description = 'Validates external Java addon jars can contribute content and language overlays.'
    inputs.file(layout.projectDirectory.file('main/java/cc/theends6/sfx/internal/addon/SfxAddonManager.java'))
    inputs.file(layout.projectDirectory.file('main/java/cc/theends6/sfx/internal/template/SfxTemplatePrecompiler.java'))
    inputs.file(layout.projectDirectory.file('main/java/cc/theends6/sfx/internal/util/SfxLocalization.java'))
    inputs.file(layout.projectDirectory.file('main/java/cc/theends6/sfx/SfxPluginBootstrap.java'))
    doLast {
        def violations = []
        def manager = layout.projectDirectory.file('main/java/cc/theends6/sfx/internal/addon/SfxAddonManager.java').asFile.getText('UTF-8')
        def precompiler = layout.projectDirectory.file('main/java/cc/theends6/sfx/internal/template/SfxTemplatePrecompiler.java').asFile.getText('UTF-8')
        def localization = layout.projectDirectory.file('main/java/cc/theends6/sfx/internal/util/SfxLocalization.java').asFile.getText('UTF-8')
        def bootstrap = layout.projectDirectory.file('main/java/cc/theends6/sfx/SfxPluginBootstrap.java').asFile.getText('UTF-8')
        if (!manager.contains('externalAddonJars()') || !manager.contains('externalJars.put(addon.id(), file)')) {
            violations << 'SfxAddonManager must retain successfully loaded external addon jar files.'
        }
        if (!manager.contains('loadConfigAddons') || !manager.contains('ConfigAddon')
                || !manager.contains('addon.yml')) {
            violations << 'SfxAddonManager must load data-directory configuration addons from addon.yml without requiring Java main.'
        }
        if (!manager.contains('bundled-addons/sfx-basic-expansion.jar') || !manager.contains('expandDefaultResources')) {
            violations << 'SfxAddonManager must load bundled Basic Expansion from an embedded addon jar and expand default resources.'
        }
        if (!manager.contains('manifestFeatures') || !manager.contains('registerBoolean(feature.id()')
                || !manager.contains('default-enabled')) {
            violations << 'SfxAddonManager must let configuration addon manifests register feature gates.'
        }
        if (!precompiler.contains('copyAddonContentFromJar') || !precompiler.contains('externalAddonJars(plugin)')) {
            violations << 'SfxTemplatePrecompiler must overlay content from external addon jars.'
        }
        if (!precompiler.contains('loadedAddonFolders(plugin)') || !precompiler.contains('loadedAddons()')) {
            violations << 'SfxTemplatePrecompiler must filter bundled synced addon content by loaded addons.'
        }
        if (!precompiler.contains('contentRootsUnder(addonsRoot, loadedAddonFolders)')) {
            violations << 'SfxTemplatePrecompiler must filter data-directory addon content by loaded config/java addon identity.'
        }
        if (!precompiler.contains('content/addons/') || !precompiler.contains('content/')) {
            violations << 'SfxTemplatePrecompiler must support both bundled-style and jar-root addon content paths.'
        }
        if (!localization.contains('loadExternalAddonJarOverlay') || !localization.contains('lang/" + language + ".yml"')) {
            violations << 'SfxLocalization must overlay language files from external addon jars.'
        }
        if (!localization.contains('content/addons/') || !localization.contains('/lang/" + language + ".yml"')) {
            violations << 'SfxLocalization must support bundled-style addon jar language paths.'
        }
        if (!localization.contains('loadedAddonFolders()') || !localization.contains('loadedAddons()')
                || !localization.contains('addonFolderFromBundledEntry')) {
            violations << 'SfxLocalization must only apply bundled/data-folder addon language overlays for loaded addons.'
        }
        if (!bootstrap.contains('SfxPluginAddonModule.loadAddons(plugin);') || !bootstrap.contains('plugin.localization.reload();')) {
            violations << 'SfxPluginBootstrap must reload localization after addon loading so addon jar language overlays are visible on startup.'
        }
        if (!violations.isEmpty()) {
            throw new GradleException("SFX addon jar resource overlay validation failed:\n" + violations.join('\n'))
        }
        logger.lifecycle("Validated SFX external addon jar content and language overlay hooks.")
    }
}

