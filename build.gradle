import java.nio.charset.StandardCharsets
import java.nio.file.StandardCopyOption
import java.util.concurrent.TimeUnit
import org.gradle.api.tasks.bundling.Zip

plugins {
    id 'java'
}

group = 'cc.theends6'
version = 'SFX-20260524c1'

description = 'SlimeFunX restored single-module workspace.'

ext {
    paperApiVersion = '1.21.8-R0.1-SNAPSHOT'
    pluginJarName = 'SlimeFunX.jar'
    paperRuntimeJarName = 'paper-1.21.8-60.jar'
    paperRuntimeRconHost = '127.0.0.1'
    paperRuntimeRconPort = 25575
    paperRuntimeRconPassword = 'sfx-dev'
    plugManXVersion = '3.0.4'
    plugManXDownloadUrl = 'https://cdn.modrinth.com/data/yro4niHu/versions/hrMAp7Ww/PlugManX-3.0.4.jar'
    plugManXJarName = 'PlugManX.jar'
    outputDirName = 'output'
    paper261RuntimeDirName = 'run-paper-26.1'
    paper261RuntimeJarName = 'paper-26.1.jar'
    foliaRuntimeJarName = 'folia-1.21.8-6.jar'
    legacyRuntimeDirName = 'run-legacy-slimefun-1.21.8'
    legacySlimefunDownloadUrl = 'https://github.com/rutwok-labs/SlimefunCore-V.4.0/releases/download/2647/SlimefunCore4-2647.jar'
    legacySlimefunJarName = 'SlimefunCore4-2647.jar'
    serverEncodingJvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dstdout.encoding=UTF-8',
            '-Dstderr.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8'
    ]
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'codemc-releases'
        url = 'https://repo.codemc.io/repository/maven-releases/'
    }
    maven {
        name = 'codemc-snapshots'
        url = 'https://repo.codemc.io/repository/maven-snapshots/'
    }
}

configurations {
    shade
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDirs = ['main/java']
        resources.srcDirs = ['main/resources']
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${rootProject.ext.paperApiVersion}"
    compileOnly "com.github.retrooper:packetevents-spigot:2.12.1"
    compileOnly "org.xerial:sqlite-jdbc:3.50.3.0"
    shade "org.xerial:sqlite-jdbc:3.50.3.0"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

tasks.named('jar') {
    dependsOn 'validateSfxTemplateCompile'
    archiveBaseName.set('SlimeFunX')
    archiveVersion.set('')
    from {
        configurations.shade.collect { zipTree(it) }
    }
    from(layout.buildDirectory.dir('sfx-template-compiled')) {
        into 'content/compiled'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

def sameFileContent = { File left, File right ->
    if (!left.exists() || !right.exists() || left.length() != right.length()) {
        return false
    }
    left.withInputStream { leftStream ->
        right.withInputStream { rightStream ->
            byte[] leftBuffer = new byte[8192]
            byte[] rightBuffer = new byte[8192]
            int leftRead
            while ((leftRead = leftStream.read(leftBuffer)) != -1) {
                int rightRead = rightStream.read(rightBuffer)
                if (leftRead != rightRead) {
                    return false
                }
                for (int index = 0; index < leftRead; index++) {
                    if (leftBuffer[index] != rightBuffer[index]) {
                        return false
                    }
                }
            }
            return rightStream.read() == -1
        }
    }
}

tasks.register('sourcePackage', Zip) {
    group = 'build'
    description = 'Packages SlimeFunX source files into the output directory.'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(layout.projectDirectory.dir('main')) {
        into 'main'
    }
    from(layout.projectDirectory.file('build.gradle'))
    from(layout.projectDirectory.file('README.md'))
    from(layout.projectDirectory.file('LICENSE'))
    destinationDirectory.set(layout.projectDirectory.dir(rootProject.ext.outputDirName))
    archiveFileName.set('SlimeFunX-src.zip')
}

tasks.register('exportPluginArtifacts') {
    group = 'build'
    description = 'Copies SlimeFunX.jar and SlimeFunX-src.zip into the output directory.'
    dependsOn 'jar', 'sourcePackage'
    doLast {
        def outputDir = layout.projectDirectory.dir(rootProject.ext.outputDirName).asFile
        outputDir.mkdirs()
        def sourceJar = tasks.named('jar').get().archiveFile.get().asFile
        def targetJar = new File(outputDir, rootProject.ext.pluginJarName)
        if (sameFileContent(sourceJar, targetJar)) {
            logger.lifecycle("Export unchanged, keeping timestamp: ${targetJar.name}")
        } else {
            java.nio.file.Files.copy(sourceJar.toPath(), targetJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("Exported plugin jar: ${targetJar}")
        }
    }
}

tasks.register('validateSfxMachineYaml') {
    group = 'verification'
    description = 'Validates machine YAML profile declarations against the Java profile registry.'
    inputs.file(layout.projectDirectory.file('main/resources/content/machines/machine-catalog.yml'))
    inputs.file(layout.projectDirectory.file('main/resources/content/machines/manual-machines.yml'))
    inputs.file(layout.projectDirectory.file('main/resources/content/machines/electric-recipes.yml'))
    inputs.file(layout.projectDirectory.file('main/resources/content/templates/machines/configurable/reactors.yml'))
    inputs.file(layout.projectDirectory.file('main/java/cc/theends6/sfx/internal/machine/SfxMachineSpecialProfiles.java'))
    doLast {
        def catalogFile = layout.projectDirectory.file('main/resources/content/machines/machine-catalog.yml').asFile
        def manualFile = layout.projectDirectory.file('main/resources/content/machines/manual-machines.yml').asFile
        def electricRecipeFile = layout.projectDirectory.file('main/resources/content/machines/electric-recipes.yml').asFile
        def configurableFile = layout.projectDirectory.file('main/resources/content/templates/machines/configurable/reactors.yml').asFile
        def profilesFile = layout.projectDirectory.file('main/java/cc/theends6/sfx/internal/machine/SfxMachineSpecialProfiles.java').asFile
        def catalogLines = catalogFile.readLines('UTF-8')
        def firstCatalogContent = catalogLines.find { line ->
            def trimmed = line.trim()
            trimmed && !trimmed.startsWith('#')
        }
        if (firstCatalogContent != 'machines:') {
            throw new GradleException("Machine catalog YAML must start with a machines root section.")
        }
        def enumMatcher = profilesFile.getText('UTF-8') =~ /private enum Profile\s*\{([\s\S]*?)\n\s*\}/
        if (!enumMatcher.find()) {
            throw new GradleException('Cannot locate SfxMachineSpecialProfiles.Profile enum.')
        }
        def validProfiles = enumMatcher.group(1)
                .split(',')
                .collect { it.replaceAll(/\s+/, '').trim() }
                .findAll { it }
                .toSet()
        def declaredProfiles = []
        catalogLines.each { line ->
            def matcher = line =~ /^\s*profile:\s*([A-Za-z0-9_:-]+)\s*$/
            if (matcher.matches()) {
                declaredProfiles << matcher.group(1).trim().replace('-', '_').replace(':', '_').toUpperCase(Locale.ROOT)
            }
        }
        def missing = declaredProfiles.findAll { !validProfiles.contains(it) }.unique().sort()
        if (!missing.isEmpty()) {
            throw new GradleException("Unknown machine YAML profile(s): ${missing.join(', ')}")
        }

        def catalogViolations = []
        def validCategories = ['BASIC', 'ELECTRIC', 'CONFIGURABLE', 'ENERGY', 'CARGO', 'GPS', 'ANDROID', 'SPECIAL'] as Set
        def catalogCount = 0
        def validateCatalogMachine = { machine ->
            if (machine == null) {
                return
            }
            catalogCount++
            ['category', 'display-name', 'status-slot', 'tick-interval', 'tags'].each { field ->
                if (!machine.fields.contains(field)) {
                    catalogViolations << "machine catalog ${machine.id} missing ${field}"
                }
            }
            if (machine.category != null && !validCategories.contains(machine.category.replace('-', '_').toUpperCase(Locale.ROOT))) {
                catalogViolations << "machine catalog ${machine.id} has unsupported category ${machine.category}"
            }
            if (machine.fields.contains('tags') && machine.tagCount < 1) {
                catalogViolations << "machine catalog ${machine.id} tags must contain at least one entry"
            }
        }
        def currentCatalogMachine = null
        def flushCatalogMachine = {
            validateCatalogMachine(currentCatalogMachine)
        }
        catalogLines.each { line ->
            def machineMatch = line =~ /^  (sf:[A-Za-z0-9_:-]+):\s*$/
            if (machineMatch.matches()) {
                flushCatalogMachine()
                currentCatalogMachine = [
                        id      : machineMatch.group(1),
                        fields  : [] as Set,
                        section : null,
                        category: null,
                        tagCount: 0
                ]
                return
            }
            if (currentCatalogMachine == null) {
                return
            }
            def fieldMatch = line =~ /^    ([A-Za-z0-9_-]+):(?:\s*(.*))?$/
            if (fieldMatch.matches()) {
                def field = fieldMatch.group(1)
                def value = fieldMatch.group(2) == null ? null : fieldMatch.group(2).trim().replaceAll(/^['"]|['"]$/, '')
                currentCatalogMachine.fields.add(field)
                currentCatalogMachine.section = field == 'tags' ? field : null
                if (field == 'category') {
                    currentCatalogMachine.category = value
                }
                return
            }
            if (currentCatalogMachine.section == 'tags' && (line =~ /^    -\s*/).find()) {
                currentCatalogMachine.tagCount++
            }
        }
        flushCatalogMachine()
        if (!catalogViolations.isEmpty()) {
            throw new GradleException("Machine catalog YAML validation failed:\n" + catalogViolations.join('\n'))
        }

        def manualViolations = []
        def manualRequired = ['name-key', 'icon', 'operation', 'trigger-face', 'inventory-face', 'deployable', 'pattern', 'display-pattern']
        def manualOperations = ['SHAPED_3X3', 'SHAPELESS_INPUT', 'SINGLE_INPUT', 'HAND_INPUT'] as Set
        def manualCount = 0
        def validateManualMachine = { machine ->
            if (machine == null) {
                return
            }
            manualCount++
            manualRequired.each { field ->
                if (!machine.fields.contains(field)) {
                    manualViolations << "manual machine ${machine.id} missing ${field}"
                }
            }
            if (machine.operation != null) {
                def operation = machine.operation.replace('-', '_').toUpperCase(Locale.ROOT)
                if (!manualOperations.contains(operation)) {
                    manualViolations << "manual machine ${machine.id} has unsupported operation ${machine.operation}"
                }
            }
            if (machine.fields.contains('name')) {
                manualViolations << "manual machine ${machine.id} uses literal name; use name-key"
            }
            if (machine.fields.contains('pattern') && machine.patternCount != 9) {
                manualViolations << "manual machine ${machine.id} pattern expected 9 entries, got ${machine.patternCount}"
            }
            if (machine.fields.contains('display-pattern') && machine.displayPatternCount != 9) {
                manualViolations << "manual machine ${machine.id} display-pattern expected 9 entries, got ${machine.displayPatternCount}"
            }
        }
        def currentManualMachine = null
        def flushManualMachine = {
            validateManualMachine(currentManualMachine)
        }
        manualFile.eachLine('UTF-8') { line ->
            def machineMatch = line =~ /^  (sf:[A-Za-z0-9_:-]+):\s*$/
            if (machineMatch.matches()) {
                flushManualMachine()
                currentManualMachine = [
                        id                 : machineMatch.group(1),
                        fields             : [] as Set,
                        section            : null,
                        operation          : null,
                        patternCount       : 0,
                        displayPatternCount: 0
                ]
                return
            }
            if (currentManualMachine == null) {
                return
            }
            def fieldMatch = line =~ /^    ([A-Za-z0-9_-]+):(?:\s*(.*))?$/
            if (fieldMatch.matches()) {
                def field = fieldMatch.group(1)
                def value = fieldMatch.group(2) == null ? null : fieldMatch.group(2).trim().replaceAll(/^['"]|['"]$/, '')
                currentManualMachine.fields.add(field)
                currentManualMachine.section = ['pattern', 'display-pattern'].contains(field) ? field : null
                if (field == 'operation') {
                    currentManualMachine.operation = value
                }
                return
            }
            if ((line =~ /^    -\s*/).find()) {
                def slotMatch = line =~ /^    -\s*(.*)$/
                if (['pattern', 'display-pattern'].contains(currentManualMachine.section)
                        && slotMatch.matches()
                        && !slotMatch.group(1).startsWith('type:')) {
                    manualViolations << "manual machine ${currentManualMachine.id} ${currentManualMachine.section} contains scalar slot shorthand: ${slotMatch.group(1)}"
                }
                if (currentManualMachine.section == 'pattern') {
                    currentManualMachine.patternCount++
                } else if (currentManualMachine.section == 'display-pattern') {
                    currentManualMachine.displayPatternCount++
                }
            }
        }
        flushManualMachine()
        if (!manualViolations.isEmpty()) {
            throw new GradleException("Manual machine YAML validation failed:\n" + manualViolations.join('\n'))
        }

        def electricRecipeViolations = []
        def electricRecipeGroupCount = 0
        def electricRecipeEntryCount = 0
        def electricExpansionCount = 0
        def currentRecipeGroup = null
        def currentElectricRecipe = null
        def validateElectricRecipe = { recipe ->
            if (recipe == null) {
                return
            }
            electricRecipeEntryCount++
            if (recipe.fields.contains('expand')) {
                electricExpansionCount++
                ['expand', 'id-prefix', 'input-amount', 'ticks', 'outputs'].each { field ->
                    if (!recipe.fields.contains(field)) {
                        electricRecipeViolations << "electric recipe group ${recipe.group} expansion missing ${field}"
                    }
                }
                if (!recipe.fields.contains('tag') && !recipe.fields.contains('materials')) {
                    electricRecipeViolations << "electric recipe group ${recipe.group} expansion missing tag/materials"
                }
            } else {
                ['id', 'inputs', 'ticks'].each { field ->
                    if (!recipe.fields.contains(field)) {
                        electricRecipeViolations << "electric recipe group ${recipe.group} recipe missing ${field}"
                    }
                }
                if (!recipe.fields.contains('outputs') && !recipe.fields.contains('random-outputs')) {
                    electricRecipeViolations << "electric recipe group ${recipe.group} recipe ${recipe.id ?: '<unknown>'} missing outputs/random-outputs"
                }
            }
        }
        def flushElectricRecipe = {
            validateElectricRecipe(currentElectricRecipe)
        }
        electricRecipeFile.eachLine('UTF-8') { line ->
            def groupMatch = line =~ /^  ([a-z0-9_]+):\s*$/
            if (groupMatch.matches()) {
                flushElectricRecipe()
                currentElectricRecipe = null
                currentRecipeGroup = groupMatch.group(1)
                electricRecipeGroupCount++
                return
            }
            if (currentRecipeGroup == null) {
                return
            }
            def recipeStart = line =~ /^    - (id|expand):\s*(.+?)\s*$/
            if (recipeStart.matches()) {
                flushElectricRecipe()
                currentElectricRecipe = [
                        group   : currentRecipeGroup,
                        fields  : [] as Set,
                        id      : null
                ]
                def field = recipeStart.group(1)
                currentElectricRecipe.fields.add(field)
                if (field == 'id') {
                    currentElectricRecipe.id = recipeStart.group(2)
                }
                return
            }
            if (currentElectricRecipe == null) {
                return
            }
            def fieldMatch = line =~ /^      ([A-Za-z0-9_-]+):(?:\s*(.*))?$/
            if (fieldMatch.matches()) {
                currentElectricRecipe.fields.add(fieldMatch.group(1))
            }
        }
        flushElectricRecipe()
        if (electricRecipeGroupCount != 13) {
            electricRecipeViolations << "electric recipe group count expected 13, got ${electricRecipeGroupCount}"
        }
        if (electricRecipeEntryCount != 139) {
            electricRecipeViolations << "electric recipe entry count expected 139, got ${electricRecipeEntryCount}"
        }
        if (electricExpansionCount != 4) {
            electricRecipeViolations << "electric recipe expansion count expected 4, got ${electricExpansionCount}"
        }
        if (!electricRecipeViolations.isEmpty()) {
            throw new GradleException("Electric recipe YAML validation failed:\n" + electricRecipeViolations.join('\n'))
        }

        def configurableText = configurableFile.getText('UTF-8')
        def configurableViolations = []
        def configurableMachinesStart = configurableText.indexOf('\nmachines:')
        def configurableMachineText = configurableMachinesStart >= 0 ? configurableText.substring(configurableMachinesStart + 1) : configurableText
        def configurableCount = (configurableMachineText =~ /(?m)^  ["']?sf:[^"'\r\n]+["']?:\s*$/).count
        if (configurableCount != 3) {
            configurableViolations << "configurable machine count expected 3, got ${configurableCount}"
        }
        ['kind:', 'energy:', 'capacity:', 'energy-per-action:', 'energy-per-tick:'].each { token ->
            if (!configurableMachineText.contains(token)) {
                configurableViolations << "configurable machines missing ${token}"
            }
        }
        if ((configurableMachineText =~ /(?m)^    reactor:\s*$/).count != 2) {
            configurableViolations << "configurable reactor section count expected 2"
        }
        ['coolant-item:', 'wither-aura:', 'fuels:'].each { token ->
            if ((configurableMachineText =~ /(?m)^\s+${java.util.regex.Pattern.quote(token)}/).count < 2) {
                configurableViolations << "configurable reactor entries missing ${token}"
            }
        }
        if ((configurableMachineText =~ /(?m)^    ui:\s*$/).count != 3) {
            configurableViolations << "configurable machines must declare ui on every entry"
        }
        if ((configurableMachineText =~ /(?m)^      panels:\s*$/).count != 3) {
            configurableViolations << "configurable machines must declare ui.panels on every entry"
        }
        if ((configurableMachineText =~ /(?m)^        (reactor|access-port):\s*$/).count != 5) {
            configurableViolations << "configurable machine ui panel count expected 5"
        }
        if ((configurableMachineText =~ /(?m)^          inventory-size:\s*54\s*$/).count != 5) {
            configurableViolations << "configurable machine ui panels must explicitly declare inventory-size 54"
        }
        if ((configurableMachineText =~ /(?m)^          frame:\s*$/).count != 5) {
            configurableViolations << "configurable machine source ui panels must use frame helpers before compilation"
        }
        if ((configurableMachineText =~ /(?m)^          inputs:\s*$/).count != 4) {
            configurableViolations << "configurable reactor ui source panels must declare four input helper groups"
        }
        if ((configurableMachineText =~ /(?m)^          outputs:\s*$/).count != 4) {
            configurableViolations << "configurable reactor ui source panels must declare four output helper groups"
        }
        if ((configurableMachineText =~ /(?m)^          buttons:\s*$/).count != 4) {
            configurableViolations << "configurable reactor ui source panels must declare four button helper groups"
        }
        if ((configurableMachineText =~ /(?m)^          status:\s*$/).count != 5) {
            configurableViolations << "configurable source ui panels must declare status helpers"
        }
        if ((configurableMachineText =~ /(?m)^          display:\s*$/).count != 4) {
            configurableViolations << "configurable reactor ui source panels must declare four display helper groups"
        }
        if ((configurableMachineText =~ /reactor-fuel/).count != 12 || (configurableMachineText =~ /reactor-coolant/).count != 12) {
            configurableViolations << "configurable reactor ui source panels must tag all fuel and coolant input slots"
        }
        if ((configurableMachineText =~ /reactor-toggle-mode/).count != 4 || (configurableMachineText =~ /reactor-access-port/).count != 4) {
            configurableViolations << "configurable reactor ui source panels must declare reactor button actions"
        }
        if (!configurableViolations.isEmpty()) {
            throw new GradleException("Configurable machine YAML validation failed:\n" + configurableViolations.join('\n'))
        }
        logger.lifecycle("Validated ${declaredProfiles.size()} machine YAML profile declaration(s), ${catalogCount} machine catalog declaration(s), ${manualCount} manual machine declaration(s), ${electricRecipeEntryCount} electric recipe group entry(s), and ${configurableCount} configurable machine declaration(s).")
    }
}

tasks.register('validateSfxTemplateCompile', JavaExec) {
    group = 'verification'
    description = 'Compiles bundled SFX templates into build/sfx-template-compiled and fails on unresolved or invalid template output.'
    dependsOn 'classes'
    inputs.dir(layout.projectDirectory.dir('main/resources/content/templates'))
    inputs.file(layout.projectDirectory.file('main/resources/content/machines/machine-catalog.yml'))
    inputs.file(layout.projectDirectory.file('main/resources/content/machines/manual-machines.yml'))
    inputs.file(layout.projectDirectory.file('main/resources/content/templates/machines/configurable/reactors.yml'))
    inputs.file(layout.projectDirectory.file('main/resources/content/machines/electric-recipes.yml'))
    inputs.file(layout.projectDirectory.file('main/resources/content/items.yml'))
    inputs.file(layout.projectDirectory.file('main/resources/content/items/10-legacy-categories.yml'))
    inputs.file(layout.projectDirectory.file('main/resources/content/items/20-legacy-items.yml'))
    inputs.file(layout.projectDirectory.file('main/resources/content/researches/10-legacy-slimefun.yml'))
    inputs.file(layout.projectDirectory.file('main/resources/content/legacy-item-behavior.yml'))
    outputs.dir(layout.buildDirectory.dir('sfx-template-compiled'))
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass.set('cc.theends6.sfx.internal.template.SfxTemplateCompilerCli')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
    doFirst {
        def outputDir = layout.buildDirectory.dir('sfx-template-compiled').get().asFile
        delete(outputDir)
        outputDir.mkdirs()
        args = [
                layout.projectDirectory.dir('main/resources/content/templates').asFile.absolutePath,
                outputDir.absolutePath
        ]
    }
}

tasks.register('validateSfxCompiledRecipeRuntimeShapes', JavaExec) {
    group = 'verification'
    description = 'Validates compiled recipe YAML with the same Bukkit section-style shape used by runtime loading.'
    dependsOn 'classes', 'validateSfxTemplateCompile'
    inputs.dir(layout.buildDirectory.dir('sfx-template-compiled/content/recipes'))
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass.set('cc.theends6.sfx.internal.recipe.SfxCompiledRecipeShapeValidator')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
    doFirst {
        args = [
                layout.buildDirectory.dir('sfx-template-compiled/content/recipes').get().asFile.absolutePath
        ]
    }
}

tasks.register('reverseTranscribeSfxCompiled', JavaExec) {
    group = 'verification'
    description = 'Reverse-transcribes edited server compiled content back into source templates, then roundtrip-validates the result.'
    dependsOn 'classes', 'validateSfxTemplateCompile'
    inputs.dir(layout.buildDirectory.dir('sfx-template-compiled'))
    inputs.property('sfxReverseSourceRoot', providers.gradleProperty('sfxReverseSourceRoot').orElse('main/resources/content/templates'))
    inputs.property('sfxReverseBaselineDir', providers.gradleProperty('sfxReverseBaselineDir').orElse(layout.buildDirectory.dir('sfx-template-compiled').map { it.asFile.absolutePath }))
    inputs.property('sfxReverseCompiledDir', providers.gradleProperty('sfxReverseCompiledDir').orElse('run-paper-1.21.8/plugins/SlimeFunX/content/compiled'))
    inputs.property('sfxReverseReportRoot', providers.gradleProperty('sfxReverseReportRoot').orElse(layout.buildDirectory.dir('sfx-reverse-transcribe').map { it.asFile.absolutePath }))
    outputs.dir(layout.buildDirectory.dir('sfx-reverse-transcribe'))
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass.set('cc.theends6.sfx.internal.template.SfxCompiledReverseTranscriber')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
    doFirst {
        def serverCompiled = providers.gradleProperty('sfxReverseCompiledDir')
                .orElse(layout.projectDirectory.dir('run-paper-1.21.8/plugins/SlimeFunX/content/compiled').asFile.absolutePath)
                .get()
        def sourceRoot = providers.gradleProperty('sfxReverseSourceRoot')
                .orElse(layout.projectDirectory.dir('main/resources/content/templates').asFile.absolutePath)
                .get()
        def baselineCompiled = providers.gradleProperty('sfxReverseBaselineDir')
                .orElse(layout.buildDirectory.dir('sfx-template-compiled').get().asFile.absolutePath)
                .get()
        def reportRoot = providers.gradleProperty('sfxReverseReportRoot')
                .orElse(layout.buildDirectory.dir('sfx-reverse-transcribe').get().asFile.absolutePath)
                .get()
        args = [
                "--source-root=${sourceRoot}",
                "--baseline-compiled=${baselineCompiled}",
                "--server-compiled=${serverCompiled}",
                "--report-root=${reportRoot}"
        ]
    }
}

tasks.register('validateSfxCompiledContent') {
    group = 'verification'
    description = 'Validates compiled SFX content is explicit runtime data without template or layout fallback tokens.'
    dependsOn 'validateSfxTemplateCompile', 'validateSfxCompiledRecipeRuntimeShapes'
    inputs.dir(layout.buildDirectory.dir('sfx-template-compiled'))
    inputs.dir(layout.projectDirectory.dir('main/resources/lang'))
    doLast {
        def root = layout.buildDirectory.dir('sfx-template-compiled').get().asFile
        def compiledFiles = fileTree(root) {
            include '**































*.yml'
        }.files
        def validRecipeOperations = ['shaped', 'shapeless', 'single', 'hand'] as Set
        def recipeMachineReferences = []
        def recipeMachineTagReferences = []
        def recipeItemReferences = []
        def electricRecipeItemReferences = []
        def itemGuideRecipeItemReferences = []
        def compiledItemIds = [] as Set
        def compiledRuntimeRecipeTypes = [] as Set
        def compiledRuntimeRecipeTagsByType = [:].withDefault { [] as Set }
        def electricRecipeIds = [] as Set
        def electricRecipeTypes = [:]
        def electricRecipeTagsById = [:].withDefault { [] as Set }
        def electricMachineIds = [] as Set
        def basicMachineIds = [] as Set
        def electricMachineRuntimeTagsById = [:]
        def electricMachineRuntimeExecutorById = [:]
        def cleanScalar = { value ->
            value == null ? null : value.trim().replaceAll(/^['"]|['"]$/, '')
        }
        def cleanTag = { value ->
            def cleaned = cleanScalar(value)
            cleaned == null ? null : cleaned.trim().replace('_', '-').toLowerCase(Locale.ROOT)
        }
        def sha256File = { File file ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        }
        def validateManifestOutputs = {
            def manifestFile = new File(root, '_manifest.yml')
            if (!manifestFile.isFile()) {
                violations << "compiled manifest missing _manifest.yml"
                return
            }
            def manifestText = manifestFile.getText('UTF-8')
            ['compiler:', 'compiler-version:', 'compiled-at:', 'generated-at:', 'template-hash:', 'content-version:', 'source-files:', 'outputs:'].each { field ->
                if (!manifestText.contains(field)) {
                    violations << "_manifest.yml missing ${field}"
                }
            }
            def outputEntries = []
            def currentOutput = null
            boolean inOutputs = false
            manifestText.readLines().each { line ->
                if (line == 'outputs:') {
                    inOutputs = true
                    return
                }
                if (!inOutputs) {
                    return
                }
                def fileMatch = line =~ /^- file:\s*(.+?)\s*$/
                if (fileMatch.matches()) {
                    currentOutput = [file: cleanScalar(fileMatch[0][1]), sha256: null]
                    outputEntries << currentOutput
                    return
                }
                def shaMatch = line =~ /^  sha256:\s*([0-9a-fA-F]{64})\s*$/
                if (shaMatch.matches() && currentOutput != null) {
                    currentOutput.sha256 = shaMatch[0][1].toLowerCase(Locale.ROOT)
                }
            }
            def actualOutputs = compiledFiles.findAll { !it.name.startsWith('_') }
            def actualOutputPaths = actualOutputs.collect {
                root.toPath().relativize(it.toPath()).toString().replace('\\', '/')
            } as Set
            def declaredOutputPaths = [] as Set
            outputEntries.each { entry ->
                if (entry.file == null || entry.file.isBlank()) {
                    violations << "_manifest.yml contains output without file"
                    return
                }
                declaredOutputPaths << entry.file
                if (entry.sha256 == null) {
                    violations << "_manifest.yml output ${entry.file} missing sha256"
                    return
                }
                def outputFile = new File(root, entry.file)
                def rootPath = root.canonicalFile.toPath()
                def outputPath = outputFile.canonicalFile.toPath()
                if (!outputPath.startsWith(rootPath)) {
                    violations << "_manifest.yml output escapes compiled root: ${entry.file}"
                    return
                }
                if (!outputFile.isFile()) {
                    violations << "_manifest.yml output missing from compiled directory: ${entry.file}"
                    return
                }
                def actualSha = sha256File(outputFile)
                if (actualSha != entry.sha256) {
                    violations << "_manifest.yml sha256 mismatch for ${entry.file}"
                }
            }
            actualOutputPaths.each { path ->
                if (!declaredOutputPaths.contains(path)) {
                    violations << "compiled output is not listed in _manifest.yml: ${path}"
                }
            }
            declaredOutputPaths.each { path ->
                if (!actualOutputPaths.contains(path)) {
                    violations << "_manifest.yml declares missing compiled output: ${path}"
                }
            }
            def sourceMapFile = new File(root, '_source-map.yml')
            if (!sourceMapFile.isFile()) {
                violations << "compiled source map missing _source-map.yml"
            } else {
                def sourceMapText = sourceMapFile.getText('UTF-8')
                ['origins:', 'outputs:'].each { field ->
                    if (!sourceMapText.contains(field)) {
                        violations << "_source-map.yml missing ${field}"
                    }
                }
                def sourceMapOutputs = [] as Set
                boolean inSourceMapOutputs = false
                sourceMapText.readLines().each { line ->
                    if (line == 'outputs:') {
                        inSourceMapOutputs = true
                        return
                    }
                    if (!inSourceMapOutputs) {
                        return
                    }
                    def fileMatch = line =~ /^- file:\s*(.+?)\s*$/
                    if (fileMatch.matches()) {
                        sourceMapOutputs << cleanScalar(fileMatch[0][1])
                    }
                }
                declaredOutputPaths.each { path ->
                    if (!sourceMapOutputs.contains(path)) {
                        violations << "_source-map.yml missing output mapping for ${path}"
                    }
                }
                sourceMapOutputs.each { path ->
                    if (!declaredOutputPaths.contains(path)) {
                        violations << "_source-map.yml contains output not listed in _manifest.yml: ${path}"
                    }
                }
            }
        }
        validateManifestOutputs()
        def addRecipeItemReference = { File file, recipe, String section, Object rawId, int lineNumber ->
            def rel = root.toPath().relativize(file.toPath()).toString()
            def id = cleanScalar(String.valueOf(rawId))
            if (id == null || id.isBlank()) {
                violations << "${rel}:${lineNumber}: recipe ${recipe.key} ${section} contains blank sfx item reference"
            } else {
                recipeItemReferences << [rel: rel, line: lineNumber, recipe: recipe.key, section: section, item: id]
            }
        }
        def flattenLanguageKeys = { File file ->
            def keys = [] as Set
            def stack = []
            file.readLines('UTF-8').each { line ->
                if (line.trim().isEmpty() || line.trim().startsWith('#') || line.trim().startsWith('-')) {
                    return
                }
                def matcher = line =~ /^(\s*)(['"]?)([^:'"]+)\2:\s*(.*)$/
                if (!matcher.matches()) {
                    return
                }
                int indent = matcher[0][1].length()
                String key = matcher[0][3].trim()
                while (!stack.isEmpty() && stack[-1].indent >= indent) {
                    stack.remove(stack.size() - 1)
                }
                def path = (stack.collect { it.key } + key).join('.')
                keys << path
                stack << [indent: indent, key: key]
            }
            keys
        }
        def languageFiles = fileTree(layout.projectDirectory.dir('main/resources/lang')) {
            include '**/*.yml'
        }.files.sort { it.name }
        def languageKeysByFile = languageFiles.collectEntries { file ->
            [(file.name): flattenLanguageKeys(file)]
        }
        if (languageKeysByFile.isEmpty()) {
            violations << "no bundled language files found under main/resources/lang"
        }
        def referencedLanguageKeys = [] as Set
        def validateLanguageReferences = { String text, String rel ->
            def missing = [] as Set
            def lines = text.readLines()
            for (int index = 0; index < lines.size(); index++) {
                def matcher = lines[index] =~ /^\s+[A-Za-z0-9_.-]+-key:\s*(.+?)\s*$/
                if (!matcher.matches()) {
                    continue
                }
                def key = cleanScalar(matcher[0][1])
                if (key == null || key.isBlank()) {
                    violations << "${rel}:${index + 1}: blank language key reference"
                    continue
                }
                referencedLanguageKeys << key
                languageKeysByFile.each { languageFile, keys ->
                    if (!keys.contains(key)) {
                        missing << "${rel}:${index + 1}: ${languageFile} missing language key ${key}"
                    }
                }
            }
            violations.addAll(missing)
        }
        compiledFiles.each { file ->
            def text = file.getText('UTF-8')
            def rel = root.toPath().relativize(file.toPath()).toString()
            forbiddenTokens.each { token ->
                if (text.contains(token)) {
                    violations << "${rel}: contains ${token}"
                }
            }
            if ((text =~ /(?m)^\s*layout\s*:/).find()) {
                violations << "${rel}: contains runtime layout token"
            }
            validateLanguageReferences(text, rel)
        }
        def validateNoLiteralUiText = { String text, String rel, String label ->
            def lines = text.readLines()
            for (int index = 0; index < lines.size(); index++) {
                def line = lines[index]
                def nameMatch = line =~ /^\s+name:\s*(.*)$/
                if (nameMatch.matches()) {
                    def value = cleanScalar(nameMatch[0][1])
                    if (value != null && !value.isBlank()) {
                        violations << "${rel}:${index + 1}: ${label} uses literal name; use name-key"
                    }
                }
                def loreMatch = line =~ /^\s+lore:\s*(.*)$/
                if (loreMatch.matches()) {
                    def value = loreMatch[0][1].trim()
                    if (!value.isEmpty() && value != '[]' && value != '[ ]') {
                        violations << "${rel}:${index + 1}: ${label} uses literal lore; use lore-key"
                    } else if (value.isEmpty()) {
                        def indent = (line =~ /^(\s*)/)[0][1].length()
                        for (int nextIndex = index + 1; nextIndex < lines.size(); nextIndex++) {
                            def nextLine = lines[nextIndex]
                            if (nextLine.trim().isEmpty() || nextLine.trim().startsWith('#')) {
                                continue
                            }
                            def nextIndent = (nextLine =~ /^(\s*)/)[0][1].length()
                            if (nextIndent <= indent) {
                                break
                            }
                            def itemMatch = nextLine =~ /^\s*-\s*(.*)$/
                            if (itemMatch.matches()) {
                                def itemValue = cleanScalar(itemMatch[0][1])
                                if (itemValue != null && !itemValue.isBlank()) {
                                    violations << "${rel}:${nextIndex + 1}: ${label} uses literal lore; use lore-key"
                                }
                            }
                        }
                    }
                }
            }
        }
        def validateRecipeEntry = { file, recipe ->
            if (recipe == null) {
                return
            }
            def rel = root.toPath().relativize(file.toPath()).toString()
            ['id', 'source', 'recipe-type', 'operation', 'guide-order', 'runtime', 'outputs'].each { field ->
                if (!recipe.fields.contains(field)) {
                    violations << "${rel}: recipe ${recipe.key} missing ${field}"
                }
            }
            if (recipe.id != null && recipe.id != recipe.key) {
                violations << "${rel}: recipe ${recipe.key} id field mismatches entry key ${recipe.id}"
            }
            if (recipe.operation == null) {
                return
            }
            def operation = recipe.operation.replace('-', '_').toLowerCase(Locale.ROOT)
            if (operation == 'shaped_3x3') {
                operation = 'shaped'
            } else if (operation == 'single_input') {
                operation = 'single'
            } else if (operation == 'hand_input') {
                operation = 'hand'
            } else if (operation == 'shapeless_input') {
                operation = 'shapeless'
            }
            if (!validRecipeOperations.contains(operation)) {
                violations << "${rel}: recipe ${recipe.key} has unsupported operation ${recipe.operation}"
                return
            }
            if (operation == 'shaped') {
                if (!recipe.fields.contains('matrix')) {
                    violations << "${rel}: recipe ${recipe.key} shaped operation missing matrix"
                } else if (recipe.matrixCount != 9) {
                    violations << "${rel}: recipe ${recipe.key} shaped matrix expected 9 entries, got ${recipe.matrixCount}"
                }
            } else if (operation == 'shapeless') {
                if (!recipe.fields.contains('inputs')) {
                    violations << "${rel}: recipe ${recipe.key} shapeless operation missing inputs"
                } else if (recipe.inputsCount < 1 || recipe.inputsCount > 9) {
                    violations << "${rel}: recipe ${recipe.key} shapeless inputs expected 1-9 entries, got ${recipe.inputsCount}"
                }
            } else if (!recipe.fields.contains('input')) {
                violations << "${rel}: recipe ${recipe.key} ${operation} operation missing input"
            }
            if (recipe.outputsCount < 1) {
                violations << "${rel}: recipe ${recipe.key} outputs must contain at least one entry"
            }
            if (recipe.runtime == 'true'
                    && !recipe.fields.contains('runtime-machine-tags')) {
                violations << "${rel}: recipe ${recipe.key} runtime recipe missing runtime-machine-tags"
            }
            if (recipe.fields.contains('runtime-machine-tags') && recipe.machineTagRefs.isEmpty()) {
                violations << "${rel}: recipe ${recipe.key} runtime-machine-tags must list at least one tag"
            }
            if (recipe.fields.contains('machine') || recipe.fields.contains('runtime-machines')) {
                violations << "${rel}: recipe ${recipe.key} must use runtime-machine-tags instead of direct machine/runtime-machines references"
            }
            recipe.machineRefs.each { machineId ->
                if (machineId == null || machineId.isBlank()) {
                    violations << "${rel}: recipe ${recipe.key} contains blank machine reference"
                } else {
                    recipeMachineReferences << [rel: rel, recipe: recipe.key, machine: machineId]
                }
            }
            recipe.machineTagRefs.each { tag ->
                if (tag == null || tag.isBlank()) {
                    violations << "${rel}: recipe ${recipe.key} contains blank runtime-machine-tags reference"
                } else {
                    recipeMachineTagReferences << [rel: rel, recipe: recipe.key, tag: cleanTag(tag)]
                }
            }
            if (recipe.runtime == 'true' && recipe.recipeType != null && !recipe.recipeType.isBlank()) {
                compiledRuntimeRecipeTypes << recipe.recipeType
                recipe.machineTagRefs.each { tag ->
                    if (tag != null && !tag.isBlank()) {
                        compiledRuntimeRecipeTagsByType[recipe.recipeType] << cleanTag(tag)
                    }
                }
            }
            if (recipe.scalarSlot) {
                violations << "${rel}: recipe ${recipe.key} contains scalar recipe slot/output shorthand"
            }
            if (recipe.fields.contains('note')) {
                violations << "${rel}: recipe ${recipe.key} contains literal note; use note-key"
            }
        }
        int recipeEntryCount = 0
        recipeFiles.each { file ->
            def rel = root.toPath().relativize(file.toPath()).toString()
            def text = file.getText('UTF-8')
            recipeEntryCount += (text =~ /(?m)^  ['"]?[^#\s][^\r\n]*['"]?:\s*$/).count
            def currentRecipe = null
            def flushPendingSfxSlot = {
                if (currentRecipe != null && currentRecipe.pendingSfxSection != null) {
                    violations << "${rel}:${currentRecipe.pendingSfxLine}: recipe ${currentRecipe.key} ${currentRecipe.pendingSfxSection} sfx stack missing id"
                    currentRecipe.pendingSfxSection = null
                    currentRecipe.pendingSfxLine = null
                }
            }
            def flushRecipe = {
                flushPendingSfxSlot()
                validateRecipeEntry(file, currentRecipe)
            }
            text.readLines().eachWithIndex { line, lineIndex ->
                int lineNumber = lineIndex + 1
                def recipeMatch = line =~ /^  ['"]?([^'"#\s][^'"]*?)['"]?:\s*$/
                if (recipeMatch.matches()) {
                    flushRecipe()
                    currentRecipe = [
                            key         : recipeMatch[0][1],
                            fields      : [] as Set,
                            section     : null,
                            id          : null,
                            recipeType  : null,
                            operation   : null,
                            runtime     : null,
                            matrixCount : 0,
                            inputsCount : 0,
                            outputsCount: 0,
                            machineRefs : [],
                            machineTagRefs: [],
                            scalarSlot  : false,
                            pendingSfxSection: null,
                            pendingSfxLine: null
                    ]
                    return
                }
                if (currentRecipe == null) {
                    return
                }
                def fieldMatch = line =~ /^    ([A-Za-z0-9_-]+):(?:\s*(.*))?$/
                if (fieldMatch.matches()) {
                    flushPendingSfxSlot()
                    def field = fieldMatch[0][1]
                    def value = cleanScalar(fieldMatch[0][2])
                    currentRecipe.fields.add(field)
                    currentRecipe.section = ['matrix', 'inputs', 'input', 'outputs', 'random-outputs'].contains(field) ? field : null
                    if (field == 'id') {
                        currentRecipe.id = value
                    } else if (field == 'recipe-type') {
                        currentRecipe.recipeType = value
                    } else if (field == 'operation') {
                        currentRecipe.operation = value
                    } else if (field == 'runtime') {
                        currentRecipe.runtime = value == null ? null : value.toLowerCase(Locale.ROOT)
                    } else if (field == 'machine') {
                        currentRecipe.machineRefs << value
                    } else if (field == 'runtime-machines') {
                        currentRecipe.section = 'runtime-machines'
                    } else if (field == 'runtime-machine-tags') {
                        currentRecipe.section = 'runtime-machine-tags'
                    } else if (field == 'input') {
                        if (value != null && !value.isBlank()) {
                            currentRecipe.scalarSlot = true
                        }
                    } else if (field == 'random-outputs') {
                        currentRecipe.section = 'random-outputs'
                    }
                    return
                }
                def listItemMatch = line =~ /^    -\s*(.*)$/
                if (listItemMatch.matches()) {
                    def itemText = listItemMatch[0][1] == null ? '' : listItemMatch[0][1].trim()
                    if (['matrix', 'inputs', 'outputs', 'random-outputs'].contains(currentRecipe.section)
                            && !itemText.isBlank()
                            && !itemText.startsWith('type:')) {
                        currentRecipe.scalarSlot = true
                    }
                    def inlineTypeMatch = itemText =~ /^type:\s*(.+?)\s*$/
                    if (['matrix', 'inputs', 'outputs', 'random-outputs'].contains(currentRecipe.section)
                            && inlineTypeMatch.matches()) {
                        flushPendingSfxSlot()
                        def type = cleanScalar(inlineTypeMatch[0][1])
                        if (type != null && type.equalsIgnoreCase('sfx')) {
                            currentRecipe.pendingSfxSection = currentRecipe.section
                            currentRecipe.pendingSfxLine = lineNumber
                        }
                    }
                    if (currentRecipe.section == 'matrix') {
                        currentRecipe.matrixCount++
                    } else if (currentRecipe.section == 'inputs') {
                        currentRecipe.inputsCount++
                    } else if (currentRecipe.section == 'outputs') {
                        currentRecipe.outputsCount++
                    } else if (currentRecipe.section == 'runtime-machines') {
                        currentRecipe.machineRefs << cleanScalar(itemText)
                    } else if (currentRecipe.section == 'runtime-machine-tags') {
                        currentRecipe.machineTagRefs << cleanScalar(itemText)
                    }
                    return
                }
                def nestedTypeMatch = line =~ /^      type:\s*(.+?)\s*$/
                if (['input', 'matrix', 'inputs', 'outputs', 'random-outputs'].contains(currentRecipe.section)
                        && nestedTypeMatch.matches()) {
                    flushPendingSfxSlot()
                    def type = cleanScalar(nestedTypeMatch[0][1])
                    if (type != null && type.equalsIgnoreCase('sfx')) {
                        currentRecipe.pendingSfxSection = currentRecipe.section
                        currentRecipe.pendingSfxLine = lineNumber
                    }
                    return
                }
                def nestedIdMatch = line =~ /^      id:\s*(.+?)\s*$/
                if (currentRecipe.pendingSfxSection != null && nestedIdMatch.matches()) {
                    addRecipeItemReference(file, currentRecipe, currentRecipe.pendingSfxSection, nestedIdMatch[0][1], lineNumber)
                    currentRecipe.pendingSfxSection = null
                    currentRecipe.pendingSfxLine = null
                }
            }
            flushRecipe()
        }
        if (recipeEntryCount != 547) {
            violations << "compiled recipe entry count expected 547, got ${recipeEntryCount}"
        }
        if (recipeFiles.size() >= recipeEntryCount) {
            violations << "compiled recipe files are not grouped: files=${recipeFiles.size()} entries=${recipeEntryCount}"
        }
        [
                'content/recipes/recipes',
                'content/machines/electric-machines/machines',
                'content/machines/energy-components/components',
                'content/machines/cargo-components/cargo-components',
                'content/machines/machine-catalog/machines'
        ].each { repeatedPath ->
            if (new File(root, repeatedPath).exists()) {
                violations << "compiled output path still contains repeated root section: ${repeatedPath}"
            }
        }
        def catalogCompiledFiles = fileTree(new File(root, 'content/machines/machine-catalog')) {
            include '**/*.yml'
        }.files.sort { it.name }
        def catalogCompiledCount = 0
        def catalogMachineIds = [] as Set
        def catalogMachineTags = [] as Set
        def catalogMachineTagsById = [:].withDefault { [] as Set }
        if (catalogCompiledFiles.isEmpty()) {
            violations << "compiled machine catalog output missing content/machines/machine-catalog












).count
            def providerDescriptionCount = (catalogText =~ /(?m)^      description:\s*/).count
            if (providerSlotCount != 368) {
                violations << "compiled machine catalog expected provider slots on every input/output provider, got ${providerSlotCount}"
            }
            if (providerDescriptionCount != 368) {
                violations << "compiled machine catalog expected provider description on every input/output provider, got ${providerDescriptionCount}"
            }
            def currentMachine = null
            def inTags = false
            def slotList = null
            catalogText.readLines().each { line ->
                def machineMatch = line =~ /^  ['"]?(sf:[^'":\s]+)['"]?:\s*$/
                if (machineMatch.matches()) {
                    currentMachine = machineMatch[0][1]
                    if (catalogMachineIds.contains(currentMachine)) {
                        violations << "compiled machine catalog contains duplicate machine id ${currentMachine}"
                    }
                    catalogMachineIds << currentMachine
                    inTags = false
                    slotList = null
                    return
                }
                if (currentMachine == null) {
                    return
                }
                def statusSlotMatch = line =~ /^    status-slot:\s*(-?\d+)\s*$/
                if (statusSlotMatch.matches() && Integer.parseInt(statusSlotMatch[0][1]) < -1) {
                    violations << "compiled machine catalog ${currentMachine} status-slot must be -1 or greater"
                }
                def topLevelSlotListMatch = line =~ /^    (input-slots|output-slots):\s*$/
                if (topLevelSlotListMatch.matches()) {
                    slotList = topLevelSlotListMatch[0][1]
                    return
                }
                if ((line =~ /^      slots:\s*$/).matches()) {
                    slotList = 'provider.slots'
                    return
                }
                if (slotList != null && (line =~ /^\s{4,6}[A-Za-z0-9_-]+:\s*/).matches()) {
                    slotList = null
                }
                if (slotList != null) {
                    def slotValueMatch = line =~ /^\s+-\s*(-?\d+)\s*$/
                    if (slotValueMatch.matches() && Integer.parseInt(slotValueMatch[0][1]) < 0) {
                        violations << "compiled machine catalog ${currentMachine} ${slotList} contains negative slot ${slotValueMatch[0][1]}"
                    }
                }
                if ((line =~ /^    tags:\s*$/).matches()) {
                    inTags = true
                    return
                }
                if (inTags && (line =~ /^    [A-Za-z0-9_-]+:\s*/).matches()) {
                    inTags = false
                }
                if (inTags) {
                    def tagMatch = line =~ /^    -\s*(.+?)\s*$/
                    if (tagMatch.matches()) {
                        def tag = cleanScalar(tagMatch[0][1])
                        if (tag != null && !tag.isBlank()) {
                            def cleanedTag = cleanTag(tag)
                            catalogMachineTags << cleanedTag
                            catalogMachineTagsById[currentMachine] << cleanedTag
                        }
                    }
                }
            }
            recipeMachineReferences.each { ref ->
                if (!catalogMachineIds.contains(ref.machine)) {
                    violations << "${ref.rel}: recipe ${ref.recipe} references unknown machine ${ref.machine}"
                }
            }
            recipeMachineTagReferences.each { ref ->
                if (!catalogMachineTags.contains(ref.tag)) {
                    violations << "${ref.rel}: recipe ${ref.recipe} references unknown runtime-machine tag ${ref.tag}"
                }
            }
        }
        def manualCompiledFile = new File(root, 'content/machines/manual-machines/manual-machines.yml')
        def manualCompiledCount = 0
        def manualMachineTags = [] as Set
        if (!manualCompiledFile.isFile()) {
            violations << "compiled manual machine output missing content/machines/manual-machines/manual-machines.yml"
        } else {
            def manualText = manualCompiledFile.getText('UTF-8')
            manualCompiledCount = (manualText =~ /(?m)^  ['"]?sf:[^'"\r\n]+['"]?:\s*$/).count
            if (manualCompiledCount != 13) {
                violations << "compiled manual machine entry count expected 13, got ${manualCompiledCount}"
            }
            ['name-key:', 'icon:', 'operation:', 'trigger-face:', 'inventory-face:', 'deployable:', 'tags:', 'pattern:', 'display-pattern:'].each { token ->
                def count = (manualText =~ /(?m)^\s+${java.util.regex.Pattern.quote(token)}/).count
                if (count < 13) {
                    violations << "compiled manual machines expected ${token} on every entry, got ${count}"
                }
            }
            if ((manualText =~ /(?m)^    name:\s*/).find()) {
                violations << "compiled manual machines must not contain literal name fields"
            }
            def manualPatternSlotTypeCount = (manualText =~ /(?m)^    - type:\s*/).count
            if (manualPatternSlotTypeCount != manualCompiledCount * 18) {
                violations << "compiled manual machine pattern slots expected explicit type on every slot, got ${manualPatternSlotTypeCount}"
            }
            def inManualPattern = false
            def inManualTags = false
            manualText.readLines().each { line ->
                if ((line =~ /^    (pattern|display-pattern):\s*$/).matches()) {
                    inManualPattern = true
                    inManualTags = false
